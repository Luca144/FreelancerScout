al checklists in collaboration with the respective business units. · Defect Management: Identify, document, and track functional defects found during testing, working with technical teams to ensure timely resolution. · Report Comparison: Perform detailed gap analyses between existing \"As-Is\" reports (management reporting, client statements, regulatory filings) and the \"To-Be\" standard reports provided by the new platform. · Functional Requirement Definition : Identify missing data points or formatting discrepancies in standard reports and define the requirements to bridge these gaps (e.g., through custom report development or manual workarounds). Strategic & Operational Support · Provide data-driven support for Business Planning and hands-on support for operational topics to ensure stability during transition periods. Product Coordination · Coordinate the local project with Global Product teams across Middle Office, Transaction Management, and Tri-Party Collateral Management. · Support documentation related to relevant governance and operational requirements. Required Expertise, Qualification & Skillset: · Fund Administration: NAV Calculation, Financial Reporting, and Accounting Workflows. · Risk & Specialized Markets: Derivatives Clearing, Collateral Management, Security Lending, OTC Instruments and FX Trading . · Governance: Legal requirements related to fund structures. · Accounting Lifecycle: Comprehensive understanding of the end-to-end NAV production process, including trial balance reconciliation and expense accruals. · Data Flow Analysis: Ability to map complex data movements between fund accounting systems, trading platforms, and third-party providers. · Regulatory Compliance: Strong knowledge of the regulatory landscape governing fund administration (e.g., UCITS, AIFs). · Product Knowledge: Familiarity with various fund types (Money Market, Equity, Fixed Income, Derivatives-based funds) and their specific accounting requirements. · Knowledge of Investment Compliance and Regulatory Reporting · Experience collaborating with international, cross-functional teams and global product owners. · Professional experience in the Custody environment, preferably in Middle Office and Collateral Management projects, particularly with Tri-Party Collateral Agents. · In-depth understanding of securities and derivatives processes (clearing, settlement, trade lifecycle management). · Excellent written and verbal proficiency in German and English; ability to articulate complex topics clearly and concisely · Analytical Excellence: An exceptional eye for detail, specifically regarding numerical accuracy and data consistency · Communication: High proficiency in communicating technical accounting requirements to non-specialist stakeholders. · Documentation: Strong ability to create structured, clear, and audit-ready process documentation. · Problem Solving: A proactive approach to identifying operational bottlenecks and proposing scalable solutions.", "published": "2026-10-01T20:55:30+02:00", "matched_keywords": ["business analyst", "product owner", "ems"], "source": "freelancermap.de", "first_seen": "2026-10-01T22:36:28.171151+00:00"}, {"id": "82fb8be6c1996d94", "title": "Syndikusrechtsanwalt IT-Recht / ANÜ (m/w/d)", "url": "https://www.freelancermap.de/projekt/syndikusrechtsanwalt-it-recht-anue-m-w-d", "description": "Westhouse ist eines der führenden Recruitment-Unternehmen für die Vermittlung hochqualifizierter Fachexperten aus dem gesamten IT-Lifecycle- und Engineering-Bereich. Für unseren Kunden suchen wir aktuell eine/n Syndikusrechtsanwalt IT-Recht / ANÜ (m/w/d) Rahmeninformationen Referenz: 180371 Einsatzort: Stuttgart (3 Tage pro Woche vor Ort) Starttermin: 01.01.2027 Arbeitszeit: Vollzeit 40 Std/Woche Dauer: 12 Monate Ihre Qualifikationen - Sie verfügen über überdurchschnittliche Examina (Prädikatsexamen) und haben bereits mehrjährige einschlägige Berufserfahrung gesammelt - Sie verfügen über eine rasche Auffassungsgabe sowie st_seen": "2026-09-30T19:48:42.076180+00:00", "id": "c74b2edad4b87e43", "matched_keywords": ["netz"], "published": "2026-09-30T19:37:14+02:00", "source": "freelancermap.de", "title": "IT Onsite Support Techniker / Second Level Support", "url": "https://www.freelancermap.de/projekt/it-onsite-support-techniker-second-level-support"}, {"description": "Nexora entwickelt dezentrale Energieprojekte mit Photovoltaik, Speichern, Ladeinfrastruktur und Wärmepumpen. Für konkrete Anfragen zum Energy Sharing nach § 42c EnWG suchen wir einen erfahrenen Freelancer, der mit uns ein fachlich belastbares, wirtschaftlich umsetzbares Angebot entwickelt und erste Kundenprojekte begleitet. Nexora übernimmt technische Projektentwicklung, Kundensteuerung und perspektivisch digitale Prozesse und Daten. Du strukturierst die energiewirtschaftlichen Rollen und bindest geeignete Lieferanten, Direktvermarkter, Bilanzkreisverantwortliche, Messstellenbetreiber und Abrechnungsdienstleister ein. Die Rolle des Anlagenbetreibers als Sharing-Lieferant und die Aufgaben beauftragter Dienstleister sind dabei sauber abzugrenzen. DEINE AUFGABEN • Eingehende Anfragen qualifizieren und die grundsätzliche Umsetzbarkeit nach § 42c EnWG prüfen – einschließlich Teilnehmerkreis, Betreiberstruktur und Ausschlusskriterien. • Energy Sharing gegenüber Mieterstrom, gemeinschaftlicher Gebäudeversorgung, Direktlieferung und sonstiger Direktvermarktung abgrenzen. • Rollen-, Vertrags- und Dienstleistungsmodelle sowie die Zusammenarbeit mit erforderlichen Marktpartnern entwickeln. • Mess-, Bilanzierungs- und Abrechnungsprozesse konzipieren: Aufteilungsschlüssel, viertelstündliche Messwerte, iMSys, Markt- und Messlokationen sowie energiewirtschaftliche Datenflüsse. • Praktikable Modelle für Reststromlieferung und Überschussvermarktung erarbeiten. • Plattformen und Marktpartner bewerten sowie Kunden-, Partner- und Dienstleistergespräche fachlich begleiten. • Qualifizierungschecklisten, Entscheidungskriterien, Vertriebsunterlagen, Angebotsbausteine und FAQ erstellen. • Fachliche Anforderungen in umsetzbare Prozesse und Softwareanforderungen übersetzen und den Nexora-Vertrieb schulen. DEIN PROFIL • Mehrjährige praktische Erfahrung in der deutschen Energiewirtschaft, gute Kenntnisse von § 42c EnWG und der aktuellen Umsetzungshinweise der Bundesnetzagentur. • Praxiserfahrung in mindestens drei Bereichen: Stromlieferung, Direktvermarktung, Bilanzkreismanagement, Marktkommunikation (GPKE, MaBiS, WiM), Energiedatenmanagement/EDM, Messstellenbetrieb/iMSys, Energieabrechnung, Reststromlieferung oder gemeinschaftliche Versorgungskonzepte. • Sicheres Verständnis der Marktrollen und Fähigkeit, durchgängige Abläufe vom Anlagenbetreiber bis zur Abrechnung zu strukturieren. • Erfahrung mit konkreten Kundenprojekten, wirtschaftlicher Bewertung und operativer Umsetzung. • Sicheres Auftreten in Kunden- und Partnergesprächen, verständliche Kommunikation und sehr gute Deutschkenntnisse. Besonders interessant: Energy Communities, Mieterstrom, gemeinschaftliche Gebäudeversorgung, Quartiersstrom, PV mit mehreren Verbrauchsstellen, C&I-/Mehrmieterprojekte, Marktprämienmodelle, dynamische Tarife, Energieplattformen, White-Label-Liefermodelle sowie Produktentwicklung bei Lieferanten, Stadtwerken oder Energiedienstleistern. Pre-Sales-/Solution-Consulting-Erfahrung und ein Netzwerk geeigneter Marktpartner sind von Vorteil. Gesucht ist praktische Umsetzungskompetenz mit Marktprozesserfahrung, fachlicher Tiefe und einem plattformunabhängigen Blick. ERSTE PHASE: CA. VIER BIS SECHS WOCHEN Gemeinsam erarbeiten wir: 1. Review ausgewählter Nexora-Anfragen und Einordnung nach Umsetzbarkeit, Modell und Partnerbedarf. 2. Qualifizierungscheckliste und Ausschlusskriterien für neue Anfragen aus Haushalten, KMU, Kommunen und Mehrmieter-/Gewerbeprojekten. 3. Rollen- und Prozessmodell einschließlich Vertrags-, Mess-, Daten- und Abrechnungsprozessen. 4. Partner-Matrix mit Anforderungen und Auswahlkriterien. 5. Struktur für Kundengespräche, Erstberatung und erste Machbarkeits-/Wirtschaftlichkeitsbewertungen. 6. Anforderungen an digitale Prozesse und Software sowie Empfehlungen für erste Pilotprojekte. ZUSAMMENARBEIT Start kurzfristig, freiberuflich und überwiegend remote. Auslastung flexibel nach Abstimmung; einzelne Kunden- und Partnertermine nach Vereinbarung. Zusammenarbeit direkt mit Geschäftsführung, Projektleitung und Softwareteam. Anschließend projektbezogene Unterstützung auf Abruf möglich. DEINE BEWERBUNG Bitte sende Profil/Projektliste, zwei bis drei relevante Referenzen, früheste Verfügbarkeit, mögliche Auslastung und Remote-Stunden- oder Tagessatz. Beantworte außerdem kurz: 1. Welche Marktrollen müssen bei Energy Sharing nach § 42c EnWG abgedeckt werden? 2. Welche Aufgaben kann Nexora übernehmen, welche sollten Partner übernehmen? 3. Welche Stromliefer-, Direktvermarktungs-, Mieterstrom- oder Energy-Sharing-Modelle hast du praktisch begleitet? 4. Kannst du konkrete Kundenanfragen prüfen und Kundengespräche unterstützen? 5. Hast du Kontakte zu geeigneten Marktpartnern? Entscheidend ist deine praktische Erfahrung – auch wenn dein Profil bisher nicht ausdrücklich „Energy Sharing“ heißt.", "first_seen": "2026-09-30T19:48:42.076180+00:00", "id": "a768036ee1c26429", "matched_keywords": ["energie", "stadtwerke", "netz", "marktkommunikation"], "published": "2026-09-30T19:29:17+02:00", "source": "freelancermap.de", "title": "Senior Consultant Energy Sharing (§ 42c EnWG) | Energiewirtschaft & Pre-Sales", "url": "https://www.freelancermap.de/projekt/senior-consultant-energy-sharing-42c-enwg-energiewirtschaft-und-pre-sales"}, {"description": "Für ein Krankenkassen-Institut suchen wir Verstärkung im Identity Management (Integration & Delivery) zur IT-Transition zweier Kassen zu einem neuen RZ-Provider. Start: 01.10.2026 Laufzeit : 12 Monate (mit Option auf Verlängerung) Laufzeit: 120 Beratertage (Auslastung ca. 50 %) Einsatzort: sporadisch Projektmeetings nach Bedarf in Nürnberg, Schwäbisch Gm lb klar definierter Runbooks, Betriebsverfahren und Entscheidungsgrenzen gearbeitet. Bekannte Fehlerbilder und Standardmaßnahmen werden selbständig gelöst. Komplexe oder nicht dokumentierte Situationen werden strukturiert an die zuständigen Mainframe-Spezialisten, Fachbereiche oder Hersteller übergeben. Aufgaben Zu den Aufgaben gehören insbesondere: • aktive Überwachung produktiver z/OS-Systeme und der zugehörigen Infrastruktur • Bearbeitung von Monitoring Events, Alerts, WTORs, Dumps und Systemmeldungen einschließlich kontrollierter Operator Replies • Annahme, Priorisierung, Klassifizierung und technische Erstdiagnose von Incidents anhand von Auswirkung, Dringlichkeit und Servicekritikalität • Korrelation zusammengehöriger Alerts sowie End-to-End- und Cross-Domain-Triage zur Eingrenzung der tatsächlichen Serviceauswirkung • Abgleich von Monitoring-, Console- und Ticketinformationen sowie Erkennen transienter gegenüber anhaltenden Störungen • Durchführung bekannter Fehlerbehebungen und Standardmaßnahmen nach Runbook • Bearbeitung und Durchführung standardisierter Service Requests • Überwachung und Steuerung von Batch-Verarbeitung und JES2 • Analyse und Behandlung von Batch-Jobs, Loops und Spool-Engpässen • Starten, Stoppen und Überwachen von Started Tasks über System Automation oder z/OS Commands • operative Unterstützung bei Workload-Verlagerungen • Unterstützung und Durchführung freigegebener IPL-, POR- und LPAR-Restart-/Activation-Abläufe einschließlich definierter Pre- und Post-Checks • Überwachung von Workload, Systemperformance und Capacity-Indikatoren einschließlich CPU/zIIP sowie MSU/MIPS • Unterstützung bei CICS-, MQ- und DB2-bezogenen Betriebsstörungen • Durchführung definierter CICS- und MQ-Operations • technische Unterstützung im Parallel-Sysplex- und Coupling-Facility-Umfeld • operative Tätigkeiten an HMC und PROCOPS nach freigegebenen Verfahren, einschließlich LoadParm, Sysload und Activation Profiles Technischer Hintergrund / Anforderungen Erforderlic ache: Deutsch (C2 / annähernd muttersprachliche Kenntnisse) 3. Aufgaben & Scope (Leistungsumfang) Durchführung strukturierter Analysen der Ist-Situation sowie Erarbeitung und Dokumentation von Ziel-, Lösungs- und Umsetzungsbildern in der IT-Landschaft des Auftraggebers. Erfassung, Strukturierung und Qualifizierung von technischen und geschäftlichen Anforderungen. Bewertung und Erstellung von IT-Strategien, Architektur- und Lösungskonzepten für digitale Produkte. Fachliche Beratung zur Konformität mit Digitalisierungs- und IT-Strategien, Zielbildern und Architekturvorgaben. Analyse/Dokumentation technischer, rechtlicher und organisatorischer Randbedingungen (z. B. Datenschutz, Schnittstellen). Durchführung von IT-Governance-Analysen (z. B. Risk Assessments) und Definition geeigneter Maßnahmen. Qualitäts- und Risikomanagement sowie regelmäßige Aktualisierung von Roadmaps und Zielarchitekturen. Besonderer Fokus: Beratung und fachliche Unterstützung bei der Ausarbeitung der Soll-Geschäftsprozesse im Bereich Finance & Controlling, Beschaffung und Lizenzmanagement . Bearbeitung fachlicher Themenfelder (z. B. Risikomanagement, Abhängigkeitsmanagement, Integrationsfragen). Schnittstelle und Vermittlung zwischen IT-Umsetzung, Fachbereichen und Programm-Management bei komplexen Fragestellungen. Unterstützung bei der Moderation von Abstimmungsprozessen über alle Projektphasen hinweg (Konzeption, Entwicklung, Test, Einführung/Cutover). 4. Anforderungsprofil Muss-Kriterien (Zwingende Anforderungen - AUSSCHLUSSKRITERIEN) M1: Erfahrung im fachlichen Anforderungsmanagement (Requirements Engineering) in komplexen IT-Digitalisierungs- oder Transformationsvorhaben ( Senior > 5 Jahre Erfahrung ). M2: Erfahrung im fachlichen Geschäftsprozessmanagement in komplexen IT-Digitalisierungs- oder Transformationsvorhaben in Unternehmen mit mehr als 5.000 Beschäftigten ( Mind. 3 Referenzen ). M3: Erfahrung im fachlichen Einführungsmanagement von IT-Lösungen in komplexen IT-Digitalisierungs- oder Transformationsvorhaben in Unternehmen mit mehr als 5.000 Beschäftigten ( Mind. 2 Referenzen ). M4: Erfahrung im fachlichen Schnittstellenmanagement in komplexen IT-Digitalisierungs- oder Transformationsvorhaben in Unternehmen mit mehr als 5.000 Beschäftigten ( Mind. 3 Referenzen ). M5: Erfahrung in der Entwicklung von Enablement-Konzepten für betroffene Fachbereiche im Rahmen von hochkomplexen Transformationsvorhaben ( Mind. 2 Referenzen ). Soll-Kriterien (Bewertungskriterien – Gewichtung je 20 %) S1 (20 %): Erfahrung in der fachlichen Bearbeitung regulatorischer oder Compliance-bezogener Anforderungen in komplexen IT-Digitalisierungs- oder Transformationsvorhaben in Unternehmen mit > 5.000 Beschäftigten ( Mind. 2 Referenzen ). S2 (20 %): Erfahrung in der fachlichen Weiterentwicklung von IT-Serviceprozessen innerhalb komplexer IT-Serviceportfolios in Unternehmen mit > 5.000 Beschäftigten ( Mind. 3 Referenzen ). S3 (20 %): Erfahrung in der fachlichen Planung oder Begleitung von Tests für IT-Lösungen in komplexen IT-Digitalisierungs- oder Transformationsvorhaben in Unternehmen mit > 5.000 Beschäftigten ( Mind. 2 Referenzen ). S4 (20 %): Erfahrung in der fachlichen Planung oder Koordination von Releases oder Cutover-Aktivitäten für IT-Lösungen in komplexen IT-Digitalisierungs- oder Transformationsvorhaben in Unternehmen mit > 5.000 Beschäftigten ( Mind. 2 Referenzen ). S5 (20 %): Erfahrung in der fachlichen Moderation von Abstimmungsprozessen in komplexen IT-Digitalisierungs- oder Transformationsvorhaben in Unternehmen mit > 5.000 Beschäftigten ( Mind. 2 Referenzen ).", "first_seen": "2026-09-24T21:57:00.867893+00:00", "id": "5c1b38cd7de97c6a", "matched_keywords": ["requirements engineer", "agil", "ems"], "published": "2026-09-24T22:39:37+02:00", "source": "freelancermap.de", "title": "IT Consultant_Finanzumfeld_Cutover #3326", "url": "https://www.freelancermap.de/projekt/it-consultant-finanzumfeld-cutover-3326"}, {"description": "Interim Senior Projektmanager (m/w/d  Monate mit Verlängerungsoption / Ort: 50% Bayern / 50% Remote / Projekt-ID: 5438 Unser Kunde ist ein bedeutender Akteur im süddeutschen Versicherungswesen und sorgt mit rund 7.500 Mitarbeitenden für den Schutz privater und gewerblicher Versicherungsnehmer. In dieser Position steuern Sie ein bereichsübergreifendes Programm mit mehreren Workstreams, leiten die Steering Committees auf Managementebene und führen das PMO. Sie behalten Ziele, Meilensteine, Abhängigkeiten und Risiken im Blick, treiben ausstehende Entscheidungen konsequent voran und sorgen dafür, dass das Programm sicher ins Ziel kommt. Ihre Aufgaben: Steuerung eines bereichsübergreifenden Programms mit mehreren parallelen Workstreams aus Fachbereich und IT Vorbereitung und Leitung von Steering Committees auf Managementebene inklusive Erstellung der Entscheidungsvorlagen Überwachung von Zielen, Meilensteinen, Abhängigkeiten und Risiken über alle Workstreams hinweg Eskalation kritischer oder ausstehender Entscheidungen sowie konsequentes Follow-up bis zur Umsetzung Steuerung und Koordination des PMO sowie Sicherstellung einheitlicher Standards im Programm Koordination vieler Beteiligter wie Fachbereiche, IT, Softwarehersteller und externe Dienstleister Einbringen von AI- bzw. AI-First-Ansätzen in Programmsteuerung und Arbeitsweise Ihr Profil: Langjährige Erfahrung im Programmmanagement großer, bereichsübergreifender Vorhaben mit parallelen Workstreams Nachweisbare Erfahrung in der Vorbereitung und Leitung von Steering Committees auf Managementebene Souveränes Stakeholder-Management auch ohne formale Weisungsbefugnis sowie sicheres Auftreten vor Management und Vorstand Fundierte Kenntnisse in Risiko-, Abhängigkeits- und Meilensteinmanagement Durchsetzungsstärke und Entscheidungsorientierung; stellt kritische Fragen und argumentiert faktenbasiert Idealerweise Branchenerfahrung im Versicherungswesen, bevorzugt mit Kernsystem-Migrationen oder der Stabilisierung laufender Programme AI- bzw. AI-First-Ansätzen wün : "b59a40e6c66d32c5", "matched_keywords": ["energie", "netz"], "published": "2026-09-24T18:06:55+02:00", "source": "freelancermap.de", "title": "HSE-Management und Auditierung im Bauwesen", "url": "https://www.freelancermap.de/projekt/hse-management-und-auditierung-im-bauwesen"}, {"description": "Sie bringen Unternehmen mit den richtigen KI-Lösungen zusammen – und profitieren direkt von Ihrem Erfolg: mit attraktiver Provision, Vergütung für qualifizierte Termine und zusätzlichen Abschlussboni. Bei starkAI unterstützen wir mittelständische Unternehmen dabei, KI sinnvoll und praxisnah einzusetzen. Unser Angebot reicht von KI-Strategie und der Identifikation konkreter Use Cases über Beratung und Mitarbeiterschulungen bis zur technischen Umsetzung und eigenen KI-Infrastruktur. Wir sind im Raum Stuttgart/Karlsruhe ansässig und suchen für den Ausbau unseres Vertriebs selbstständige B2B-Vertriebspartner auf Provisionsbasis. Die Kundengewinnung ist dabei nicht auf unsere Region beschränkt – ausdrücklich interessant sind Unternehmenskunden aus dem gesamten DACH-Raum. Ihre Rolle Sie sprechen potenzielle Unternehmenskunden und Entscheider an, identifizieren erste Bedarfe und begleiten die Kundenbeziehung vom Erstkontakt bis zum Abschluss. Dabei müssen Sie kein KI-Techniker sein: Bei fachlichen Fragen, Workshops, Demos und der Ausarbeitung konkreter Lösungen unterstützt Sie unser Team. Besonders interessant sind Vertriebspartner, die bereits über ein eigenes Netzwerk im Mittelstand verfügen. Eigenständige Neukundenakquise ist ebenfalls ausdrücklich erwünscht. Was Sie bei uns verkaufen Kein einzelnes Produkt, sondern unterschiedliche Bausteine rund um die KI-Transformation von Unternehmen, beispielsweise: KI-Strategieberatung und Identifikation geeigneter Use Cases Workshops und KI-Schulungen für Unternehmen Entwicklung und Automatisierung individueller KI-Prozesse Aufbau unternehmensinterner KI-Lösungen Lokale KI-Infrastruktur und unsere starkAI Box Dadurch können wir je nach Unternehmen mit einem kleineren Workshop oder Beratungsprojekt starten und daraus langfristige Kundenbeziehungen entwickeln. Was wir bieten Attraktive erfolgsbasierte Provision Vergütung für qualifizierte Verkaufstermine Zusätzliche Boni bei erfolgreichen Abschlüssen Freie Zeiteinteilung und eigenständige Organisation Ihrer Vertriebsaktivitäten Flexible Zusammenarbeit auf selbstständiger Basis Unterstützung durch unser technisches und strategisches Team Breites Leistungsportfolio statt eines einzelnen Produkts Kundenakquise im gesamten DACH-Raum Was Sie mitbringen sollten Sie haben Erfahrung im B2B-Vertrieb, können mit Geschäftsführern und anderen Entscheidern auf Augenhöhe kommunizieren und arbeiten eigenständig. Ein bestehendes Netzwerk zu mittelständischen Unternehmen – beispielsweise aus Industrie, Produktion, Dienstleistung oder IT – ist ein großer Vorteil. Erfahrung im KI-Umfeld ist willkommen, aber keine Voraussetzung. Interesse? Schicken Sie uns eine kurze Vorstellung mit Ihrer bisherigen Vertriebserfahrung, den Branchen bzw. Regionen, in denen Sie gut vernetzt sind, und wie Sie sich eine Zusammenarbeit vorstellen. Wir freuen uns darauf, gemeinsam Unternehmen im DACH-Raum bei ihrer KI-Transformation zu begleiten.", "first_seen": "2026-09-24T18:10:26.660844+00:00", "id": "3c0bfd16c3b9806f", "matched_keywords": ["netz"], "published": "2026-09-24T18:06:34+02:00", "source": "freelancermap.de", "title": "Selbstständiger Vertriebspartner (m/w/d) für KI-Transformation im Mittelstand", "url": "https://www.freelancermap.de/projekt/selbststaendiger-vertriebspartner-m-w-d-fuer-ki-transformation-im-mittelstand-3052120"}, {"description": "Für unseren Kunden suchen wir ab sofort einen Projektmanager (m/w/d). Es kommen nur sozialversicherungspflichtig angestellte Mitarbeiter in Frage. Start: ab Mitte Oktober Ende: September 2027 mit Option Standort: Berlin Remoteanteil: 90% Auslastung: Vollzeit Stellenbeschreibung * Konzipierung einer projektbezogenen Steuerungsstruktur für die Digitalisierungsvorhaben mit Phasen, Arbeitspaketen, Meilensteinen, Ergebnisartefakten und Entscheidungspunkten. * Erstellung und Fortschreibung einer Umsetzungsroadmap mit priorisierten Ausbaustufen, Abhängigkeiten, Ressourcenbedarfen, Terminlogik und projektspezifischen Entscheidungsbedarfen. * Erarbeitung einer Projektgovernance mit Rollenmodell, Verantwortlichkeitszuordnungen, Gremienstruktur, Qualitätskriterien, Eskalationswegen und dokumentierten Entscheidungsformaten. * Fachliche Koordination projektspezifischer Abstimmungen zwischen Business Analyse, Fachbereichen, technischen Rollen, Architektur und externen Dienstleistern zur konsistenten Ergebnis- und Entscheidungsdokumentation. * Strukturierung der Übergänge von Anforderungsanalyse, Lösungsbewertung, Umsetzungsvorbereitung, Pilotierung und Einführung anhand nachvollziehbarer Kriterien und dokumentierter Ergebnisse. * Erstellung projektspezifischer Entscheidungs-, Status- und Steuerungsunterlagen für Abstimmungs- und Entscheidungstermine einschließlich offener Punkte, Handlungsoptionen und empfohlener nächster Schritte. * Erarbeitung fachlicher Ausschreibungs- und Bewertungsunterlagen für gemeinsame oder getrennte Beschaffungsszenarien, soweit dies für die projektspezifische Lösungsentscheidung erforderlich ist. * Erstellung und Pflege von Projektplänen, Backlogs, Maßnahmenlisten, Statusübersichten und Entscheidungsprotokollen als nachvollziehbare Projektartefakte. * Dokumentation des Risiko-, Änderungs- und Eskalationsmanagements einschließlich Maßnahmenverfolgung, Statusaufbereitung und projektspezifischer Kommunikationsunterlagen. * Fachliche Strukturierung von Lösungsbewertungen, Proofs of Concept, Pilotierungsansätzen und Einführungsszenarien. Profil • Nachgewiesene Erfahrung in der eigenständigen Erbringung von Projektmanagementleistungen für komplexe Digitalisierungs-, Prozess- oder Datenmanagementvorhaben mit mehreren fachlichen Beteiligten und externen Dienstleistern. • Nachgewiesene Kenntnisse in klassischen und agilen Projektmanagementmethoden sowie in der Erstellung von Termin-, Ressourcen-, Risiko-, Qualitäts-, Entscheidungs- und Änderungsmanagement-Artefakten. • Erfahrung in der Konzipierung von Projektvorgehen für End-to-End-Prozesse einschließlich Phasenmodell, Arbeitspaketen, Meilensteinen, Entscheidungspunkten und dokumentierten Ergebnisartefakten. • Erfahrung in der fachlichen Strukturierung von Anforderungs- und Stakeholdermanagement einschließlich Priorisierung von Use Cases, User Stories, Akzeptanzkriterien, nichtfunktionalen Anforderungen und dokumentierten Entscheidungsbedarfen. • Fachliches Verständnis von Dokumentenmanagement, strukturierten Datenmodellen, zentraler Datenhaltung, Versionierung, Freigabeworkflows und Änderungsnachverfolgung zur Bewertung projektbezogener Lösungsansätze. • Erfahrung in der Erstellung strukturierter Lösungsbewertungen, Bewertungsmatrizen, Entscheidungsvorlagen sowie Konzepten für Proofs of Concept, Pilotierung und Einführung digitaler Lösungen. • Erfahrung in der Erstellung deutschsprachiger Projekt-, Entscheidungs-, Status- und Ergebnisdokumentationen in vertraglich verwertbarer Qualität. Weitere Anforderungen: • Erfahrung im Energieversorgungs-, Übertragungsnetz- oder Infrastrukturumfeld, idealerweise in der Freileitungstechnik oder technischen Planung. • Verständnis für technische Stamm-, Planungs- und Bestandsdaten sowie für Übergaben zwischen Planung, Bau, Betrieb, Asset Management und Beschaffung. • Erfahrung in der Erstellung fachlicher Ausschreibungs-, Lastenheft- und Bewertungsunterlagen einschließlich Kriterienkatalogen, Angebotsauswertungen und Entscheidungsvorlagen. • Grundkenntnisse in BIM, GIS, 2D-/3D-Modellen, As-Built-Daten und deren Einbindung in digitale Prozessketten. • Erfahrung mit Material- oder Asset-Management-Systemen und Schnittstellenthemen, beispielsweise MAFID, sowie mit Datenqualität und Data Governance. • Kenntnisse in BPMN oder vergleichbaren Methoden zur Prozessmodellierung.", "first_seen": "2026-09-24T18:10:26.660844+00:00", "id": "f5e524d86db25b53", "matched_keywords": ["projektmanager", "agil", "energie", "netz", "übertragungsnetz"], "published": "2026-09-24T17:57:47+02:00", "source": "freelancermap.de", "title": "Projektmanager (m/w/d)", "url": "https://www.freelancermap.de/projekt/projektmanager-m-w-d-3052117"}, {"description": "Für ein anspruchsvolles Entwicklungsprojekt im Aerospace - Umfeld suchen wir einen erfahrenen Electrical Power Systems Architect (m/w/d) mit Schwerpunkt auf der Konzeption und Auslegung elektrischer Systemarchitekturen für Luftfahrzeuge. Im Mittelpunkt steht die Entwicklung eines modernen unbemannten Luftfahrzeugs mit einer Vielzahl elektrischer und elektronischer Systeme. Sie verantworten dabei nicht die Entwicklung einzelner elektrischer Komponenten, sondern die Architektur des elektrischen Gesamtsystems des Flugzeugs – von der Energieerzeugung über die Verteilung bis zur Versorgung der einzelnen Verbraucher. Ihre Aufgaben Entwicklung und Definition der Electrical Power System Architecture auf Aircraft-Ebene Konzeption des elektrischen Bordnetzes und der Energieverteilung Definition von Energieerzeugung, Speicherung und Verteilung Erstellung und Weiterentwicklung von Power Budgets und Electrical Load Analyses Ermittlung und Bewertung des Energiebedarfs verschiedener Flugzeugsysteme Definition geeigneter Spannungs- und Versorgungskonzepte Auslegung von Power Distribution und elektrischen Schnittstellen auf Systemebene Betrachtung von Redundanz, Verfügbarkeit und Fehlerfällen Definition von Anforderungen an nachgelagerte Power- und Electrical-Hardware Analyse von Betriebszuständen und unterschiedlichen elektrischen Lastprofilen Abstimmung der elektrischen Architektur mit Avionik, Flight Control, Propulsion, Mission Systems und weiteren Fachbereichen Bewertung der Auswirkungen neuer Systeme und Payloads auf das elektrische Gesamtsystem Entwicklung von Konzepten für Lastmanagement und Priorisierung elektri istiges Großprojekt im Bereich Energie und Kraftwerksbau suchen wir kurzfristig einen sehr erfahrenen freiberuflichen Oberbauleiter / Site Construction Manager (m/w/d) für den Standort Gelsenkirchen Scholven . Projekt Am Standort Gelsenkirchen Scholven entsteht eine neue, zukunftsfähige H2 Ready GuD Anlage (CCGT) mit einer Leistung von ca. 860 MW . Der Anlagenumfang umfasst unter anderem Gasturbine, Dampfturbine, Abhitzekessel, Generatoren und Transformatoren. Ergänzend gehören verschiedene infrastrukturelle Schnittstellen sowie eine separate Gas Verdichterstation zum Projektumfang. Das Projekt befindet sich aktuell in der vorbereitenden Bauphase. Rückbauarbeiten und Erdbewegungen zur Baufeldvorbereitung laufen bereits. Gesucht wird eine erfahrene Persönlichkeit, die das Projekt über die langfristige Errichtungsphase bis zur Inbetriebnahme begleitet. Aufgaben Im Mittelpunkt steht die fachliche Begleitung, Koordination und Überwachung der Errichtungsaktivitäten auf der Baustelle. Zu den wesentlichen Aufgaben gehören: Fachliche Begleitung und Koordination der Bauaktivitäten im Großanlagenbau Überwachung des Baufortschritts sowie Identifikation, Dokumentation und Nachverfolgung von Abweichungen, Verzögerungen und Mängeln Fachliche Koordination der verschiedenen Gewerke und Schnittstellen im Brownfield Umfeld Sicherstellung und fachliche Prüfung eines gesetzes, genehmigungs und regelkonformen Baustellenbetriebs Überwachung der Einhaltung der relevanten Anforderungen gemäß BauO NRW sowie weiterer Genehmigungen, Vorschriften und betrieblicher Vorgaben Beratung hinsichtlich Arbeitssicherheit, Umweltschutz, Notfallorganisation und HSSE Aktive Umsetzung einer ausgeprägten Safety Culture nach dem Prinzip „Safety from Day One“ Fachliche Begleitung der Schnittstellen zum laufenden Betrieb, insbesondere Permit to Work Planung, Vorbereitung und Moderation von Bau und Koordinationsbesprechungen Abstimmung mit EPC Contractor, weiteren Auftragnehmern, Behörden, Gutachtern, Auditoren, Betriebsorganisation und weiteren Stakeholdern Prüfung und Nachverfolgung von Nebenbestimmungen aus Genehmigungen und Verträgen Erstellung von Statusberichten, Analysen, Handlungsempfehlungen und Entscheidungsvorlagen Fachliche Prüfung von Nachweisen für eingesetzte Geräte und Betriebsmittel Fachtechnische Prüfung von Rechnungen sowie Vorbereitung von Entscheidungsvorlagen für Claims und Vertragsverhandlungen Vorbereitung und fachliche Begleitung von Abnahmen, behördlichen Prüfungen und Inspektionen Beweissicherung bei Mängeln, Verzögerungen und Abweichungen Unterstützung bei Unfalluntersuchungen, Lessons Learned und der Ableitung von Verbesserungsmaßnahmen Fachliche Beratung des Projektmanagements sowie der Bereiche HSSE, QA/QC, Dokumentenmanagement und Betrieb Umfassende Projektdokumentation der Ergebnisse und relevanten Baustellenvorgänge Zusätzlicher Projektumfang am Standort Scholven Neben der eigentlichen GuD Anlage umfasst das Projekt weitere relevante Schnittstellen und Teilprojekte, unter anderem: Errichtung einer separaten Gas Verdichterstation Trinkwassergebäude Regenwasserrückhaltebecken 380 kV Anschluss über einen separaten Lieferanten Fernwärmeanschluss inklusive Leitungsverlegung Koordination verschiedener Terminal Points und technischer Schnittstellen Anforderungen Gesucht wird ausdrücklich ein Profil mit langjähriger Erfahrung in komplexen Großprojekten . Rahmenbedingungen Projektstandort: Gelsenkirchen Scholven Projektstart: schnellstmöglich Laufzeit: langfristig, geplant ca. 60 Monate Auslastung: ca. 50 Stunden pro Woche Einsatz: 100 Prozent vor Ort auf der Baustelle Remote: nicht vorgesehen Projektphase: vorbereitende Baumaßnahmen laufen bereits Interviews: geplant ab KW 41 Bei Interesse freuen wir uns über die Zusendung eines aktuellen Projektprofils unter Angabe von: Verfügbarkeit beziehungsweise frühestmöglichem Starttermin Stundensatz Wohnort beziehungsweise Reisebereitschaft Relevanten Referenzprojekten im Kraftwerks oder Großanlagenbau Pr ch etwas bewegen und unterstützen mit einem Teil der erwirtschafteten Gewinne ein soziales Bildungsprojekt. Wir sind ein dynamisches Team, das komplett remote und ortsunabhängig arbeitet. Bei unserer Arbeit sind uns Chancengleichheit, Freiheit und persönliches Wachstum wichtig. Wir brennen für das, was wir tun, und fiebern schon jetzt unserem nächsten Launch entgegen. Was deine Aufgaben sind: Du bist AnsprechpartnerIn für alle CreatorInnen, KurserstellerInnen und Affiliates des Freiheitspakets. Du gewinnst neue PartnerInnen für das Freiheitspaket und begeisterst sie für die Teilnahme am Launch. Du betreust unsere PartnerInnen während des gesamten Launch-Prozesses und bist ihre zentrale Ansprechperson. Du unterstützt und motivierst unsere PartnerInnen dabei, sich aktiv und erfolgreich am Launch zu beteiligen. Du bist die Schnittstelle zwischen Launch-Management, PartnerInnen und Produktverantwortlichen und stellst eine reibungslose Kommunikation sicher. Was wir bieten: Eine komplett ortsunabhängige Tätigkeit mit Freiräumen bei der Zeiteinteilung. Eine sehr abwechslungsreiche Aufgabe mit viel Kontakt zu spannenden Menschen. Eine offene, transparente und angenehme Arbeitsatmosphäre. Die Möglichkeit, ein wachsendes Unternehmen aktiv mitzugestalten. Die Zusammenarbeit mit und das Lernen von erfahrenen Online-Marketing-ExpertInnen. Die einzigartige Erfahrung, Teil eines großen Online-Business-Projekts zu sein. Die Möglichkeit, dir ein starkes Netzwerk im Online-Business-Bereich aufzubauen. Eine leistungsgerechte Bezahlung auf Freelance-Basis. Perspektivisch die Möglichkeit einer langfristigen Zusammenarbeit. Was wir uns von dir wünschen: Du bringst außergewöhnlich viel Motivation und Eigeninitiative mit. Du kommunizierst klar, verbindlich und auf Augenhöhe. Du kannst andere Menschen begeistern, motivieren und für eine gemeinsame Sache gewinnen. Du hast Erfahrung im Bereich Vertrieb / Sales und Spaß daran, aktiv auf Menschen zuzugehen. Du hast keine Berührungsängste im Kon
