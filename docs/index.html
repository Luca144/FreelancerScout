keit und Kosten CI/CD-Plattform weiterentwickeln: Sie übernehmen Verantwortung für unsere Werkzeuge wie GitLab, JFrog und SonarQube und entwickeln leistungsfähige CI/CD-Pipelines für klassische Anwendungen und KI-Workloads. Sicherheit und Compliance integrieren: Gemeinsam mit unserem IT-Security-Team verankern Sie Sicherheitsmaßnahmen in Infrastruktur und Entwicklungsprozessen – beispielsweise Secrets Management, Schwachstellenprüfungen und die Absicherung der Softwarelieferkette. Dabei berücksichtigen Sie die Anforderungen unseres ISMS und unserer KRITIS-Umgebung. Zuverlässigen Betrieb sicherstellen: Sie etablieren Monitoring, Logging, Alarmierung sowie Backup- und Wiederherstellungsverfahren und optimieren Verfügbarkeit, Leistung und Ressourcenverbrauch. Teams befähigen und Standards etablieren: Sie unterstützen unsere Entwicklungsteams mit wiederverwendbaren Plattformbausteinen, verständlicher Dokumentation und praxisnaher Beratung zu DevOps, Cloud und KI-Infrastruktur Anforderungen: Ein abgeschlossenes Studium der Informatik, Wirtschaftsinformatik oder eine vergleichbare Qualifikation beziehungsweise entsprechende praktische Erfahrung. Mehrjährige praktische Erfahrung im DevOps-, Platform-Engineering- oder Cloud Infrastruktur-Umfeld sowie Erfahrung beim Aufbau und Betrieb produktiver Cloudumgebungen. Fundierte Kenntnisse in Kubernetes, Containertechnologien und Linux sowie ein gutes Verständnis von Netzwerken und Identitäts- und Berechtigungsmanagement. Erfahrung mit Infrastructure as Code, beispielsweise Terraform oder OpenTofu, sowie mit Automatisierungs- und GitOps-Werkzeugen, etwa Ansible, Argo CD oder Flux. Erfahrung in der Entwicklung und im Betrieb von CI/CD-Pipelines sowie im Umgang mit Git und Artefaktmanagement. Fundiertes Verständnis moderner KI-Systeme und praktische Erfahrung mit deren technischer Integration: Sie kennen die Anforderungen von LLM-Anwendungen und KI Agenten und können geeignete Cloud- und Betriebskonzepte dafür entwickeln. Kenntnisse ms ship and run those services with confidence. This role builds that platform. It also stays close to the code, in the same cloud-native, TypeScript and Node stack the product teams use. The thing this role is measured on is whether product engineers can do their own work without waiting on us. That means building or picking the tooling that gives them a paved road, and knowing the market well enough to adopt what already exists rather than building everything from scratch. An engineer who has only consumed someone else's platform has not done this job. This is a hands-on individual-contributor role on the Platform team. You will design, build and ship, and you will work directly with product engineers to help them solve their infrastructure problems. Tasks: • Build and operate the internal developer platform, the paved road of tooling and infrastructure that lets teams set up and run their own services without waiting on us. • Drive our cloud migration, moving and consolidating services into a modern cloud-native setup without slowing delivery. • Design system and infrastructure architecture and communicate it clearly, including diagrams that other engineers can build from. • Work alongside product engineers and get them unblocked, because the platform exists to serve the product. • Deliver with coding agents as a matter of course, and help improve how the whole team does so. Skills and tech stack: • A track record of building or choosing internal developer tooling that lets other engineers work faster, with a clear before and after, and the judgement to adopt an existing solution when one fits rather than build from scratch. This is the requirement the role turns on. • TypeScript on Node.js as your primary application language, or a deliberate and recent move to it. Python is a welcome secondary. • Coding agents are part of how you work every day, and you have a real habit of verifying what they produce before you rely on it. This is not a preference of ours — an engineer who has not genuinely adopted them cannot work the way this team works. • Deep, hands-on serverless AWS experience. Lambda, API Gateway, DynamoDB and event streaming are our daily tools, and we want someone who has designed against them rather than only deployed onto them. • Judgement about when not to reach for the default. You pick by tradeoff and can say where serverless stops being the right answer. Dogmatism in either direction is what we screen out. • Delivery experience in both lean startup settings and larger organisations, with ownership from start to finish. You scope a sensible first version and build on it. • Strong, hands-on cloud engineering on AWS at organisational scale: multi-account setups, identity and access, networking, and account-level guardrails. • A security-first instinct: least privilege, secrets management, and treating patching and vulnerability remediation as routine work. • Deep, hands-on experience with infrastructure as code. You have built and maintained real production estates in Terraform, or a close equivalent, and you are comfortable owning delivery pipelines on AWS. Nice to have skills: • Experience with monorepo build systems and shared tooling • Previous cloud-migration work • A track record of building internal command-line tools or code generators • Public technical work, such as open-source contributions or writing Mindset & details: This is a hands-on, pragmatic role. Experience working in international, distributed teams and a proactive mindset are required. Interviews are to be scheduled to take place shortly and efficiently with the project manager. Suitable candidates will have relevant project experience as a IDP DevX engineer from comparable roles. The client expects a short personally written letter of motivation (no AI slop) listing comparable projects and references. Preliminary Parameters: • Start: Q3 with some flexibility, Q1 2027 latest • Duration: 3 months + potential extension • Workload: ideally full-time, but 80%+ also possible • Location: remote with occasional on-site meetings in Berlin preferred • Languages: fluent English and preferably German B2 If you are interested / highly qualified, I look forward to hearing from you soon, preferably with a WORD or PDF profile, availability, remote hourly rate, and mini-application. IMPORTANT: For compliance reasons, this project is ONLY open to freelancers from the EU, i.e., permanent employees of consulting firms or non-EU citizens CANNOT be considered.", "first_seen": "2026-10-22T22:04:14.294600+00:00", "id": "c8a4426c05ce7bdb", "matched_keywords": ["ems"], "published": "2026-10-22T20:46:24+02:00", "source": "freelancermap.de", "title": "Senior Infrastructure Engineer DX / DevX, IDP, AWS - remote", "url": "https://www.freelancermap.de/projekt/senior-infrastructure-engineer-dx-devx-idp-aws-remote"}, {"description": "Hello Everyone, I am currently hiring on behalf of our major client in germany, Frankfurt, a 3DX data steward, Details below: 3DX SaaS (Cloud) experience (position requires Cloud , not on-premise). 3DX \"Key User/Trainer\" role . 3DX training/rollout leadership . Owns all LEDP process information for the site and acts as the single point of contact between legacy ops, InsuLINK, the LEDP global team, Site Launch Leaders and the Digital Product Owner. Monitors LEDP usage against global guidelines: workflows, version approvals, status updates, data fields and attachments, and pushes users off workarounds and into the tool. Manages user enablement: approves access in ServiceNow, onboards new users, runs refresher training and coaches users locally. Harmonizes facility data: builds naming conventions to global standards, runs exploratory tests, and imports and validates process information across facilities, with full data integrity. Drives continuous improvement by collecting usability feedback, logging and tracking defects and change requests, and escalating to global key users. Supports the data steward :12.192996+00:00", "id": "755ad21081364a1e", "matched_keywords": ["ems"], "published": "2026-10-22T08:58:30+02:00", "source": "freelancermap.de", "title": "Honorarkraft für Schulungen zu GMP - Good Manufacturing Practice", "url": "https://www.freelancermap.de/projekt/honorarkraft-fuer-schulungen-zu-gmp-good-manufacturing-practice"}, {"description": "Entwicklung einer digitalen Magazinplattform – MXL Digital Für das seit 1991 erscheinende Motorsportmagazin Motorsport XL suchen wir einen erfahrenen Softwareentwickler oder eine Webagentur zur Konzeption und Entwicklung einer professionellen, browserbasierten digitalen Magazinplattform. Unter der Bezeichnung MXL Digital sollen unsere Abonnenten künftig die vollständigen Ausgaben der gedruckten Zeitschrift sowie Sonderhefte komfortabel auf Desktopcomputern, Notebooks, Tablets und Smartphones lesen können. Gesucht wird keine einfache PDF-Anzeige oder standardmäßige Flipbook-Lösung, sondern eine hochwertige, eigenständige Plattform mit moderner Benutzeroberfläche, sehr guter Darstellungsqualität und integrierter Abonnentenverwaltung. Wesentliche Anforderungen Digitale Magazindarstellung Originalgetreue Darstellung vollständiger Zeitschriftenausgaben Hochauflösende Seitenansicht mit leistungsfähiger Zoomfunktion Flüssiges Blättern und komfortable Seitennavigation Einzel- und Doppelseitenansicht Vollbildmodus und optimale Ausnutzung der Bildschirmfläche Bedienung per Maus, Tastatur und Touchscreen Responsive Darstellung für Windows, macOS, iOS und Android Magazinarchiv Zugriff auf aktuelle und mindestens 36 Monate zurückliegende Ausgaben Übersichtliche Archivverwaltung nach Erscheinungsjahr und Ausgabe Integration zusätzlicher Sonderhefte Einfacher Upload neuer Ausgaben über einen Administrationsbereich Zeitgesteuerte Veröffentlichung neuer Ausgaben Abonnentenverwaltung Persönlicher, passwortgeschützter Benutzerzugang Begrenzung auf maximal zwei registrierte Geräte je Abonnent Verwaltung von Zugriffsrechten und Abonnementlaufzeiten Automatische Freischaltung und Sperrung von Zugängen Möglichkeit zur späteren Anbindung an eine bestehende Abonnentenverwaltung Technische Anforderungen Schnelle Ladezeiten und hohe Darstellungsqualität Sichere und DSGVO-konforme Umsetzung Schutz der digitalen Inhalte vor unberechtigtem Zugriff Skalierbare, wartbare und langfristig erweiterbare Architektur Betrieb unter einer eigenen Internetadresse Möglichkeit zur späteren Integration weiterer digitaler Angebote Rechte und langfristige Unabhängigkeit Ein wesentlicher Bestandteil des Projekts ist die langfristige technische Unabhängigkeit des Auftraggebers. Für die individuell entwickelte Software werden umfassende, möglichst ausschließliche und zeitlich unbeschränkte Nutzungs- und Bearbeitungsrechte erwartet. Der vollständige Quellcode der individuell entwickelten Bestandteile sowie die erforderliche technische Dokumentation müssen übergeben werden. Die Plattform muss auch durch andere qualifizierte Dienstleister gewartet und weiterentwickelt werden können. Eingesetzte Drittsoftware, Lizenzmodelle und laufende Kosten sind offenzulegen. Gesuchter Dienstleister Wir suchen einen zuverlässigen Entwicklungspartner mit Erfahrung in der Umsetzung anspruchsvoller Webanwendungen, idealerweise im Bereich digitaler Publikationen, Dokumentenviewer oder zugangsgeschützter Online-Plattformen. Erwartet werden ein nachvollziehbares technisches Konzept, eine realistische Zeitplanung und eine transparente Kostenaufstellung. Vollständige Projektbeschreibung Für MXL Digital liegt eine ausführliche Leistungsbeschreibung mit den funktionalen, technischen, organisatorischen und rechtlichen Anforderungen vor. Interessierten und geeigneten Entwicklern beziehungsweise Agenturen stellen wir diese vollständige Projektbeschreibung auf Anfrage gerne zur Verfügung. Auf dieser Grundlage erwarten wir anschließend ein detailliertes Angebot mit Angaben zu Entwicklungsdauer, einmaligen Kosten, laufenden Betriebskosten, Wartung und Nutzungsrec d relevanter Projekterfahrung.", "first_seen": "2026-10-20T13:19:03.525491+00:00", "id": "c89363b9c81640a7", "matched_keywords": ["netz"], "published": "2026-10-20T14:35:36+02:00", "source": "freelancermap.de", "title": "Senior Experte Infrastruktur / Cloud-Betrieb (m/w/d)", "url": "https://www.freelancermap.de/projekt/senior-experte-infrastruktur-cloud-betrieb-m-w-d"}, {"description": "Für das Projekt „Digitalisierung der Netzentwicklung“ suchen wir Unterstützung im Anforderungsmanagement. Ziel ist es, die fachlichen Anforderungen aus den verschiedenen Bereichen der Netzentwicklung aufzunehmen, zu strukturieren und so aufzubereiten, dass sie eine belastbare Grundlage für die anschließende Priorisierung und digitale Umsetzung bilden. Der Fokus liegt klar auf der fachlichen Seite. Gesucht wird also kein rein technisches Profil, sondern jemand, der mit unterschiedlichen Fachbereichen deren tatsächlichen Bedarf herausarbeitet und daraus ein strukturiertes Gesamtbild schafft. Aufgaben: Aufnahme und Konkretisierung fachlicher Bedarfe und Anforderungen in Interviews und Workshops mit den Fachbereichen Kritisches Hinterfragen der Anforderungen, um den tatsächlichen fachlichen Bedarf bzw. das zu lösende Problem herauszuarbeiten Strukturierte und nachvollziehbare Dokumentation der Anforderungen Ordnung der Anforderungen entlang von Prozessen, Themenfeldern und Nutzergruppen Konsolidierung ähnlicher oder überlappender Anforderungen sowie Transparenz über Abhängigkeiten, Widersprüche und offene Punkte Qualifizierung der Anforderungen gemeinsam mit den Fachexpert:innen als Grundlage für Priorisierung und Umsetzung Anforderungen: Mehrjährige Erfahrung im Anforderungsmanagement bzw. in der Business Analysis Sehr gutes Prozessverständnis, idealerweise Erfahrung in komplexen Prozesslandschaften Ausgeprägte Fähigkeit, Interviews und Workshops souverän zu moderieren und unterschiedliche Fachbereiche zusammenzubringen Strukturierte, analytische Arbeitsweise und Freude daran, Komplexität in ein klares Gesamtbild zu überführen Sehr gute Deutschkenntnisse in Wort und Schrift Wünschenswert: Erfahrung im Anforderungsmanagement für Lösungen zur Prozessautomatisierung (z. B. Webportale oder Microsoft PowerApps) Branchenerfahrung in Infrastruktur-, Energie- oder Bauprozessen Zertifizierung im Requirements Engineering (z. B. IREB CPRE) oder in Business Analysis (z. B. IIBA) Einsatzort: Remote, mit 1–2 Tagen vor Ort pro Monat in Berlin (z. B. für Workshops mit den Fachbereichen) Wir freuen uns auf dein Profil mit Angabe von Verfügbarkeit und Stundensatz.", "first_seen": "2026-10-20T13:19:03.525491+00:00", "id": "46c220efc8d0645e", "matched_keywords": ["requirements engineer", "anforderungsmanager", "business analyst", "ireb", "cpre", "iiba", "energie", "netz"], "published": "2026-10-20T11:08:18+02:00", "source": "freelancermap.de", "title": "Anforderungsmanager / Business Analyst (m/w/d) – Digitalisierung der Netzentwicklung", "url": "https://www.freelancermap.de/projekt/anforderungsmanager-business-analyst-m-w-d-digitalisierung-der-netzentwicklung"}, {"description": "Für unseren Kunden besetzen wir auf freiberuflicher Basis einen Senior Data Engineer – Databricks & DWH-Modernisierung (m/w/d) Start: ASAP Dauer: 14 Monate Auslastung: 100% Einsatzort: Köln/Bonn - Hybrid (Daher bitte im Pendelbereich) Aufgaben: Technische Modernisierung einer bestehenden Oracle-/Informatica-DWH-Landschaft und Überführung in eine Azure-/Databricks-Lakehouse-Architektur. Entwicklung und Optimierung skalierbarer Datenpipelines zur Ablösung bestehender ETL-Strecken. Umsetzung geeigneter Datenmodelle und Historisierungskonzepte sowie Sicherstellung von Datenqualität, Berechtigungen und Governance. Absicherung der Migration durch Tests, Datenabgleiche und Begleitung von Parallelbetrieb und Cutover. Abstimmung fachlicher Anforderungen und iterative Umsetzung gemeinsam mit Fachbereichen und Data Engineers im Scrum-Team. Qualifikationen: Fundierte Erfahrung mit Azure Databricks und d ategies for LLM-driven applications. Implement unit, integration, regression, and end-to-end testing frameworks. Establish testing and mocking frameworks for LLMs, embeddings, retrieval systems, and external tools. Ensure AI applications meet reliability, accuracy, security, and compliance requirements. AI Governance & Security Drive Responsible AI and AI Governance practices. Establish controls for prompt security, access management, data privacy, and compliance. Implement safeguards against hallucinations, prompt injection attacks, and data leakage risks. Ensure adherence to enterprise security and regulatory requirements.", "first_seen": "2026-10-18T14:17:05.062447+00:00", "id": "6f6ed6cb29f7a5fd", "matched_keywords": ["ems"], "published": "2026-10-18T14:26:28+02:00", "source": "freelancermap.de", "title": "AI Technical Lead (Microsoft Copilot)", "url": "https://www.freelancermap.de/projekt/ai-technical-lead-microsoft-copilot"}, {"description": "Mein Kunde, ein renommiertes Unternehmen im Schienenverkehr, sucht einen hochqualifizierten Validierer (m/w/d) zur Unterstützung eines anspruchsvollen Projektvorhabens. In dieser Rolle übernehmen Sie im agilen Team die unabhängige Validierung von robuster sowie performanter Software und Gesamtsystemen für moderne Stellwerks- und Sicherungssysteme. Mit Ihrem tiefen Verständnis für Validierungsmethodiken, Ihrer Erfahrung in sicherheitskritischen Bahnanwendungen (SIL 4) und Ihrer strukturierten Arbeitsweise im Requirements- und Test-Management leisten Sie einen entscheidenden Beitrag zur Nachweisführung, Zulassung und Sicherheit moderner Stellwerkssysteme. Hier kurz ein paar genauere Details zum Projekt: Position: Validierer / Validation Engineer Software & Systeme (m/w/d) Beginn: Frühester Start 01.12.2026 / spätester Start 04.01.2027 Auslastung: Vollzeit Dauer: 12 Monate mit Option auf Verlängerung Standort: Hybrid - Raum Niedersachsen Aufgaben: - Bewertung und Validierung von Software- und Systemanforderungen sowie der zu htigungsänderungen • Durchführung und Dokumentation von Berechtigungsrezertifizierungen • Überprüfung der Einhaltung definierter Rollen- und Berechtigungskonzepte Muss-Anforderungen • Praktische Erfahrung auf Intermediate-Niveau in der SAP-Basis-Administration mit Schwerpunkt Benutzer- und Berechtigungsmanagement von mehr als 3 Jahren • Projekterfahrung in der SAP-S/4HANA-Basis-Administration, nachgewiesen durch zwei Referenzen • Erfahrung auf Intermediate-Niveau in der Administration von SAP-Rollen und der Erstellung von Berechtigungskonzepten von mehr als 3 Jahren • Praktische Erfahrung im Umgang mit SAP Cloud ALM und der Xiting Authorizations Management Suite (XAMS), nachgewiesen durch drei Referenzen • Praktische Erfahrung auf Intermediate-Niveau in der Analyse und Behebung von SAP-Berechtigungsproblemen, insbesondere mit PFCG, SU01, SU53 und STAUTHTRACE, von mehr als 3 Jahren Kann-Anforderungen • Erfahrung im SAP-BTP-Berechtigungsmanagement, insbesondere mit Benutzer-, Rollen- und Identity-&-Access-Management, nachgewiesen durch zwei Referenzen • Erfahrung mit agilen Methoden, insbesondere SAFe und Scrum, nachgewiesen durch drei Referenzen • Erfahrung mit Funktionstrennung (Segregation of Duties / SoD) sowie der Identifikation und Bewertung von Berechtigungskonflikten im SAP-Umfeld, nachgewiesen durch zwei Referenzen • Erfahrung im Sektor Schienenverkehr, nachgewiesen durch zwei Referenzen Weitere Informationen Die Leistungserbringung erfolgt in der Regel remote in Deutschland. Projektstandort ist Frankfurt am Main; Vor-Ort-Termine sind mit bis zu 8PT eingeplant, zB für relevante SAFe PIPs. Projektsprache ist Deutsch auf Niveau C1. Let’s power the future together Vom Business Case bis hin zur Umsetzung: Als führendes Beratungsunternehmen für strategische Transformationen sind wir vertrauenswürdiger Partner für unsere Kunden - und für unsere Mitarbeitenden. Verantwortungsvoll, leistungsstark und immer mit dem Menschen im Fokus. #WeAreWavestone Mit unserem 360°-Portfolio an Beratungsleistungen verbinden wir erstklassige Branchenexpertise mit einem breiten Spektrum an branchenübergreifenden Kompetenzen, arbeiten interdisziplinär und denken über den Tellerrand hinaus. Unseren Partnerunternehmen und Freelancern:Freelancerinnen können wir so umfassende Perspektiven innerhalb unserer eigenen Projekte bieten und unterstützen als langjähriger Rahmenvertragspartner bei der Besetzung von Projektvakanzen – zeitnah und direkt. Wir freuen uns auf Ihre Kontaktaufnahme! Ihr direkter Ansprechpartner bei Wavestone Selma Halilovic Telefon: ***** E-Mail: *****", "first_seen": "2026-10-16T10:40:56.709738+00:00", "id": "d911585a589df23f", "matched_keywords": ["agil", "scrum"], "published": "2026-10-16T12:15:18+02:00", "source": "freelancermap.de", "title": "SAP-Basis- und Berechtigungsmanagementberater (m/w/d)", "url": "https://www.freelancermap.de/projekt/sap-basis-und-berechtigungsmanagementberater-m-w-d"}, {"description": "Der Topic-Cluster „Resiliente Systemführung“ überführt Resilienz in konkrete Anforderungen, strategische Leitplanken und operative Lösungen. Das Projekt Systemlandkarte verfolgt das Ziel, eine zentrale und konsistente Sicht auf Systeme, Prozesse, Datenflüsse, Schnittstellen und Verantwortlichkeiten aufzubauen. Dadurch werden Wissenssilos reduziert, Abhängigkeiten transparent gemacht und die Grundlage für schnellere Analysen sowie fundierte Architektur- und Weiterentwicklungsentscheidungen geschaffen. Ein MVP soll als belastbare \"Single Source of Truth\" für priorisierte Anwendungsfälle etabliert werden. Das Projekt Prozessmonitoring verfolgt das Ziel, Transparenz über die Performance und Qualität der Systemführungsprozesse zu schaffen. Durch den Aufbau eines übergreifenden Monitorings einschließlich Kennzahlen-, Analyse- und Alarmierungsmechanismen sollen Schwachstellen, Trends und Optimierungsbedarfe frühzeitig erkannt sowie Verbesserungsmaßnahmen systematisch gesteuert werden. Dies unterstützt die kontinuierliche Weiterentwicklung der Prozesse und fördert den Wissenstransfer innerhalb der Organisation. Zur erfolgreichen Umsetzung beider Vorhaben werden abgrenzbare Projektsteuerungs-, Planungs- und Entscheidungsunterlagen erstellt und fortgeschrieben. Der Auftragnehmer verantwortet die Erstellung und abnahmefähige Übergabe der definierten Lieferobjekte. Zielstellung Erstellung, Fortschreibung und abnahmefähige Übergabe der nachfolgend beschriebenen Planungs-, Steuerungs-, Risiko- und Entscheidungsunterlagen für die Projekte Systemlandkarte und Prozessmonitoring unter Berücksichtigung der vereinbarten Termin- und Qualitätsanforderungen. Projektsteuerung • Aufbau und Durchführung einer übergreifenden Projektsteuerung für beide Projekte. • Erstellung und Pflege von Projektplänen, Meilensteinen und Roadmaps. • Steuerung von Risiken, Abhängigkeiten und Entscheidungen. • Konzeption, Vorbereitung, Moderation und Ergebnisdokumentation von Projektgremien und Workshops. • Erstellung von Management- und Statusberichten. Stakeholder- und Schnittstellenmanagement • Abstimmung mit Fachbereichen, Business IT und weiteren Stakeholdern. • Konsolidierung fachlicher Anforderungen und Prioritäten. • Sicherstellung einer transparenten Kommunikation über Projektfortschritte und Entscheidungsbedarfe. Steuerung des Projektes Systemlandkarte • Koordination der Definition von Zielbild, Governance und Datenpflegeprozessen. • Steuerung der Erarbeitung des Informations- und Datenmodells. • Koordination von Toolbewertung, MVP-Entwicklung und Pilotierung. • Sicherstellung der Übergabe in eine nachhaltige Betriebs- und Governance-Struktur. Steuerung des Projektes Prozessmonitoring • Koordination der fachlichen Konzeption des Prozessmonitorings. • Steuerung der Definition von Kennzahlen, Monitoring- und Analyseanforderungen. • Erstellung eines priorisierten Umsetzungskonzepts für die Monitoring-Plattform einschließlich Leistungsumfang, Abhängigkeiten und Abnahmekriterien. • Sicherstellung der Einführung geeigneter Reporting-, Alarmierungs- und Verbesserungsprozesse. Lieferobjekte • Projektauftrag und Projektstrukturplan für beide Projekte. • Konsolidierte Roadmap inklusive Meilensteinen und Abhängigkeiten. • Statusberichte zu den vertraglich vereinbarten Berichtsterminen und Management-Entscheidungsvorlagen. • Risikolog, Maßnahmenverfolgung und Entscheidungsdokumentation. • Stakeholder- und Kommunikationskonzept. • Workshopkonzepte, Moderationsunterlagen und Ergebnisdokumentationen für die vereinbarten Workshops und Abstimmungsformate. • Übergabe- und Abnahmedokumentation für die Überführung der Projektergebnisse in den Regelbetrieb. Für jedes Lieferobjekt gelten Vollständigkeit, fachliche Nachvollziehbarkeit, Konsistenz zu den freigegebenen Anforderungen und Übergabe im vereinbarten Format als Abnahmekriterien.", "first_seen": "2026-10-16T10:40:56.709738+00:00", "id": "1a0705ab0557a17a", "matched_keywords": ["energie"], "published": "2026-10-16T12:09:59+02:00", "source": "freelancermap.de", "title": "Senior Projektleiter im Energiebereich gesucht (80% remote, Teilzeit 50%, 1 Jahr)", "url": "https://www.freelancermap.de/projekt/senior-projektleiter-im-energiebereich-gesucht-80-prozent-remote-teilzeit-50-prozent-1-jahr"}, {"description": "Die Keil Business Solutions GmbH ist ein innovativer Google Reseller und IT-Dienstleister. Für ein Kundenprojekt suchen wir eine-/n Senior Cyber Security Assessment Consultant (KRITIS / ISO 27001 / OT) – Remote & Frankfurt Unser Kunde ist als Energieversorger des Bahnverkehrs Betreiber kritischer Infrastrukturen (KRITIS) im Energiesektor und wird als stark reguliertes Unternehmen regelmäßig umfassend auditiert (Audit-Readiness ist gegeben). Ziel dieses Vorhabens ist ein pragmatischer, belastbarer Blick auf das tatsächliche Sicherheits- und Umsetzungsniveau mit klaren, umsetzbaren Handlungsempfehlungen (Reality Check) – ausdrücklich kein reines Papieraudit. Ein zentrales Thema ist die Wirkung der Governance-Struktur zwischen zentralen Vorgab icklung bereits vorhandener Acceptance Criteria Fachliche Abstimmung und Verhandlung der Kriterien mit Business- und Delivery-Teams Sicherstellung einer vollständigen End-to-End-Betrachtung der Bankprozesse Identifikation von fachlichen Lücken, Risiken und Abhängigkeiten, insbesondere bei Migration, Cutover und Coexistence Koordination und Moderation von Workshops mit Stakeholdern auf Gruppen- und Bereichsleitungsebene Bewertung vorhandener UAT-/Readiness-Nachweise aus fachlicher Sicht Vorbereitung der fachlichen Readiness-Bewertung für den Go-live Profil Extensive Berufserfahrung als Senior Business Analyst / Consultant im Bankenumfeld Tiefes Verständnis von Bankprozessen und Bank Operations Sehr gutes Payments-Know-how, idealerweise zusätzlich Lending und/oder KYC Erfahrung mit komplexen Banktransformationen und Migrationen Verständnis für UAT, Acceptance und Operational/Business Readiness, jedoch kein klassisches Testprofil Consulting-Erfahrung als Bindeglied zwischen Projekt-/Delivery-Team und Business Starkes Stakeholdermanagement und ausgeprägte fachliche Verhandlungsfähigkeit Fähigkeit, Anforderungen konsequent aus Sicht des Business zu betrachten: Das Angebot Hat dieses Projekt Ihr Ingteresse geweckt ? Dann lassen Sie uns gerne unter den angegebenen Kontaktdaten Ihre Bewerbungsunterlagen zukommen.", "first_seen": "2026-10-15T18:00:31.919547+00:00", "id": "b787559fbc88ee4c", "matched_keywords": ["business analyst"], "published": "2026-10-15T18:44:15+02:00", "source": "freelancermap.de", "title": "Interim Senior Business Analyst Readiness (m/w/d)", "url": "https://www.freelancermap.de/projekt/interim-senior-business-analyst-readiness-m-w-d"}, {"description": "Ein Übertragungsnetzbetreiber der Energiewirtschaft mit Sitz in Berlin baut sein Höchstspannungsnetz für die Energiewende bedarfsgerecht aus. Das Fachgebiet Primärtechnik begleitet Neu-, Umbau- und Erweiterungsprojekte von Umspannwerken über alle Projektphasen hinweg. Im Rahmen einer Arbeitnehmerüberlassung suchen wir einen Fachprojektleiter Primärtechnik (m/w/d), der die Umspannwerksprojekte unterstützt. Der Schwerpunkt liegt auf der strukturierten Projektabwicklung, dem aktiven Bearbeiten von Schnittstellen zwischen Projektleitung, technischen Gewerken, Einkauf, Netzbetrieb, Asset Management sowie externen Planungs-, Liefer- und Ausführungsunternehmen und dem konsequenten Nachhalten von Leistungen, Terminen und offenen Punkten. Die Rolle ist ausschließlich fachlich weisungsbefugt, eine disziplinarische Weisungsbefugnis ist nicht verbunden. Ihre Aufgaben Fachliche Koordination der Primärtechnik in den Projektphasen Planung, Beschaffung, Fertigung, Errichtung, Prüfung und Inbetriebnahme hinsichtlich Termine, Kosten, Qualität, Risiken, Entscheidungen und offener Punkte. Koordination und Nachverfolgung externer Planungs-, Liefer- und Ausführungsleistungen sowie transparente Eskalation von Abweichungen und Entscheidungsbedarfen. Vorbereitung und Moderation fachlicher Abstimmungen sowie Dokumentation und Nachhaltung von Beschlüssen, Verantwortlichkeiten und Terminen. Fachliche Prüfung technischer Unterlagen auf Plausibilität, Vollständigkeit, Umsetzbarkeit und Übereinstimmung mit projektspezifischen Anforderungen. Begleitung von Qualitätssicherungsmaßnahmen, Prüfungen, Werksabnahmen, Baustellenterminen und Inbetriebnahmen im übertragenen Aufgabenbereich. Statusberichterstattung zu Fortschritt, Terminen, Kosten, Qualität, Risiken und Schnittstellen sowie nachvollziehbare Dokumentation und Übergabe der fachbezogenen Unterlagen. Erteilen fachlicher Anweisungen im Rahmen der übertragenen Koordinationsaufgaben; disziplinarische Anweisungen sind ausgeschlossen. Ihr Profil Abgeschlossenes Studium der Elektrotechnik, elektrischen Energietechnik oder einer vergleichbaren technischen Fachrichtung; alternativ eine vergleichbare, durch einschlägige Berufspraxis belegte Qualifikation. Angemessene Berufserfahrung in Projekten der Hoch- oder Höchstspannungstechnik, vorzugsweise im Umfeld von Umspannwerken, sowie Erfahrung in einer fachprojektleitenden oder vergleichbaren technischen Koordinationsrolle. Grundlegendes bis fundiertes Fachwissen zu primärtechnischen Komponenten und deren Einbindung in Hoch- und Höchstspannungs-Umspannwerke. Sichere Kenntnisse gängiger Projektmanagementmethoden und Erfahrung in der strukturierten Steuerung und Nachverfolgung von Arbeitspaketen, Terminen, Kosten, Risiken und offenen Punkten. Sicherer Umgang mit Microsoft 365. Sehr gute Deutschkenntnisse in Wort und Schrift sowie gute Englischkenntnisse. Bereitschaft zu projektbezogenen Dienstreisen und Einsätzen an Umspannwerks-, Baustellen- und Herstellerstandorten; gültige Fahrerlaubnis Klasse B (Fahrtauglichkeitsprüfung G25 erforderlich). Wünschenswert Praxiserfahrung bei technischen Leistungsbeschreibungen, Bestellanforderungen oder Ausschreibungsunterlagen sowie bei der Begleitung von Beschaffungsprozessen. Kenntnisse in Projekt-, Dokumenten- und Bestellsystemen. Ausgeprägte Schnittstellen- und Kommunikationskompetenz sowie ein verbindlicher und lösungsorientierter Umgang mit internen und externen Projektbeteiligten. Zusätzliche Informationen Vertragsart: Arbeitnehmerüberlassung (ANÜ) Zeitraum: 01.01.2027 bis 31.12.2027, Verlängerung möglich Einsatzort: Berlin Arbeitsmodell: 70% vor Ort in Berlin, 30% remote Auslastung: 37 Stunden pro Woche Dienstreisen: ca. 1 Tag pro Woche im Netzgebiet sowie Einsätze an Umspannwerks-, Baustellen- und Herstellerstandorten Sprache: Deutsch (sehr gut), Englisch (gut) Nächste Schritte Aktivieren Sie die Benachrichtigung, um keine passenden Projekte zu verpassen. Bewerben Sie sich direkt über den Bewerbungslink. Bitte bewerben Sie sich nur, wenn Sie die Anforderungen erfüllen und Ihre Preisvorstellung zum Projekt passt. Wir freuen uns auf Ihre Bewerbung. Ihr Team bei joyIT.", "first_seen": "2026-10-15T18:00:31.919547+00:00", "id": "0b6b2bba9199471c", "matched_keywords": ["energie", "netz", "übertragungsnetz"], "published": "2026-10-
