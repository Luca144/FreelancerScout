  <script id="bootstrap-data" type="application/json">{"updated_at": "2026-09-09T17:32:07.917487+00:00", "projects": [{"id": "15dbde95b069ab4b", "title": "Personalcontroller (m/w/d)", "url": "https://www.freelancermap.de/projekt/personalcontroller-m-w-d-3045820", "description": "Für ein spannendes Projekt bei einem etablierten Unternehmen im Energie- und Verkehrsbereich suchen wir einen erfahrenen Personalcontroller (m/w/d) . Der Einsatz erfolgt innerhalb einer größeren Unternehmensgruppe, in der zentrale kaufmännische und strategische Funktionen für verschiedene Gesellschaften gebündelt werden. Im Projekt liegt der Schwerpunkt auf der Personalkostenplanung, dem Personalcontrolling sowie der Erstellung und Analyse von Reports und Forecasts . Dabei arbeiten Sie eng mit angrenzenden Fachbereichen wie Finance und der Geschäftsleitung zusammen. Rahmendaten Start: nach Vereinbarung Projektende: zunächst befristet, Verlängerung möglich Vertragsart: Arbeitnehmerüberlassung (ANÜ) Auslastung: Vollzeit, 38 Std./Woche Einsatzort: Aachen Remote-Anteil: Zwei Tage Vergütungsrahmen: Bis 58K Aufgaben Durchführung der Personalkostenplanung für den Konzern Analyse und Aufbereitung von Personalkosten Erstellung von Reports, Forecasts und regelmäßigen Standardauswertungen Erstellung von Personalstatistiken Unterstützung bei der Personalbedarfsplanung Zusammenarbeit mit Finance und weiteren relevanten Fachbereichen Bearbeitung von Ad-hoc-Anfragen und individuellen Auswertungen Weiterentwicklung und Optimierung von Controlling-Prozessen und internen Abläufen Arbeit mit SAP ERP-HCM und Excel Profil Abgeschlossene kaufmännische Ausbildung oder vergleichbare Qualifikation Idealerweise Weiterbildung im Bereich Personal, Controlling oder eine vergleichbare Qualifikation Berufserfahrung im Personalcontrolling / HR Controlling Gute Kenntnisse in Excel Erfahrung mit SAP HCM / SAP ERP-HCM von Vorteil Analytisches Denkvermögen und ausgeprägte Zahlenaffinität Strukturierte und eigenständige Arbeitsweise Gute Kommunikations- und Teamfähigkeit Interesse an dem Projekt? Dann freuen wir uns über die Zusendung Ihres aktuellen CVs oder Ihrer Projektliste inklusive Verfügbarkeit und gewünschtem Vergütungsrahmen.", "published": "2026-09-09T18:16:28+02:00", "matched_keywords": ["energie"], "source": "freelancermap.de", "first_seen": "2026-09-09T17:32:07.833616+00:00"}, {"id": "78185cce3a4c1647", "title": "Enterprise AI Solution Architect (m/w/d) | Vollzeit | 100% remote", "url": "https://www.freelancermap.de/projekt/enterprise-ai-solution-architect-m-w-d-vollzeit-100-prozent-remote", "description": "Für unseren Kunden suchen wir aktuell einen Enterprise AI Solution Architect (m/w/d). a) Rahmendaten: Laufzeit: 15.09.2026 - 31.12.2026 (mit Verlängerungsoption) Einsatzort: 100% remote Auslastung: 100% / Vollzeit (480 Stunden geplant) b) Aufgaben: Erstellung / Beschreibung eines AI Toolsets / Frameworks Aufbau einer AI basierten Wissensdatenbank / LLM AI basierte Automation in den Bereichen Deal Support -> Erstellung von Angeboten / Kalkulationen Commercials -> Forecasting Commercials -> SDE Erstellung / Aktualisierung Process -> Change Validierung Technical -> Incident Bearbeitung c) Anforderungen: AI im Enterprise-Umfeld: Kenntnisse im Aufbau und der Etablierung von KI-Ansätzen in komplexen Unternehmensstrukturen. Governance, Compliance & Datenschutz: Fundierte Kenntnisse bezüglich AI Governance, rechtlichen/regulatorischen Vorgaben und Datenschutz im Enterprise-Kontext. Netzwerk- & Systemintegration: Fachwissen zur Anbindung von KI-Lösungen an bestehende Daten und Systeme unter Berücksichtigung strenger Sicherheitsarchitekturen (z. B. Netzwerkseparierung, Firewall-Konzepte).", "published": "2026-09-09T18:06:17+02:00", "matched_keywords": ["netz"], "source": "freelancermap.de", "first_seen": "2026-09-09T17:32:07.833616+00:00"}, {"id": "06b9d228d5f04a94", "title": "SEO CO-FOUNDER GESUCHT – 35 % BETEILIGUNG FÜR 15.000 €", "url": "https://www.freelancermap.de/projekt/seo-co-founder-gesucht-35-prozent-beteiligung-fuer-15-000-euro", "description": "Werberocket – B2B E-Commerce für Werbeartikel, Corporate Merchandise & Sonderanfertigungen Du möchtest nicht nur SEO für andere Unternehmen machen, sondern selbst Teil eines Unternehmens werden und es von Anfang an mit aufbauen? Dann könnte Werberocket genau das Richtige für dich sein. Wir suchen einen SEO-Co-Founder , der mit uns gemeinsam Werberocket aufbaut und dafür 35 % Unternehmensbeteiligung erhält. Das Angebot 15.000 € Investment gegen 35 % Beteiligung. Das Geld fließt überwiegend direkt in den Aufbau des Shops und die technische Infrastruktur. Wir investieren in das Custom-/Premium-Paket mit individuellem Shopdesign, unbegrenzter Lieferantenanbindung, eigenen Artikeln, Erweiterungsmöglichkeiten sowie Mollie/PayPal. Ein kleiner Teil dient dazu, bereits von uns getragene Gründungs- und Aufbaukosten teilweise abzudecken. Du bist von Anfang an dabei Wir rechnen mit etwa 2 Monaten bis zum vollständigen Shop-Launch . Und genau diese Zeit ist entscheidend. Wir wollen nicht erst einen fertigen Shop bauen und anschließend jemanden suchen, der SEO daraufsetzt. Du bist von Anfang an dabei und entscheidest mit. Shopstruktur, Kategorien, Keywordstrategie, URL-Struktur, Landingpages, Content, interne Verlinkung, technische SEO, Indexierung, Duplicate Content und alles, was für eine langfristig starke organische Sichtbarkeit wichtig ist. Werberocket soll SEO-first aufgebaut werden. Warum SEO für uns der Schlüssel ist Ich bin seit rund 25 Jahren in der Werbeartikelbranche tätig und habe unter anderem viele Jahre bei GIFFITS gearbeitet. Daher weiß ich aus eigener Erfahrung: Der Erfolg eines Werbeartikelshops hängt ganz wesentlich von seiner Sichtbarkeit ab. ***** Produkte online zu haben ist schön – aber wenn niemand uns findet, bringt das wenig. Unser Ziel ist deshalb, Werberocket bei Google für möglichst viele relevante Suchbegriffe auf Seite 1 zu bringen. Denn dann passiert genau das, was wir aus dem Markt kennen: Die Kunden kommen zu uns. Und wir reden dabei nicht nur über kleine Unternehmen. Sobald die entsprechende Sichtbarkeit vorhanden ist, können täglich Anfragen aus dem gesamten deutschen Markt entstehen – bis hin zu größeren Mittelständlern und den Top-Unternehmen Deutschlands. Genau dieses Potenzial wollen wir nutzen. Deine Rolle Du übernimmst als Co-Founder den Bereich SEO & organische Sichtbarkeit und baust diesen eigenverantwortlich mit uns auf. Du solltest SEO wirklich beherrschen und vor allem Lust darauf haben, unternehmerisch mitzudenken und Verantwortung zu übernehmen. Wir suchen ausdrücklich keinen klassischen Freelancer , der uns monatlich einen SEO-Bericht schickt. Wir suchen jemanden, der sagt: „Ich möchte das Ding mit aufbauen und selbst daran beteiligt sein.“ Meine Rolle Ich übernehme den kompletten kaufmännischen und operativen Bereich: Neukundenakquise Kundenberatung und Kundenservice Angebote & Kalkulationen Aufträge & komplette Auftragsabwicklung Einkauf & Lieferanten Verkauf Sourcing & Direktimporte Sonderanfertigungen Preisverhandlungen Reklamationen Rechnungen & Zahlungsabwicklung Betreuung und Entwicklung der Kunden Kurz gesagt: Du sorgst dafür, dass die Kunden Werberocket finden. Ich sorge dafür, dass aus den Anfragen Aufträge und aus Aufträgen Stammkunden werden. Das Geschäftsmodell Werberocket ist bereits gegründet und soll mit einer sehr großen Produktauswahl starten. Geplant sind rund ***** Produkte , die über Lieferanten angebunden und automatisiert gepflegt werden. Wir brauchen kein riesiges eigenes Lager und wollen bewusst schlank starten. Die ersten Aufträge sollen möglichst gegen Vorkasse abgewickelt werden. Die daraus entstehenden Umsätze fließen direkt wieder in den Aufbau. Warum jetzt? Werberocket wurde bereits vor einigen Jahren gegründet. Der Start hat sich aus verschiedenen Gründen immer wieder verzögert. Gleichzeitig bin ich der Branche durchgehend treu geblieben und habe mein Wissen und Netzwerk weiter ausgebaut. Wir hatten zuletzt einen Investor gesucht. Dieser ist aufgrund der aktuell unsicheren Situation in Deutschland abgesprungen. Unser Entschluss: Dann machen wir es eben selbst. Wir starten kleiner, gewinnen die ersten Kunden, investieren die Umsätze wieder ins Unternehmen und bauen parallel die Sichtbarkeit auf. Und vielleicht ist genau das sogar der bessere Weg. Wenn du Lust hast ... ... nicht nur SEO zu machen, sondern 35 % an einem Unternehmen zu besitzen, das du selbst mit aufbaust , dann sollten wir miteinander sprechen. 15.000 € → 35 % Beteiligung SEO-Co-Founder Von Tag 1 an Mitspracherecht Gemeinsamer Aufbau über die nächsten zwei Monate bis zum Launch Vielleicht ist jetzt genau der richtige Zeitpunkt, aus Werberocket endlich das Unternehmen zu machen, das wir seit Jahren vor Augen haben. E-Mail: *****", "published": "2026-09-09T18:00:50+02:00", "matched_keywords": ["netz"], "source": "freelancermap.de", "first_seen": "2026-09-09T17:32:07.833616+00:00"}, {"id": "045cac11315f4305", "title": "Westhouse Job: Systemingenieur Systemingenieur (m/w/d)", "url": "https://www.freelancermap.de/projekt/westhouse-job-systemingenieur-systemingenieur-m-w-d", "description": "Westhouse ist eines der führenden Recruitment-Unternehmen für die Vermittlung hochqualifizierter Fachexperten aus dem gesamten IT-Lifecycle- und Engineering-Bereich. Für unseren Kunden suchen wir aktuell eine/n Systemingenieur Systemingenieur (m/w/d) Rahmeninformationen Referenz:180074 Einsatzort:Wismar/ Rostsock Starttermin:01.10.2026 Arbeitszeit:Teilzeit 40 Std./Woche Sprachen:deutsch & englisch Ihre Qualifikationen - Sie verfügen über ein abgeschlossenes Hochschulstudium im Bereich Elektrotechnik oder eine vergleichbare Qualifikation - Sie bringen mehrjährige Erfahrung in der elektrotechnischen Konstruktion und Projektierung mit, idealerweise im maritimen oder Offshore-Umfeld - Sie verfügen über ein sehr gutes Verständnis für Schnittstellen zu angrenzenden Disziplinen - Sie verfügen über Verhandlun n und Umsetzung von Performanceoptimierungen - Unterstützung bei der Datenmodellierung, unter anderem durch die Implementierung von HANA-Views oder vergleichbaren Objekten - Mitwirkung bei der Datenintegration aus SAP S/4HANA Public Cloud - Beratung von Fachbereichen bei der Definition und Umsetzung ihrer Reporting- und Analytics-Anforderungen - Erstellung technischer Unterlagen und Durchführung von Wissenstransfer an interne Kollegen - Mitarbeit an der Weiterentwicklung bzw. Migration bestehender BusinessObjects-Lösungen - Zusammenarbeit in internationalen Projektteams und agilen Arbeitsumgebungen Interessiert? Interessiert? Wir freuen uns auf Ihren aussagekräftigen Lebenslauf/CV in elektronischer Form. Ihr Ansprechpartner: Sebastian Freund (#GernePerDu) ***** ***** *****", "published": "2026-09-09T17:51:35+02:00", "matched_keywords": ["agil"], "source": "freelancermap.de", "first_seen": "2026-09-09T17:32:07.833616+00:00"}, {"id": "e9cc5c78233ec891", "title": "CRM Strategy & Platform Evaluation Lead (m/w/d)", "url": "https://www.freelancermap.de/projekt/crm-strategy-und-platform-evaluation-lead-m-w-d", "description": "Liebes Netzwerk, für meinen Kunden bin ich auf der Suche nach einem erfahrenen CRM Strategy & Platform Evaluation Lead (m/w/d), der eine herstellerneutrale Bewertung einer bestehenden CRM-Landschaft verantwortet und eine strategische Entscheidungsvorlage für die zukünftige CRM-Ausrichtung entwickelt. Rahmenbedingungen: Start: November 2026 Laufzeit: 4 Monate Auslastung: Vollzeit Einsatzort: Hamburg Remote: 80% Sprache: Deutsch und Englisch Aufgaben: Durchführung von Stakeholder-Interviews und Workshops Bewertung von CRM-Prozessen, Datenqualität und Nutzeranforderungen Analyse von Systemarchitektur, Integrationen und technischen Schulden Identifikation von Ursachen bestehender Herausforderungen Definition zukünftiger fachlicher und technischer Anforderungen Erstellung eines priorisierten Anforderungskatalogs Berücksichtigung von Themen wie AI, Reportin  "first_seen": "2026-09-08T18:17:14.147173+00:00", "id": "173e069cb7ebf18f", "matched_keywords": ["netz"], "published": "2026-09-08T18:59:56+02:00", "source": "freelancermap.de", "title": "IT Field Service Techniker / Onsite Support (m/w/d)", "url": "https://www.freelancermap.de/projekt/it-field-service-techniker-onsite-support-m-w-d"}, {"description": "Das bieten wir Dir! Abwechslung und Sicherheit im Klartext heißt das: Du profitierst von unserer Marktkompetenz und den stabilen, langjährigen Beziehungen zu unseren Kunden in Deutschland und europaweit. Wir haben nationale und internationale Projekte für Dich. Natürlich in renommierten Unternehmen und technologisch anspruchsvollen Branchen. Faire Vertragsbedingungen und eine schnelle und unbürokratische Arbeitsweise verstehen sich bei uns von selbst. ***Beschreibung:*** Im Rahmen dieser Beauftragung soll eine bestehende Leistungsnachweis-Applikation fachlich und technisch weiterentwickelt sowie zu einer mandantenfähigen Lösung ausgebaut werden. Die Anwendung dient der Erfassung, Verwaltung und Auswertung von Leistungsnachweisen und soll zukünftig mehreren Value Teams bzw. Organisationseinheiten auf einer gemeinsamen Plattform zur Verfügung stehen. Die vorhandene Applikation ist auf der MS PowerPlattform erstellt worden und soll hier auch weitergeführt werden. Ein wesentlicher Bestandteil der Leistung ist die strukturierte Aufnahme, Analyse und Konsolidierung der Anforderungen der verschiedenen Value Teams. Hierzu sind Workshops, Abstimmungen und Anforderungsanalysen durchzuführen, um ein gemeinsames Zielbild sowie eine priorisierte Umsetzungs-Roadmap zu erarbeiten. Dabei sind unterschiedliche fachliche Bedürfnisse und Prozesse zu harmonisieren und in eine nachhaltige, skalierbare Lösung zu überführen. Auf Basis der abgestimmten Anforderungen ist die fachliche und technische Umsetzung in einem agilen und iterativen Vorgehen zu begleiten. Dies umfasst die Erstellung von Fach- und Umsetzungskonzepten, die Steuerung und Unterstützung der Entwicklung, die Qualitätssicherung sowie die kontinuierliche Abstimmung mit den Stakeholdern. Ziel der Beauftragung ist die Bereitstellung eines ersten lauffähigen Proof of Concept (PoC) bis zum Jahresende, der die wesentlichen Kernfunktionen abbildet, die Mandantenfähigkeit nachweist und als Grundlage für den weiteren Ausbau zu einer unternehmensweit nutzbaren Lösung dient. ***Aufgaben:*** Analyse der bestehenden Leistungsnachweis-App und der vorhandenen Architektur Erhebung, Konsolidierung und Priorisierung der Anforderungen der beteiligten Value Teams Durchführung von Stakeholder-Abstimmungen Erstellung eines fachlichen und technischen Zielbildes Begleitung der Konzeption und Umsetzung der Mandantenfähigkeit Begleitung der Weiterentwicklung der Leistungsnachweis APP Qualitätssicherung, Abnahmevorbereitung und Dokumentation Vorbereitung der Lösung für den weiteren Rollout und Skalierung auf zusätzliche Organisationseinheiten Aus Compliancegründen können nur Profile von festangestellten Bewerbern berücksichtigt werden. ***Muss-Anforderungen:*** Erfahrung im Anforderungsmanagement (Analyse, Konsolidierung und Dokumentation) Erfahrung im Bereich Finanzen und Controlling (insbes. Aktivierung und Fremdmittel Finanzierung) Erfahrung im Kontext Prozessanalyse für Zeiterfassungstools Erfahrung im Kontext der Erstellung von Fachkonzepten für PowerApps Erfahrung bei der Erstellung von skalierungsfähigen Apps auf der PowerPlattform ***Soll-Anforderungen:*** Kenntnisse von Power-App Software-Architekturen Konzeption und Umsetzung in Projekten Konzeption und Umsetzung von Schnittstellen im Kontext MS PowerPlattform in Projekten Kenntnisse im Umfeld der Erstellung von Entscheidungsvorlagen auf C-Level Kenntnisse im Umfeld von Governance, Security und Datenschutz im Kontext von PowerApps und Powerplattformen in Projekten Wir sind ein europäischer IT-Solutions Provider. Unser Ziel: Durch passgenaue IT-Dienstleistungen unterstützen wir unsere Kunden dabei, effi , "title": "Technischer Business Analyst Girokonto (m/w/d)", "url": "https://www.freelancermap.de/projekt/technischer-business-analyst-girokonto-m-w-d"}, {"description": "For our long-standing client in the energy sector, we are looking for an Platform / Data Engineer (AI Telemetry & Integration) (m/f/d) who implements the technical integration of the DX platform and the AI tool telemetry, ensures data availability and data quality, and technically prepares the AI value evaluations Only Nearshore! Initial Situation AI-assisted development tools (e.g. GitHub Copilot, coding agents, AI-assisted code reviews) are being adopted increasingly and generate significant license and operating costs. However, the actual value contribution cannot be reliably measured: consolidated data is missing on adoption, actual depth of usage, development time saved, as well as on the impact on quality, lead times, and developer experience. Statements regarding ROI are currently based on estimates and individual opinions. Project Objective Execution of a time-boxed proof of concept with the DX platform (getdx.com) in order to objectively measure the value contribution of AI tools in software development. The goal is to demonstrate that AI adoption, usage intensity, time savings, and quality effects can be reliably captured, integrated into existing systems, and translated into a well-founded investment and scaling decision. Project Scope Scoping & AI Value Model: Selection of the pilot teams, definition of the success criteria and of a measurement model for AI value (adoption, usage intensity, self-reported and system-measured time savings, impact on lead times and quality, ROI logic against license costs). Platform Setup & Integration: Connection of DX to GitLab, CI/CD, ticketing, and identity/SSO, as well as to the telemetry of the AI tools in use (e.g. Copilot usage data); configuration of teams, hierarchies, and data model. AI Measurement & Baseline: Setup of the DX AI Measurement Framework surveys and of the system-side data collection; baseline before and after the expansion of AI usage. Quality & Risk Assessment: Analysis of the impact on change failure rate, review effort, rework, and security findings, in order not to evaluate AI value purely in terms of speed. Data Protection & Compliance: Anonymity, data protection, and codetermination requirements; data minimization, aggregation thresholds, role and permission concept; clear delineation from individual performance measurement. Evaluation & Decision Proposal: ROI and benefit assessment, identification of the most effective areas of application and of adoption barriers, derivation of enablement measures, and recommendation regarding scaling and license strategy. Tasks Setup and configuration of the DX platform including SSO/identity integration and permission model Integration of the data sources: GitLab, CI/CD, ticketing as well as usage and telemetry data from the AI tools (e.g. Copilot Metrics API) Setup and validation of the identity/team mapping across AI tools and delivery systems Modeling of the AI value metrics (adoption, usage intensity, time savings, lead time and quality effects) and their linkage to cost data Ensuring data quality, consistency, and completeness; error analysis and correction Implementation of anonymization, aggregation, and data minimization requirements Provision of dashboards, evaluations, and exports for the results and ROI assessment Technical documentation as well as effort estimation for later scaling Skills Solid experience as a platform, DevOps, or data engineer Very good knowledge of the GitLab API as well as of CI/CD and ticketing integrations Experience with the collection and evaluation of usage telemetry, ideally from AI development tools Experience with API integrations, webhooks, and data pipelines Knowledge of data modeling, data quality assurance, and reporting/visualization Experience with SSO/IAM (e.g. SAML, OIDC) and secrets management Awareness of data protection and the handling of personal or pseudonymized data Independent, structured way of working with a focus on fast, reliable results in a POC context English speaking", "first_seen": "2026-09-08T14:07:31.619598+00:00", "id": "d5fc8d393edf40cb", "matched_keywords": ["ems"], "published": "2026-09-08T16:04:14+02:00", "source": "freelancermap.de", "title": "Platform / Data Engineer (AI Telemetry & Integration) (m/f/d)", "url": "https://www.freelancermap.de/projekt/platform-data-engineer-ai-telemetry-und-integration-m-f-d"}, {"description": "Aufgaben: Unterstützung und Betreuung von PPM-Prozessen Projekt- und Aufgabenmanagement Status- und Terminmanagement Verknüpfung von Produktänderungen mit Projekten Analyse von Anforderungen Funktionale Unterstützung Erforderliche Kenntnisse und Erfahrungen: SAP Product Life Cycle Management (PLM) mit Schwerpunkt S/4HANA PLM Erfahrung im Requirements Engineering Fließende Englischkenntnisse", "first_seen": "2026-09-08T14:07:31.619598+00:00", "id": "b72893d628e14a61", "matched_keywords": ["requirements engineer"], "published": "2026-09-08T16:01:06+02:00", "source": "freelancermap.de", "title": "SAP PLM Consultant / PPM (m/w/d)", "url": "https://www.freelancermap.de/projekt/sap-plm-consultant-ppm-m-w-d"}, {"description": "Aufgaben: Funktionales Design von Formulierungen und Rezepten Gestaltung und Weiterentwicklung von Spezifikations- und Rezeptstrukturen Erstellung von Requirements und funktionalen Spezifikationen Analyse komplexer Incidents und Changes Durchführung der funktionalen Qualitätssicherung Beratung und Unterstützung in den Bereichen Formulation, Specification Management, Recipe Development, Recipe Compliance und Process Instructions Erforderliche Kenntnisse und Erfahrungen: SAP Product Life Cycle Management (PLM) mit Schwerpunkt S/4HANA PLM Erfahrung im Requirements Engineering Fließende Englischkenntnisse", "first_seen": "2026-09-08T14:07:31.619598+00:00", "id": "8c6dd45d70eab352", "matched_keywords": [  evaluations. Anforderungen Scoping & AI Value Model: Selection of the pilot teams, definition of the success criteria and of a measurement model for AI value (adoption, usage intensity, self-reported and system-measured time savings, impact on lead times and quality, ROI logic against license costs) Platform Setup & Integration: Connection of DX to GitLab, CI/CD, ticketing, and identity/SSO, as well as to the telemetry of the AI tools in use (e.g. Copilot usage data); configuration of teams, hierarchies, and data model AI Measurement & Baseline: Setup of the DX AI Measurement Framework surveys and of the system-side data collection; baseline before and after the expansion of AI usage Quality & Risk Assessment: Analysis of the impact on change failure rate, review effort, rework, and security findings, in order not to evaluate AI value purely in terms of speed Data Protection & Compliance: Anonymity, data protection, and codetermination requirements; data minimization, aggregation thresholds, role and permission concept; clear delineation from individual performance measurement Evaluation & Decision Proposal: ROI and benefit assessment, identification of the most effective areas of application and of adoption barriers, derivation of enablement measures, and recommendation regarding scaling and license strategy Setup and configuration of the DX platform including SSO/identity integration and permission model Integration of the data sources: GitLab, CI/CD, ticketing as well as usage and telemetry data from the AI tools (e.g. Copilot Metrics API) Setup and validation of the identity/team mapping across AI tools and delivery systems Modeling of the AI value metrics (adoption, usage intensity, time savings, lead time and quality effects) and their linkage to cost data Ensuring data quality, consistency, and completeness; error analysis and correction Implementation of anonymization, aggregation, and data minimization requirements Provision of dashboards, evaluations, and lung - Nutzung des bestehenden Netzwerks und eigener Vertriebswege Voraussetzungen: - Erfahrung im B2B-Vertrieb, in der Neukundengewinnung oder in der Vermittlung erklärungsbedürftiger Dienstleistungen - Bestehendes Netzwerk zu Unternehmen, Entscheidern, IT-Dienstleistern, Systemhäusern oder Industrieunternehmen ist von Vorteil - Erfahrung im IT-, Software-, Digitalisierungs- oder Projektgeschäft ist hilfreich, aber keine zwingende Voraussetzung - Eigenständige, verbindliche Arbeitsweise und Freude an der Ansprache neuer Kontakte - Gespür für den Digitalisierungs- und Automatisierungsbedarf potenzieller Kundenunternehmen Erwartetes Ergebnis: - Qualifizierte Leads und vereinbarte Ersttermine in den genannten Leistungsbereichen - Übergabe vollständiger Kontakt- und Bedarfsinformationen an das interne Team - Perspektive auf langfristige Zusammenarbeit und wiederkehrende Erträge bei laufenden Vertragsbeziehungen Arbeitsmodell: Freiberuflich, remote, deutschlandweit Vergütung: Ausschließlich erfolgsabhängig auf Provisionsbasis, kein Fixum, kein Retainer. Bei erfolgreich vermittelten Kunden und zustande gekommenen Aufträgen ist eine wiederkehrende Provision bei laufenden Vertragsbeziehungen vorgesehen. Die konkrete Ausgestaltung wird transparent und passend zum jeweiligen Geschäftsmodell, Produkt oder Projektumfang vereinbart.", "first_seen": "2026-09-06T18:00:04.562612+00:00", "id": "d1ea7a5788b6d8a2", "matched_keywords": ["netz"], "published": "2026-09-06T18:18:31+02:00", "source": "freelancermap.de", "title": "Selbstständiger Vertriebspartner / Handelsvertreter B2B-Software, KI & IT-Projektgeschäft", "url": "https://www.freelancermap.de/projekt/selbststaendiger-vertriebspartner-handelsvertreter-b2b-software-ki-und-it-projektgeschaeft"}, {"description": "JUSTGROW unterstützt Unternehmer, CEOs, COOs und Leadership-Teams dabei, Wachstum in klare Prioritäten, abgestimmte Führung und verlässliche Umsetzung zu übersetzen. Im Mittelpunkt stehen strategische Growth-Advisory-Mandate für wachstumsorientierte Unternehmen, häufig im B2B-Umfeld, in Buy-and-Build-Konstellationen, Unternehmensgruppen und Scale-ups. Diese Mandate laufen in der Regel über mindestens sechs Monate und häufig über ein Jahr oder länger. Gesucht werden selbstständige Empfehlungs- und Netzwerkpartner , die Zugang zu passenden Entscheidern haben und bei echtem Bedarf eine persönliche, glaubwürdige Einführung herstellen können. Es geht nicht um klassischen Vertrieb , keine Tätigkeit im Namen von JUSTGROW und keinen Abschluss von Verträgen. Die Aufgabe besteht darin, relevante Unternehmer, CEOs, COOs, Investoren, Beiräte oder Führungsteams zu identifizieren, den Bedarf richtig einzuordnen und einen qualifizierten ersten Kontakt herzustellen. Ein guter Anlass für eine Einführung besteht typischerweise dann, wenn Wachstum, Komplexität oder Veränderungsdruck zunehmen, aber Führung, Verantwortung und Umsetzung nicht Schritt halten. Besonders passend sind Situationen mit zu hoher CEO-Abhängigkeit, mangelnd abgestimmten Leadership-Teams, fehlender Verantwortungsübernahme, Buy-and-Build-Integration, Internationalisierung, Nachfolge oder Investoren- und Ergebnisdruck. Typische Zielunternehmen sind wachstumsorientierte B2B-Unternehmen, Buy-and-Build-Organisationen, Unternehmensgruppen und Scale-ups, unter anderem in SaaS, FinTech, InsurTech, Managed Services und Plattformgeschäftsmodellen. Entscheidend ist jedoch weniger die Branche als ein konkreter Wachstums-, Führungs- oder Umsetzungshebel, bei dem ein strategisches Advisory-Mandat sinnvoll ist. Die Einordnung des Bedarfs, das Erstgespräch, die Ausarbeitung des Vorgehens, Angebot, Vertragsabschluss und die Umsetzung übernehmen wir. Der Empfehlungs- oder Netzwerkpartner schafft also keinen Vertriebskanal im engeren Sinne, sondern einen belastbaren Einstieg in eine potenziell hochwertige Kundenbeziehung. Die Vergütung erfolgt erfolgsabhängig auf Basis der tatsächlich vereinnahmten Nettohonorare aus der vermittelten Kundenbeziehung. Für das erste Vertragsjahr beträgt die Provision 20 Prozent, für das zweite Vertragsjahr 10 Prozent . Voraussetzung ist, dass der Kontakt vor der Einführung nicht bereits als aktiver Lead, Kunde oder konkrete Verkaufschance bekannt war und dass die Zuordnung der Einführung nachvollziehbar dokumentiert ist. Die Provision wird anteilig nach Zahlungseingang abgerechnet; die erste Tranche entsteht in der Regel bereits mit der vertraglich vereinbarten Anzahlung. Die konkrete Ausgestaltung der Provisionsregel kann vertraglich frei vereinbart werden und sollte schriftlich klar definiert sein. Nicht Teil der Zusammenarbeit sind Spam, automatisierte Massenansprache, gekaufte oder gescrapte Listen, unzulässige Kaltakquise, die Weitergabe personenbezogener Daten ohne entsprechende Grundlage oder ein Auftreten im Namen von JUSTGROW. Gesucht werden keine Lead-Lieferanten, sondern seriöse, unternehmerisch denkende Personen mit Zugang zu passenden Netzwerken und einem guten Gespür für relevante Situationen. Bitte sende uns: - Den Link zu deinem LinkedIn-Profil - Ggf. den Link zu deiner Website - Eine kurze Beschreibung der Netzwerke bzw. Entscheidergruppen, zu denen du Zugang hast - Zwei bis fünf Sätze dazu, in welchen Situationen du eine Empfehlung passend hältst und wie du üblicherweise eine persönliche Einführung herstellst. Wenn es grundsätzlich passt, lernen wir uns unkompliziert in einem kurzen Teams-Gespräch kennen und klären die Optionen einer Zusammenarbeit.", "first_seen": "2026-09-06T11:56:45.187722+00:00", "id": "ba52173ccfed7102", "matched_keywords": ["netz"], "published": "2026-09-06T12:12:12+02:00", "source": "freelancermap.de", "title": "Empfehlungs- und Netzwerkpartner für CEO- und Growth-Mandate gesucht", "url": "https://www.freelancermap.de/projekt/empfehlungs-und-netzwerkpartner-fuer-ceo-und-growth-mandate-gesucht"}, {"description": "Externer IT-Sicherheitsbeauftragter (ISB) mit Plattform für Schwachstellen- und Risikomanagement, NIS2/KRITIS, Energieversorge ruppenverantwortlichen E-Technik / Systemingenieur (m/w/d). In dieser Rolle übernehmen Sie die fachliche und technische Verantwortung für komplexe elektrotechnische Baugruppen sowie die Integration schiffstechnischer Systeme über den gesamten Projektzyklus hinweg – von der Konzeption bis zur erfolgreichen Ablieferung Hier kurz ein paar genauere Details zum Projekt: Position: Baugruppenverantwortlichen E-Technik / Systemingenieur (m,w,d) Beginn: 14.09.2026 Auslastung: Vollzeit Dauer: 4 Monate + Option auf Verlängerung Standort: Hybrid - Großraum Bremen Aufgaben: - Fachliche Führung und Betreuung der elektrotechnischen Systeme mit Fokus auf Energieverteilung, Antriebstechnik, Kabelsysteme sowie Schnittstellen zur Navigation & Automation - Auslegung und Bearbeitung von Schaltanlagensystemen, Powermanagement-Konzepten, elektrischen Antrieben und komplexen Trassen-/Kabelsystemen im Schiffsnetz - rstellung und Weiterentwicklung von technischen Spezifikationen, Systemschemata, Stromlaufplänen und Abnahmeprotokollen - Aufbereitung und Pflege von Stücklisten (BOM) unter strikter Berücksichtigung von Kundenvorgaben, Budgets und Meilensteinen - Schnittstellen- & Lieferantensteuerung - Abstimmung der Systemintegration im 3D-Modell/Generalplan sowie Begleitung der Fertigung, Ersterprobung (HAT/SAT) und Ablieferungsphasen - Qualifikationen: - Abgeschlossenes Studium der Elektrotechnik, Schiffsbetriebstechnik, Mechatronik oder Abschluss als Staatlich geprüfter Techniker - Mehrjährige relevante Berufserfahrung im maritimen Umfeld - Nachgewiesene Kenntnisse in den Bereichen Energieverteilung, Powermanagement-Systeme (PMS), Schiffsantriebstechnik und Kabelsysteme/Trassenplanung - Vertrautheit mit der Anbindung und Bearbeitung von Navigations- & Schiffsautomationssystemen sowie den Regularien der Klassifikationsgesellschaften und Marinenormen - Sicherer Umgang mit AutoCAD (Schema- & Übersichtsplanung) sowie gängigen PDM/ERP-Systemen zur Stücklistenverarbeitung - Verhandlungssichere De
