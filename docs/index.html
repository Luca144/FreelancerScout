ap.de/projekt/data-domain-manager-m-w-d-remote-jba14936"}, {"description": "Über das Projekt Ich baue ein B2B-SaaS-Unternehmen auf (zweiseitige Plattform, Produkt wird von einem eigenen Entwicklerteam fertiggestellt, Markteintritt steht unmittelbar bevor). Für den Aufbau des kompletten Marketing- und Vertriebs-Unterbaus suche ich keinen klassischen Marketer und keinen Ticket-Abarbeiter, sondern eine Person, die als Mischung aus GTM Engineer, Automation Specialist und pragmatischem Marketing-Techniker den gesamten Bereich eigenständig mitdenkt, technisch sauber aufbaut. Was gebaut wird Bereich A — Marke & Reichweite: Markenfundament, Social-Media-Kanäle, KI-gestützte Content-Produktion (Text, Bild, Video), Publishing & Redaktionsplanung, Community-Management inklusive Krisen- und Hass-Kommunikations-Protokoll, externe Unternehmensprofile, Traffic-/Ads-/SEO-Grundlage, Brand-Reporting. Bereich B — automatisierte B2B-Akquise: Aufbau einer Datenbank potenzieller Kunden in Europa (Scraping, Enrichment, Validierung), automatisiertes Research pro Account entlang definierter Recherche-Achsen, Segmentierung & Fit-Scoring, personalisierte mehrsprachige E-Mail-Ansprache mit Follow-up-Sequenzen, personalisierte Briefansprache über eine Print-API, Outbound-Infrastruktur (eigene Versanddomains, Mailboxen, SPF/DKIM/DMARC, Warmup, Deliverability-Monitoring), automatisierte Antwort-Verarbeitung & Lead-Qualifizierung, Akquise-Reporting mit A/B-Tests. Sprachen: Content, E-Mail- und Brief-Ansprache sowie Reichweiten-Infrastruktur sind mindestens in fünf Sprachen aufzubauen: DE, EN, NL, FR, IT. Wichtig: Die Zielgruppe sind traditionelle kleine und mittlere Betriebe, die wenig digital arbeiten und keine Massenmails wollen. Personalisierung mit echtem Bezug ist der Kern des Systems — kein Spray-and-Pray. Ergebnisse statt Demonstratoren Ich will keine technischen Gerüste, sondern nutzbare Ergebnisse: Nicht „eine Content-Pipeline existiert\", sondern Pipeline plus tatsächlich produzierter Content. Nicht „eine Datenbankstruktur wurde angelegt\", sondern eine nutzbare Datenbasis mit echten, validierten Datensätzen. Nicht „ein E-Mail-Workflow wurde getestet\", sondern ein praktisch einsatzbereites System für personalisierte Ansprache und Follow-ups. „Pragmatisch\" darf heißen: eine schlankere Lösung wählen. Es heißt nicht: einen Workflow weglassen oder nur einen Proof of Concept liefern. Das solltest du können n8n (idealerweise self-hosted) und saubere API-/Systemintegration · Datenbeschaffung: Scraping, Enrichment, Validierung; Clay oder vergleichbare Tools · LLM-Integration (GPT, Claude o. Ä.) inkl. Prompt-Design und Halluzinations-Kontrolle · Content-Pipelines für Text, Bild und Video · CRM- und Lead-Prozesse, automatisiertes Research, Lead-Scoring · personalisierte E-Mail- und Brief-Ansprache · Outbound-Infrastruktur inkl. Deliverability · Reply-Handling und Lead-Qualifizierung · Dashboards, Reporting, A/B-Tests · Grundverständnis Meta Ads, Google Ads, SEO, Tracking · Mehrsprachige Content- und Ansprache-Strukturen · DSGVO-bewusstes Arbeiten, saubere Dokumentation, Datenmodelle, Übergabe Mindestens genauso wichtig: deine Arbeitsweise Du bekommst zu Beginn einen umfassenden Einblick (Strategie, Designs, bestehende Arbeiten, Zugänge). Danach überlegst du selbst: Was ist hier technisch und wirtschaftlich die beste Lösung? Wenn eine meiner Ideen unnötig kompliziert oder fachlich nicht optimal ist, sagst du mir das und schlägst etwas Besseres vor. Ich suche ausdrücklich jemanden, der das Thema besser umsetzt, als ich es selbst könnte — nicht jemanden, den ich durchs Projekt führen muss. Gleichzeitig: keine überkomplexe „AI-Raumstation\", nur weil sie beeindruckend aussieht. Die Systeme müssen verständlich, robust, wartbar und wirklich nützlich sein. Du fragst von selbst: Bringt uns dieser Workflow etwas? Gibt es eine einfachere Lösung? Welche laufenden Kosten entstehen? Wie bedient das der Auftraggeber nach Projektende selbst? Zusammenarbeit Pro Workflow definieren wir gemeinsam: Was wird gebaut, was ist der konkrete Output, wann gilt er als fertig, welche Tools, welche externen Kosten, was gehört ausdrücklich nicht dazu. Danach arbeitest du weitgehend eigenständig; wir stimmen uns in gelegentlichen kurzen Terminen ab. Ich verteile keine täglichen Aufgaben. Rahmenbedingungen Festpreis: 5.000 € Rechnungsbetrag für die Umsetzung aller Workflows (Tool-/API-Kosten trage ich nach Freigabe separat). Zeitraum: Ende September 2026 bis spätestens Ende Februar 2027, 100 % remote. So bewirbst du dich Wie würdest du für ein einzelnes Zielunternehmen automatisiert herausfinden, wo unser Produkt konkret helfen kann, und daraus eine persönliche Ansprache bauen, die nicht wie eine Massenmail wirkt?", "first_seen": "2026-09-15T19:58:40.298234+00:00", "id": "2b0f9268bb33d931", "matched_keywords": ["ems"], "published": "2026-09-15T19:32:16+02:00", "source": "freelancermap.de", "title": "Automation / GTM Engineer (n8n, Clay, LLM-APIs) komplettes Marketing- & Outbound-System für B2B-SaaS", "url": "https://www.freelancermap.de/projekt/automation-gtm-engineer-n8n-clay-llm-apis-komplettes-marketing-und-outbound-system-fuer-b2b-saas"}, {"description": "Senior UX/UI Designer (d/w/m) - Figma, öffentlichen Sektor - remote und Berlin Remote | Berlin Für unser Projekt IT_2337 suchen wir folgenden Spezialisten (m/w/d): Wichtige Infos: Abgabefrist: 16.09.2026 12am Auslastung: Vollzeit, 80 PT mit Option auf Verlängerung Örtlichkeit: remote // Geräteabholung vor Ort Projektsprache: Deutsch C2 oder Muttersprache und Englisch B2 Honorar: max. 65€/Std. remote (jeder Euro weniger wird voll weitergegeben und erhöht Ihre Erfolgschance) Besonderheiten: deutsche Staatsangehörigkeit gefordert // Bereitschaft zur SÜ2 Bitte bewerben Sie sich nur, wenn Sie die Profil-Anforderungen zu 100% erfüllen. Muss-Anforderungen (Nichterfüllung führt zum Ausschluss): Mindestens 5 Jahre Erfahrung als UX/UI Designer:in in der Konzeption und Gestaltung digitaler Produkte (Nach uf Basis eines vereinbarten Tagessatzes. Projektziel: Im Rahmen der Vermarktung bestehender und geplanter Glasfaserinfrastrukturen soll die Marktpenetration in ausgewählten Gewerbegebieten erhöht werden. Gegenstand der Beauftragung ist die eigenverantwortliche Durchführung vertrieblicher Aktivitäten zur Identifikation, Qualifizierung und Entwicklung von Geschäftskundenpotenzialen entlang definierter Adresspunkte. Ziel der Leistung ist die Generierung qualifizierter Geschäftskontakte sowie die Anbahnung von Neuabschlüssen für Glasfaser- und Telekommunikationsprodukte. Leistungsgegenstand: Der Auftragnehmer erbringt eigenverantwortlich Vertriebsleistungen zur gezielten Ansprache von Geschäftskunden im definierten Zielgebiet. Hierzu gehören insbesondere: - Eigenständige Kontaktaufnahme mit potenziellen Geschäftskunden an vorgegebenen Adresspunkten - Identifikation und Bewertung von Vermarktungspotenzialen im jeweiligen Gewerbegebiet - Durchführung von Bedarfsermittlungen und Erstgesprächen mit relevanten Ansprechpartnern und Entscheidern - Vorstellung und Erläuterung der angebotenen Telekommunikations- und Glasfaserprodukte - Qualifizierung von Interessenten anhand der identifizierten Kundenanforderungen - Dokumentation und Übergabe qualifizierter Leads - Optional die Herbeiführung vertrieblicher Abschlüsse im Rahmen der angebotenen Standardprodukte - Die konkrete Organisation der Leistungserbringung, die zeitliche Einteilung sowie die Wahl geeigneter Vertriebsansätze erfolgen eigenständig durch den Auftragnehmer. Ergebnis der Leistung: Die Leistung gilt insbesondere als erbracht durch: - Dokumentierte Ansprache der zugewiesenen Zieladressen - Identifizierung relevanter Geschäftskontakte und Entscheidungsträger - Qualifizierte Lead-Übergaben mit dokumentiertem Kundenpotenzial - Gegebenenfalls erfolgreich angebahnte oder abgeschlossene Vertriebschancen Besondere fachliche Anforderungen: Für die Leistungserbringung ist nachweisbare Erfahrung im B2B-Vertrieb erklärungsbed  Anspruchsgrundlagen, Leistungsinhalte und Kostenansätze. Ermittlung und Dokumentation von Mehrkosten-, Termin- und Mengenänderungen als Grundlage für Nachtragsforderungen. Identifikation von Nachtragsrisiken und Entwicklung geeigneter Maßnahmen zur Risikominimierung sowie zur Sicherung berechtigter Ansprüche. Nachverfolgung und Steuerung des gesamten Nachtragsprozesses von der Anspruchsanmeldung bis zur abschließenden Verhandlung und Entscheidungsvorbereitung. Erstellung und Pflege einer transparenten Nachtragsdokumentation einschließlich Nachtragsregister, Statusverfolgung und relevanter Nachweise. Vorbereitung von Nachtragsanzeigen, Prüfvermerken, Stellungnahmen und weiterer nachtragsbezogener Korrespondenz. Abstimmung nachtragsrelevanter Sachverhalte mit den beteiligten Projektbereichen, insbesondere Bauleitung, Projektmanagement, Einkauf, Recht und kaufmännischer Projektleitung. Unterstützung bei der Vorbereitung und Durchführung von Nachtragsverhandlungen durch Aufbereitung von Sachverhalten, Argumentationen und Entscheidungsgrundlagen. Laufende Überwachung von Änderungsanordnungen, Zusatzleistungen und deren wirtschaftlichen Auswirkungen auf das Projektbudget. Erstellung regelmäßiger Berichte und Kennzahlen zu Nachtragsvolumen, Nachtragsstatus, Chancen, Risiken und Verhandlungsergebnissen. Erstellung einer nachvollziehbaren und revisionssicheren Dokumentation sämtlicher nachtragsrelevanter Vorgänge, Entscheidungen und Nachweise. Projekt-Nr.: 1083414 Projekttitel: ***** Nachtragsmanager - Fokus Bauingenieurswesen Stellentyp: freiberuflich Einsatzort: 1x im Monat Erlangen, Raum München, Raum Kiel Starttermin: 21.09.2026 Dauer: 12 Monate + Anforderungen: Musthaves: + Erfahrung: Mindestens 5 Jahre im CCM und Nachtragsmanagement im Anlagenbau/EPC-Geschäft, vorzugsweise im Bereich Energie- oder Netzlösungen, Windenergie oder erneuerbare Energien. + Bauingenieur oder vergleichbare Berufserfahrung + Technischer und kommerzieller Fokus: Starkes Augenmerk auf Fristen und Budgetvorgaben, Verknüpfung technischer und kommerzieller Perspektiven. Branchenerfahrung: + Bauwesen, Civil, Energie Erforderliche Sprachkenntnisse: • Starke schriftliche und mündliche Kommunikationsfähigkeiten in Deutsch (Muttersprache oder C1-Niveau) und Englisch (professionell). Zusätzliche Informationen: SOLCOM zählt zu den führenden Technologiedienstleistern in den Bereichen Softwareentwicklung, IT und Engineering. Seit mehr als 20 Jahren arbeiten wir als Partner global agierender Spitzenunternehmen aller Branchen und sind weltweit im Einsatz, wo Innovation entscheidet.", "first_seen": "2026-09-15T16:13:50.905853+00:00", "id": "ad6d6c2f39fd8b18", "matched_keywords": ["energie", "netz"], "published": "2026-09-15T17:20:06+02:00", "source": "freelancermap.de", "title": "***** Nachtragsmanager - Fokus Bauingenieurswesen", "url": "https://www.freelancermap.de/projekt/nachtragsmanager-fokus-bauingenieurswesen"}, {"description": "Aufgaben: 5.1 Führung und Organisation Der Berater stärkt die Führungsmannschaft durch Coaching on the Job, also im direkten Führungsalltag und nicht in erster Linie im Seminarraum. Dazu gehört die Einführung und Verankerung verbindlicher Führungsroutinen wie Teambriefings, tägliche Steuerungsrunden und tägliche sowie wöchentliche KPI-Reviews. Rollen, Verantwortlichkeiten und Eskalationswege innerhalb des Projekts werden geklärt und dokumentiert. Die Führungskräfte werden befähigt, Leistungsfeedback und schwierige Situationen souverän zu führen. 5.2 Planung, Steuerung und Erreichbarkeit Um die Forecast-Erfüllung zu verbessern und die Erreichbarkeit zu stabilisieren, überprüft und optimiert der Berater gemeinsam mit dem Team die Personaleinsatzplanung und die Intraday-Steuerung. Dabei berücksichtigt er die unterschiedlichen Kanäle (Telefon und E Mail) sowie die unterschiedliche Komplexität der Themen, etwa durch sinnvolles Skill Routing und ein wirksames Backlog-Management im E-Mail-Kanal. 5.3 Prozessqualität und Folgekontakte Der Berater sorgt dafür, dass die Qualität in der Mail-, Telefonie und Prozessbearbeitung das Zielniveau erreicht. Dazu gehören die Identifikation der häufigsten Fehlerquellen, die Verbesserung von Arbeitsanweisungen, Checklisten und Wissensdatenbank, ein funktionierendes Qualitätsmonitoring mit regelmäßiger Kalibrierung sowie schnelle Feedbackschleifen zu den Mitarbeitenden. Die zahlreich eingeleiteten Maßnahmen sind in ihrer Wirkung zu überprüft, abzusichern und dauerhaft in den Regelbetrieb zu überführt. 5.4 Mitarbeiterbindung und Fluktuation Die Ursachen der hohen Fluktuation werden im laufenden Betrieb ermittelt, etwa über Austrittsgespräche, Gespräche mit Mitarbeitenden und die Auswertung vorhandener Daten. Darauf aufbauend setzt der Berater gemeinsam mit den Führungskräften wirksame Maßnahmen um. Denkbare Ansatzpunkte sind ein strukturiertes Onboarding und eine gestufte Einarbeitung, die der Komplexität der Themen gerecht wird, klare Entwicklungspfade, regelmäßige Stimmungsbilder sowie eine Führungskultur, die Wertschätzung und Verbindlichkeit vereint. 5.5 Schnittstellen und Reporting Der Berater unterstützt bei der Abstimmung mit dem Auftraggeber sowie mit internen Schnittstellen, insbesondere dort, wo Prozessprobleme ihre Ursache außerhalb des Projekts haben. Er berichtet wöchentlich in kompakter Form über Fortschritt, Wirkung der Maßnahmen und Entwicklung der KPIs. 6. Vorgehen und Phasen Phase Zeitraum Inhalt Einstieg und Quick Check Woche 1–2 Kurze Bestandsaufnahme im laufenden Betrieb, Festlegung der Verantwortungsbereiche, Phase Zeitraum Inhalt Umsetzung und Stabilisierung Monat 1–4 erster Quick Wins, abgestimmter Maßnahmenplan mit Zielwerten Aktive Umsetzung der Maßnahmen in allen Handlungsfeldern, Coaching der Führungskräfte, laufende Wirkungskontrolle anhand der KPIs Verstetigung und Übergabe Monat 5–6 Verankerung der Routinen und Prozesse im Regelbetrieb, schrittweiser Rückzug des Beraters, strukturierte Übergabe an die Projektleitung Die Zeiträume dienen der Orientierung und können im Angebot begründet angepasst werden. 7. Erfolgsmessung Der Erfolg der Beauftragung wird an der Entwicklung der in Abschnitt 2 genannten KPIs sowie an der Fluktuationsquote gemessen. Konkrete Zielwerte und Meilensteine werden in der Einstiegsphase gemeinsam festgelegt. Zusätzlich bewerten wir, inwieweit die Führungskräfte am Ende der Beauftragung in der Lage sind, das Projekt eigenständig zu steuern. Wir sind offen für Angebote, die einen erfolgsabhängigen Vergütungsanteil enthalten. Projekt-Nr.: 1083352 Projekttitel: ***** Operations-Manager Callcenter Nearshore Stellentyp: freiberuflich Einsatzort: Pristina, Kosovo Starttermin: 01.10.2026 Dauer: 6 Monate Anforderungen: Der Berater verfügt über mehrjährige, nachweisbare Erfahrung in der operativen Leitung oder Steuerung von CallCenter- bzw. BPO-Projekten, idealerweise in einer Größenordnung von mehr als 100 Mitarbeitenden. Er hat bereits Projekte in einer vergleichbaren Schieflage erfolgreich stabilisiert und kann dies mit Referenzen belegen. Kenntnisse der Energiewirtschaft sind von Vorteil. Darüber hinaus bringt er belastbare Erfahrung in Workforce-Management, Qualitätsmanagement und der Entwicklung von Führungskräften mit. Persönlich erwarten wir eine ausgeprägte Umsetzungsstärke und Hands-on-Mentalität, die Bereitschaft zu hoher Präsenz vor Ort, Durchsetzungsvermögen gepaart mit Empathie sowie die Fähigkeit, Menschen auf allen Ebenen mitzunehmen. Verhandlungssichere Deutschkenntnisse und gute Englischkenntnisse sind Voraussetzung. Zusätzliche Informationen: SOLCOM zählt zu den führenden Technologiedienstleistern in den Bereichen Softwareentwicklung, IT und Engineering. Seit mehr als 20 Jahren arbeiten wir als Partner global agierender Spitzenunternehmen aller Branchen und sind weltweit im Einsatz, wo Innovation entscheidet.", "first_seen": "2026-09-15T16:13:50.905853+00:00", "id": "e7b9f6d5473daa15", "matched_keywords": ["energie"], "published": "2026-09-15T17:19:13+02:00", "source": "fr rozent-remote-id03215"}, {"description": "Wir suchen selbständige Vertriebsprofis, die die Unternehmenssoftware Kaya unter eigenem Namen an kleine und mittlere Betriebe vermitteln. Hersteller ist die Trainity GmbH, der Vertrieb läuft über die Dr. Krey eG aus Hessen. Was Kaya macht: Betrieben mit Kundenterminen den Empfang abnehmen. Telefon wird abgenommen, Termine gelegt und erinnert, Formulare unterschrieben zurückgegeben, Stunden und Aufgaben erfasst. Zielbranchen: Kfz-Werkstätten, Handwerk, Steuerberater, Rechtsanwälte, Ästhetik- und Tierarztpraxen, Bestatter, Hausverwaltungen, Hotels und Gastronomie. Was Sie tun: Kontakte in Ihrem Netzwerk oder Ihrer Region ansprechen, die Demo führen (wir schulen Sie, kostenlos und live), den Kunden über unser Bestellformular abschließen lassen. Wie Sie akquirieren, entscheiden Sie. Was wir tun: Softwarevertrag, Rechnung, Onboarding, Support, Betrieb und Datenschutz liegen bei uns. Sie bekommen eine eigene Anwendungsdomain mit Ihrem Namen und Logo, eine vorbereitete Website, ein Partner-CRM für Leads und Provisionen, Branchen-Playbooks mit Skripten und Einwänden sowie eine wöchentliche Live-Demo. Vergütung: reine Provision, monatlich wiederkehrend, solange der Kunde bleibt. Zwei Modelle stehen zur Wahl. Standard: 40 Prozent der vereinbarten Vergütungsbasis, keine Monatspauschale, 24 Monate Bindung. Sie richten Ihre Kunden nach unserer Einführung selbst ein und verkaufen zu unseren Referenzpreisen. Pro: 70 Prozent, dafür 1.000 Euro netto im Monat an uns, 12 Monate Bindung. Die Einrichtung neuer Kunden übernehmen wir, und Sie dürfen über den Referenzpreisen anbieten. Beispiel: 15 Kunden mit je 600 Euro Vergütungsbasis ergeben 9.000 Euro im Monat. Davon bleiben Ihnen im Standard 3.600 Euro, im Pro 5.300 Euro nach Abzug der Pauschale. Ab etwa sechs Kunden dieser Größe trägt sich Pro. Kein Tagessatz, kein Fixum. Auszahlung nach Zahlungseingang des Kunden, 90 Tage Rückbehalt bei Kündigung. Wen wir suchen: Vertriebserfahrung im B2B, i g heterogener Stamm- und Transaktionsdaten aus dem Schienengüterverkehr. B – Intermediate Data Engineer::: AWS-fokussiertes Data Engineering mit Python, SQL, PySpark und Spark; AWS Glue, S3 und Step Functions; Migration von On-Premise-Systemen; CI/CD, Infrastructure as Code und automatisierte Tests; Datenqualität, Monitoring und Reporting für den Schienengüterverkehr. C – Intermediate Data Engineer::: Multi-Cloud-Erfahrung mit AWS und Azure; AWS Glue, S3 und weitere AWS-Services; Azure Data Factory, Python, PySpark und Scala; Entwicklung von Machine-Learning-Anwendungen; Migration von Legacy-Datenplattformen; Datenqualität, Tests, Monitoring und Data Contracts. D – Intermediate Data Engineer::: Azure-fokussiertes Data Engineering mit Python, SQL, PySpark, Azure Data Factory und Azure Synapse; Entwicklung von Batch- und Streaming-Pipelines; Kafka-basierte Datenverarbeitung; Integration heterogener Datenquellen; Medallion-Architektur, Data Vault und Star Schema. E – Senior Data Architect::: Strategische Konzeption und Bewertung von Daten- und KI-Architekturen; strategische Modernisierung komplexer Datenplattformen; Erfahrung im Schienenverkehr; Entwicklung von Daten- und KI-Strategien; Bewertung von KI-Anwendungsfällen; Leitung komplexer Transformationsvorhaben und interdisziplinärer Teams. Gemeinsame Rahmenbedingungen Rollen: Intermediate Data Engineer beziehungsweise Senior Data Architect Projektzeitraum: 23.09.2026 bis 31.12.2027 Umfang: 291 Personentage Einsatzort: Remote Projektsprache: Deutsch, zwingend erforderlich Branche: Transport & Logistics, Großes deutsches Schienenunternehmen Projektumfeld: Digitale Transformation und Aufbau einer modernen, datengetriebenen IT- und Systemlandschaft Themenschwerpunkte: Entwicklung und Betrieb von Datenplattformen Entwicklung von Datenpipelines und Datenprodukten Integration heterogener Datenquellen Verarbeitung großer Datenmengen Data Lakes, Data Warehouses und DataHub-Strukturen Datenmodelle und Datenflüsse Datenqualität, Governance, Security und Compliance Cloud-Migration und Modernisierung bestehender Systeme Machine Learning und KI-Anwendungsfälle Architekturleistungen: Konzeption und Weiterentwicklung von Datenarchitekturen Definition von Architekturprinzipien und Standards Bewertung von Skalierbarkeit, Performance, Sicherheit und Wartbarkeit Erstellung technischer Spezifikationen und Architekturkonzepte Durchführung von Architektur-Reviews Pflege der Architektur-Dokumentation Projektbeschreibung: Die angefragte Leistung unterstützt zentrale Initiativen im Rahmen der digitalen Transformation. Ziel der Vorhaben ist der Aufbau und die Weiterentwicklung einer modernen, datengetriebenen IT- und Systemlandschaft, welche die Grundlage für die Automatisierung und Optimierung von Geschäftsprozessen sowie für die Nutzung von datenbasierten und KI-gestützten Anwendungsfällen bildet. Im Fokus stehen insbesondere die Konzeption, Entwicklung und der Betrieb von Datenprodukten, Datenpipelines sowie IT-Services innerhalb einer verteilten, cloudbasierten Architektur. Hierbei werden Technologien und Plattformen wie DataHubStrukturen, Data Lakes sowie CloudServices (insbesondere AWS und Azure) eingesetzt. Die Integration heterogener Datenquellen sowie die Verarbeitung großer Datenmengen sind zentrale Bestandteile der Vorhaben. Die Projekte umfassen sowohl klassische Entwicklungsleistungen als auch innovative Themenstellungen im Umfeld von Machine Learning, datengetriebenen Optimierungsverfahren sowie der Automatisierung von Geschäftsprozessen. Ein besonderer Fokus liegt auf der schnellen Umsetzung von Prototypen (PoCs) und Minimum Viable Products (MVPs), um neue Use Cases frühzeitig zu validieren und in die produktive Umgebung zu überführen. Aufgabe: Die Leistungen umfassen die Konzeption und Weiterentwicklung unternehmensweiter Datenarchitekturen in cloudbasierten Umgebungen, insbesondere auf Basis von AWS und Microsoft Azure. Dazu gehören die Definition von Architekturprinzipien, Standards und keywords": ["business analyst", "agil"], "published": "2026-09-08T16:04:21+02:00", "source": "freelancermap.de", "title": "Technischer Business Analyst Girokonto (m/w/d)", "url": "https://www.freelancermap.de/projekt/technischer-business-analyst-girokonto-m-w-d"}, {"description": "For our long-standing client in the energy sector, we are looking for an Platform / Data Engineer (AI Telemetry & Integration) (m/f/d) who implements the technical integration of the DX platform and the AI tool telemetry, ensures data availability and data quality, and technically prepares the AI value evaluations Only Nearshore! Initial Situation AI-assisted development tools (e.g. GitHub Copilot, coding agents, AI-assisted code reviews) are being adopted increasingly and generate significant license and operating costs. However, the actual value contribution cannot be reliably measured: consolidated data is missing on adoption, actual depth of usage, development time saved, as well as on the impact on quality, lead times, and developer experience. Statements regarding ROI are currently based on estimates and individual opinions. Project Objective Execution of a time-boxed proof of concept with the DX platform (getdx.com) in order to objectively measure the value contribution of AI tools in software development. The goal is to demonstrate that AI adoption, usage intensity, time savings, and quality effects can be reliably captured, integrated into existing systems, and translated into a well-founded investment and scaling decision. Project Scope Scoping & AI Value Model: Selection of the pilot teams, definition of the success criteria and of a measurement model for AI value (adoption, usage intensity, self-reported and system-measured time savings, impact on lead times and quality, ROI logic against license costs). Platform Setup & Integration: Connection of DX to GitLab, CI/CD, ticketing, and identity/SSO, as well as to the telemetry of the AI tools in use (e.g. Copilot usage data); configuration of teams, hierarchies, and data model. AI Measurement & Baseline: Setup of the DX AI Measurement Framework surveys and of the system-side data collection; baseline before and after the expansion of AI usage. Quality & Risk Assessment: Analysis of the impact on change failure rate, review effort, rework, and security findings, in order not to evaluate AI value purely in terms of speed. Data Protection & Compliance: Anonymity, data protection, and codetermination requirements; data minimization, aggregation thresholds, role and permission concept; clear delineation from individual performance measurement. Evaluation & Decision Proposal: ROI and benefit assessment, identification of the most effective areas of application and of adoption barriers, derivation of enablement measures, and recommendation regarding scaling and license strategy. Tasks Setup and configuration of the DX platform including SSO/identity integration and permission model Integration of the data sources: GitLab, CI/CD, ticketing as well as usage and telemetry data from the AI tools (e.g. Copilot Metrics API) Setup and validation of the identity/team mapping across AI tools and delivery systems Modeling of the AI value metrics (adoption, usage intensity, time savings, lead time and quality effects) and their linkage to cost data Ensuring data quality, consistency, and completeness; error analysis and correction Implementation of anonymization, aggregation, and data minimization requirements Provision of dashboards, evaluations, and exports for the results and ROI assessment Technical documentation as well as effort estimation for later scaling Skills Solid experience as a platform, DevOps, or data engineer Very good knowledge of the GitLab API as well as of CI/CD and ticketing integrations Experience with the collection and evaluation of usage telemetry, ideally from AI development tools Experience with API integrations, webhooks, and data pipelines Knowledge of data modeling, data quality assurance, and reporting/visualization Experience with SSO/IAM (e.g. SAML, OIDC) and secrets management Awareness of data protection and the handling of personal or pseudonymized data Independent, structured way of working with a focus on fast, reliable results in a POC context English speaking", "first_seen": "2026-09-08T14:07:31.619598+00:00", "id": "d5fc8d393edf40cb", "matched_keywords": ["ems"], "published": "2026-09-08T16:04:14+02:00", "source": "freelancermap.de", "title": "Platform / Data Engineer (AI Telemetry & Integration) (m/f/d)", "url": "https://www.freelancermap.de/projekt/platform-data-engineer-ai-telemetry-und-integration-m-f-d"}, {"description": "Aufgaben: Unterstützung und Betreuung von PPM-Prozessen Projekt- und Aufgabenmanagement Status- und Terminmanagement Verknüpfung von Produktänderungen mit Projekten Analyse von Anforderungen Funktionale Unterstützung Erforderliche Kenntnisse und Erfahrungen: SAP Product Life Cycle Management (PLM) mit Schwerpunkt S/4HANA PLM Erfahrung im Requirements Engineering Fließende Englischkenntnisse", "first_seen": "2026-09-08T14:07:31.619598+00:00", "id": "b72893d628e14a61", "matched_keywords": ["requirements engineer"], "published": "2026-09-08T16:01:06+02:00", "source": "freelancermap.de", "title": "SAP PLM Consultant / PPM (m/w/d)", "url": "https://www.freelancermap.de/projekt/sap-plm-consultant-ppm-m-w-d"}, {"description": "Aufgaben: Funktionales Design von Formulierungen und Rezepten Gestaltung und Weiterentwicklung von Spezifikations- und Rezeptstrukturen Erstellung von Requirements und funktionalen Spezifikationen Analyse komplexer Incidents und Changes Durchführung der funktionalen Qualitätssicherung Beratung und Unterstützung in den Bereichen Formulation, Specification Management, Recipe Development, Recipe Compliance und Process Instructions Erforderliche Kenntnisse und Erfahrungen: SAP Product Life Cycle Management (PLM) mit Schwerpunkt S/4HANA PLM Erfahrung im Requirements Engineering Fließende Englisc - Übergabe relevanter Informationen an das interne Team für weitere Beratung, Bedarfsklärung und Angebotserstellung - Nutzung des bestehenden Netzwerks und eigener Vertriebswege Voraussetzungen: - Erfahrung im B2B-Vertrieb, in der Neukundengewinnung oder in der Vermittlung erklärungsbedürftiger Dienstleistungen - Bestehendes Netzwerk zu Unternehmen, Entscheidern, IT-Dienstleistern, Systemhäusern oder Industrieunternehmen ist von Vorteil - Erfahrung im IT-, Software-, Digitalisierungs- oder Projektgeschäft ist hilfreich, aber keine zwingende Voraussetzung - Eigenständige, verbindliche Arbeitsweise und Freude an der Ansprache neuer Kontakte - Gespür für den Digitalisierungs- und Automatisierungsbedarf potenzieller Kundenunternehmen Erwartetes Ergebnis: - Qualifizierte Leads und vereinbarte Ersttermine in den genannten Leistungsbereichen - Übergabe vollständiger Kontakt- und Bedarfsinformationen an das interne Team - Perspektive auf langfristige Zusammenarbeit und wiederkehrende Erträge bei laufenden Vertragsbeziehungen Arbeitsmodell: Freiberuflich, remote, deutschlandweit Vergütung: Ausschließlich erfolgsabhängig auf Provisionsbasis, kein Fixum, kein Retainer. Bei erfolgreich vermittelten Kunden und zustande gekommenen Aufträgen ist eine wiederkehrende Provision bei laufenden Vertragsbeziehungen vorgesehen. Die konkrete Ausgestaltung wird transparent und passend zum jeweiligen Geschäftsmodell, Produkt oder Projektumfang vereinbart.", "first_seen": "2026-09-06T18:00:04.562612+00:00", "id": "d1ea7a5788b6d8a2", "matched_keywords": ["netz"], "published": "2026-09-06T18:18:31+02:00", "source": "freelancermap.de", "title": "Selbstständiger Vertriebspartner / Handelsvertreter B2B-Software, KI & IT-Projektgeschäft", "url": "https://www.freelancermap.de/projekt/selbststaendiger-vertriebspartner-handelsvertreter-b2b-software-ki-und-it-projektgeschaeft"}, {"description": "JUSTGROW unterstützt Unternehmer, CEOs, COOs und Leadership-Teams dabei, Wachstum in klare Prioritäten, abgestimmte Führung und verlässliche Umsetzung zu übersetzen. Im Mittelpunkt stehen strategische Growth-Advisory-Mandate für wachstumsorientierte Unternehmen, häufig im B2B-Umfeld, in Buy-and-Build-Konstellationen, Unternehmensgruppen und Scale-ups. Diese Mandate laufen in der Regel über mindestens sechs Monate und häufig über ein Jahr oder länger. Gesucht werden selbstständige Empfehlungs- und Netzwerkpartner , die Zugang zu passenden Entscheidern haben und bei echtem Bedarf eine persönliche, glaubwürdige Einführung herstellen können. Es geht nicht um klassischen Vertrieb , keine Tätigkeit im Namen von JUSTGROW und keinen Abschluss von Verträgen. Die Aufgabe besteht darin, relevante Unternehmer, CEOs, COOs, Investoren, Beiräte oder Führungsteams zu identifizieren, den Bedarf richtig einzuordnen und einen qualifizierten ersten Kontakt herzustellen. Ein guter Anlass für eine Einführung besteht typischerweise dann, wenn Wachstum, Komplexität oder Veränderungsdruck zunehmen, aber Führung, Verantwortung und Umsetzung nicht Schritt halten. Besonders passend sind Situationen mit zu hoher CEO-Abhängigkeit, mangelnd abgestimmten Leadership-Teams, fehlender Verantwortungsübernahme, Buy-and-Build-Integration, Internationalisierung, Nachfolge oder Investoren- und Ergebnisdruck. Typische Zielunternehmen sind wachstumsorientierte B2B-Unternehmen, Buy-and-Build-Organisationen, Unternehmensgruppen und Scale-ups, unter anderem in SaaS, FinTech, InsurTech, Managed Services und Plattformgeschäftsmodellen. Entscheidend ist jedoch weniger die Branche als ein konkreter Wachstums-, Führungs- oder Umsetzungshebel, bei dem ein strategisches Advisory-Mandat sinnvoll ist. Die Einordnung des Bedarfs, das Erstgespräch, die Ausarbeitung des Vorgehens, Angebot, Vertragsabschluss und die Umsetzung übernehmen wir. Der Empfehlungs- oder Netzwerkpartner schafft also keinen Vertriebskanal im engeren Sinne, sondern einen belastbaren Einstieg in eine potenziell hochwertige Kundenbeziehung. Die Vergütung erfolgt erfolgsabhängig auf Basis der tatsächlich vereinnahmten Nettohonorare aus der vermittelten Kundenbeziehung. Für das erste Vertragsjahr beträgt die Provision 20 Prozent, für das zweite Vertragsjahr 10 Prozent . Voraussetzung ist, dass der Kontakt vor der Einführung nicht bereits als aktiver Lead, Kunde oder konkrete Verkaufschance bekannt war und dass die Zuordnung der Einführung nachvollziehbar dokumentiert ist. Die Provision wird anteilig nach Zahlungseingang abgerechnet; die erste Tranche entsteht in der Regel bereits mit der vertraglich vereinbarten Anzahlung. Die konkrete Ausgestaltung der Provisionsregel kann vertraglich frei vereinbart werden und sollte schriftlich klar definiert sein. Nicht Teil der Zusammenarbeit sind Spam, automatisierte Massenansprache, gekaufte oder gescrapte Listen, unzulässige Kaltakquise, die Weitergabe personenbezogener Daten ohne entsprechende Grundlage oder ein Auftreten im Namen von JUSTGROW. Gesucht werden keine Lead-Lieferanten, sondern seriöse, unternehmerisch denkende Personen mit Zugang zu passenden Netzwerken und einem guten Gespür für relevante Situationen. Bitte sende uns: - Den Link zu deinem LinkedIn-Profil - Ggf. den Link zu deiner Website - Eine kurze Beschreibung der Netzwerke bzw. Entscheidergruppen, zu denen du Zugang hast - Zwei bis fünf Sätze dazu, in welchen Situationen du eine Empfehlung passend hältst und wie du üblicherweise eine persönliche Einführung herstellst. Wenn es grundsätzlich passt, lernen wir uns unkompliziert in einem kurzen Teams-Gespräch kennen und klären die Optionen einer Zusammenarbeit.", "first_seen": "2026-09-06T11:56:45.187722+00:00", "id": "ba52173ccfed7102", "matched_keywords": ["netz"], "published": "2026-09-06T12:12:12+02:00", "source": "freelancermap.de", "title": "Empfehlungs- und Netzwerkpartner für CEO- und Growth-Mandate gesucht", "url": "https://www.freelancermap.de/projekt/empfehlungs-und-netzwerkpartner-fuer-ceo-und-growth-mandate-gesucht"}, {"description": "Externer IT-Sicherheitsbeauftragter (ISB) mit Plattform für Schwachstellen- und Risikomanagement, NIS2/KRITIS, Energieversorger Für einen kommunalen Energieversorger (KRITIS, NIS2-pflichtig, ISMS-zertifiziert) suchen wir einen Dienstleister, der die Rolle des externen IT-Sicherheitsbeauftragten übernimmt und das Schwachstellenmanagement über eine eigene Plattform oder angebundene Tools weitgehend automatisiert. Gesucht ist ausdrücklich ein Dienstleistungsunternehmen mit Software und Beraterteam, kein Einzelfreiberufler. Rahmendaten Start: 01.01.2027 (Ramp-up vorab möglich) Laufzeit: 12 Monate, Verlängerung vorgesehen Auslastung: maximal 2 bis 3 Tage pro Woche, laufende Betreuung plus Plattformbetrieb, Onboarding-Phase zu Beginn Einsatzort: ca. 90 % remote, Reisebereitschaft für Vor-Ort-Termine erforderlich Vertragsart: Dienstvertrag Sprache: Deutsch Aufgaben - Übernahme der Funktion des externen IT-Sicherheitsbeauftragten inkl. Bewertung von Changes und Maßnahmen aus Sicherheitssicht mit Statements und Empfehlungen - Automatisierte Sichtung und Bewertung neuer Schwachstellen (CVE, BSI-Lageberichte, Herstellermeldungen) abgeglichen gegen die tatsächliche IT- und OT-Landschaft des Kunden, Priorisierung nach realer Betroffenheit statt reinem Score - Automatisierte Ticketerstellung für relevante Schwachstellen in Richtung des internen IT-Teams - Erstellung und Pflege von Richtlinien (Administration, Kryptografie, Umgang mit Sicherheitsthemen) - Unterstützung bei NIS2- und KRITIS-Nachweisen sowie ISMS-Dokumentation, Identifikation von Dokumentationslücken, auditfähige Nachweisführung - Zusammenarbeit mit IT-Leitung und interner Prozess- und Zertifizierungsstelle Anforderungen - Eigene Plattform für Schwachstellen- und Risikomanagement oder Anbindung an etablierte Scanner (z. B. Claroty, Nozomi) inkl. Dokumentation der Maßnahmen - Referenzen bei Energieversorgern, Stadtwerken oder Netzbetreibern (Pflichtkriterium) - Erfahrung mit OT-Security im Versorgerumfeld - Zertifizierte ISB im Team, Erfahrung mit NIS2, KRITIS, ISO 27001 bzw. ISMS - Ramp-up innerhalb weniger Wochen inkl. initialer Aufnahme der IT-/OT-Landschaft Bitte senden Sie eine kurze Leistungsbeschreibung, Referenzen aus der Energiebranche und eine Preisindikation, wahlweise als monatlicher Fixbetrag oder aufwandsbasiert.", "first_seen": "2026-09-06T11:56:45.187722+00:00", "id": "d357dfae27bfe1ea", "matched_keywords": ["energie", "stadtwerke", "netz"], "published": "2026-09-06T12:01:11+02:00", "source": "freelancermap.de", "title": "Externer IT-Sicherheitsbeauftragter (ISB) für Schwachstellen- und Risikomanagement, NIS2/KRITIS", "url": "https://www.freelancermap.de/projekt/externer-it-sicherheitsbeauftragter-isb-fuer-schwachstellen-und-risikomanagement-nis2-kritis"}]}</script>
