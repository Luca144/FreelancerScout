rte Arbeitsweise Sehr gute Englischkenntnisse in Wort und Schrift Wenn Sie Interesse an diesem Projekt haben, freue ich mich auf die Zusendung Ihres aktuellen Lebenslaufs inklusive Verfügbarkeit sowie Ihrer Stundensatzvorstellung an e.bachbauer[a]huxley.com. Gerne können Sie diese Anfrage auch an geeignete Kontakte in Ihrem Netzwerk weiterleiten. Viele Grüße, Elisabeth Bachbauer SThree_Germany is acting as an Employment Business in relation to this vacancy.", "first_seen": "2026-09-08T18:17:14.147173+00:00", "id": "37c9e2c9b7f65f33", "matched_keywords": ["netz"], "published": "2026-09-08T19:02:40+02:00", "source": "freelancermap.de", "title": "Interim Bilanzbuchhalter (m/w/d)", "url": "https://www.freelancermap.de/projekt/interim-bilanzbuchhalter-m-w-d-3045335"}, {"description": "Wir, die bridgingIT-Gruppe, sind eine herstellerunabhängige, produktneutrale Technologie- und Unternehmensberatung, die Kunden aus den verschiedensten Branchen bei wegweisenden Veränderungsvorhaben unterstützt. Immer dann, wenn wir aufgrund von fehlender Kapazität, dennoch unseren Kunden zufrieden stellen möchten, treten wir über unser Partnermanagement an Externe Professionals. Wir würden uns freuen, Sie schon bald in unserem Partnernetzwerk begrüßen zu dürfen. Anforderungen Auftragsklärung und Beratung des Auftraggebers hinsichtlich Zieldefinition und Projektdesign sowie Konzeption einer leistungsfähigen Projektorganisation Definition der Projektziele (Time, Scope, Budget) in Abstimmung mit dem Auftraggeber. Die finale Entscheidung trifft der Auftraggeber Schaffung kontinuierlicher Transparenz über den Fortschritt der Entwicklung durch regelmäßige Berichterstattung nach Erhalt von Statusmeldungen Nachverfolgung des Projektplans bezüglich Projektphasenablauf und Terminen, Ableitung von Änderungsanforderungen, Konsolidierung von Statusmeldungen vom Auftraggeber, Umsetzung erfolgt durch den Auftraggeber Priorisierung und Fokussierung auf die ergebnisorientierte Schaffung von Projekt-Artefakt consolidated data is missing on adoption, actual depth of usage, development time saved, as well as on the impact on quality, lead times, and developer experience. Statements regarding ROI are currently based on estimates and individual opinions. Project Objective Execution of a time-boxed proof of concept with the DX platform (getdx.com) in order to objectively measure the value contribution of AI tools in software development. The goal is to demonstrate that AI adoption, usage intensity, time savings, and quality effects can be reliably captured, integrated into existing systems, and translated into a well-founded investment and scaling decision. Project Scope Scoping & AI Value Model: Selection of the pilot teams, definition of the success criteria and of a measurement model for AI value (adoption, usage intensity, self-reported and system-measured time savings, impact on lead times and quality, ROI logic against license costs). Platform Setup & Integration: Connection of DX to GitLab, CI/CD, ticketing, and identity/SSO, as well as to the telemetry of the AI tools in use (e.g. Copilot usage data); configuration of teams, hierarchies, and data model. AI Measurement & Baseline: Setup of the DX AI Measurement Framework surveys and of the system-side data collection; baseline before and after the expansion of AI usage. Quality & Risk Assessment: Analysis of the impact on change failure rate, review effort, rework, and security findings, in order not to evaluate AI value purely in terms of speed. Data Protection & Compliance: Anonymity, data protection, and codetermination requirements; data minimization, aggregation thresholds, role and permission concept; clear delineation from individual performance measurement. Evaluation & Decision Proposal: ROI and benefit assessment, identification of the most effective areas of application and of adoption barriers, derivation of enablement measures, and recommendation regarding scaling and license strategy. Tasks Setup and con ughput, error rates, and repository coverage. Rollout & Enablement: Phased introduction (pilot → waves → full coverage), documentation, guidelines, and training of the development teams. Role: Project Manager / Lead Architect (all genders) Responsible for the overall management of the project as well as the technical target architecture of the Renovate solution. Works hands-on, particularly on architectural decisions, prototypes, and critical implementation questions. Responsibilities: Definition of the target architecture Creation and maintenance of the central Renovate configuration standards (shared presets, update and auto-merge policies) Project planning, roadmap, prioritization, and management of the rollout waves Coordination with stakeholders: GitLab platform operations, security, development teams, management Ensuring security and compliance requirements (credential handling, least privilege, CVE prioritization) Technical review of the implementation, coaching of the engineers Anforderungen Required Profile: Several years of experience leading technical projects in large IT landscapes Solid knowledge of GitLab (CI/CD, API, group/permission model) and of Renovate Architectural experience with distributed, scalable systems and container platforms (Kubernetes) Understanding of software supply chain security Ability to implement independently and validate concepts through prototypes Strong communication and stakeholder management skills English speaking Über den Auftraggeber !!! This job is only for Nearshore or Offshore ressources !!! Start date: 15.09.2026 End date: 15.12.2026 + extention option Caoacity: 480 hours Location: Remote", "first_seen": "2026-09-07T17:13:25.302544+00:00", "id": "31cd84947ac98bde", "matched_keywords": ["ems"], "published": "2026-09-07T18:10:26+02:00", "source": "freelancermap.de", "title": "Lead Architect / Project Manager (m/f/x) GitLab | Renovate | DevOps", "url": "https://www.freelancermap.de/projekt/lead-architect-project-manager-m-f-x-gitlab-renovate-devops"}, {"description": "Leistungsbeschreibung Introduction of DX (getdx.com) as a Proof of Concept — Focus on AI Value AI-assisted development tools (e.g. GitHub Copilot, coding agents, AI-assisted code reviews) are being adopted increasingly and generate significant license and operating costs. However, the actual value contribution cannot be reliably measured: consolidated data is missing on adoption, actual depth of usage, development time saved, as well as on the impact on quality, lead times, and developer experience. Statements regarding ROI are currently based on estimates and individual opinions. Project Objective Execution of a time-boxed proof of concept with the DX platform (getdx.com) in order to objectively measure the value contribution of AI tools in software development. The goal is to demonstrate that AI adoption, usage intensity, time savings, and quality effects can be reliably captured, integrated into existing systems, and translated into a well-founded investment and scaling decision. Role in the Project Implements the technical integration of the DX platform and the AI tool telemetry, ensures data availability and data quality, and technically prepares the AI value evaluations. Anforderungen Scoping & AI Value Model: Selection of the pilot teams, definition of the success criteria and of a measurement model for AI value (adoption, usage intensity, self-reported and system-measured time savings, impact on lead times and quality, ROI logic against license costs) Platform Setup & Integration: Connection of DX to GitLab, CI/CD, ticketing, and identity/SSO, as well as to the telemetry of the AI tools in use (e.g. Copilot usage data); configuration of teams, hierarchies, and data model AI Measurement & Baseline: Setup of the DX AI Measurement Framework surveys and of the system-side data collection; baseline before and after the expansion of AI usage Quality & Risk Assessment: Analysis of the impact on change failure rate, review effort, rework, and security findings, in order not to evaluate AI value purely in terms of speed Data Protection & Compliance: Anonymity, data protection, and codetermination requirements; data minimization, aggregation thresholds, role and permission concept; clear delineation from individual performance measurement Evaluation & Decision Proposal: ROI and benefit assessment, identification of the most effective areas of application and of adoption barriers, derivation of enablement measures, and recommendation regarding scaling and license strategy Setup and configuration of the DX platform including SSO/identity integration and permission model Integration of the data sources: GitLab, CI/CD, ticketing as well as usage and telemetry data from the AI tools (e.g. Copilot Metrics API) Setup and validation of the identity/team mapping across AI tools and delivery systems Modeling of the AI value metrics (adoption, usage intensity, time savings, lead time and quality effects) and their linkage to cost data Ensuring data quality, consistency, and completeness; error analysis and correction Implementation of anonymization, aggregation, and data minimization requirements Provision of dashboards, evaluations, and exports for the results and ROI assessment Technical documentation as well as effort estimation for later scaling Über den Auftraggeber Start: 15.09.2026 End: 15.12.2026: + Option to extend Utilisation: approx. 100% Contract type: Contracting | Only nearshore resources may be considered Location: Remote", "first_seen": "2026-09-07T17:13:25.302544+00:00", "id": "50aba468ae0d1852", "matched_keywords": ["ems"], "published": "2026-09-07T18:10:20+02:00", "source": "freelancermap.de", "title": "Data Engineer (m/f/d) focus DevOps | BI", "url": "https://www.freelancermap.de/projekt/data-engineer-m-f-d-focus-devops-bi"}, {"description": "Leistungsbeschreibung Introduction of DX (getdx.com) as a Proof of Concept — Focus on AI Value AI-assisted development tools (e.g t- und Bedarfsinformationen an das interne Team - Perspektive auf langfristige Zusammenarbeit und wiederkehrende Erträge bei laufenden Vertragsbeziehungen Arbeitsmodell: Freiberuflich, remote, deutschlandweit Vergütung: Ausschließlich erfolgsabhängig auf Provisionsbasis, kein Fixum, kein Retainer. Bei erfolgreich vermittelten Kunden und zustande gekommenen Aufträgen ist eine wiederkehrende Provision bei laufenden Vertragsbeziehungen vorgesehen. Die konkrete Ausgestaltung wird transparent und passend zum jeweiligen Geschäftsmodell, Produkt oder Projektumfang vereinbart.", "first_seen": "2026-09-06T18:00:04.562612+00:00", "id": "d1ea7a5788b6d8a2", "matched_keywords": ["netz"], "published": "2026-09-06T18:18:31+02:00", "source": "freelancermap.de", "title": "Selbstständiger Vertriebspartner / Handelsvertreter B2B-Software, KI & IT-Projektgeschäft", "url": "https://www.freelancermap.de/projekt/selbststaendiger-vertriebspartner-handelsvertreter-b2b-software-ki-und-it-projektgeschaeft"}, {"description": "JUSTGROW unterstützt Unternehmer, CEOs, COOs und Leadership-Teams dabei, Wachstum in klare Prioritäten, abgestimmte Führung und verlässliche Umsetzung zu übersetzen. Im Mittelpunkt stehen strategische Growth-Advisory-Mandate für wachstumsorientierte Unternehmen, häufig im B2B-Umfeld, in Buy-and-Build-Konstellationen, Unternehmensgruppen und Scale-ups. Diese Mandate laufen in der Regel über mindestens sechs Monate und häufig über ein Jahr oder länger. Gesucht werden selbstständige Empfehlungs- und Netzwerkpartner , die Zugang zu passenden Entscheidern haben und bei echtem Bedarf eine persönliche, glaubwürdige Einführung herstellen können. Es geht nicht um klassischen Vertrieb , keine Tätigkeit im Namen von JUSTGROW und keinen Abschluss von Verträgen. Die Aufgabe besteht darin, relevante Unternehmer, CEOs, COOs, Investoren, Beiräte oder Führungsteams zu identifizieren, den Bedarf richtig einzuordnen und einen qualifizierten ersten Kontakt herzustellen. Ein guter Anlass für eine Einführung besteht typischerweise dann, wenn Wachstum, Komplexität oder Veränderungsdruck zunehmen, aber Führung, Verantwortung und Umsetzung nicht Schritt halten. Besonders passend sind Situationen mit zu hoher CEO-Abhängigkeit, mangelnd abgestimmten Leadership-Teams, fehlender Verantwortungsübernahme, Buy-and-Build-Integration, Internationalisierung, Nachfolge oder Investoren- und Ergebnisdruck. Typische Zielunternehmen sind wachstumsorientierte B2B-Unternehmen, Buy-and-Build-Organisationen, Unternehmensgruppen und Scale-ups, unter anderem in SaaS, FinTech, InsurTech, Managed Services und Plattformgeschäftsmodellen. Entscheidend ist jedoch weniger die Branche als ein konkreter Wachstums-, Führungs- oder Umsetzungshebel, bei dem ein strategisches Advisory-Mandat sinnvoll ist. Die Einordnung des Bedarfs, das Erstgespräch, die Ausarbeitung des Vorgehens, Angebot, Vertragsabschluss und die Umsetzung übernehmen wir. Der Empfehlungs- oder Netzwerkpartner schafft also keinen Vertriebskanal im engeren Sinne, sondern einen belastbaren Einstieg in eine potenziell hochwertige Kundenbeziehung. Die Vergütung erfolgt erfolgsabhängig auf Basis der tatsächlich vereinnahmten Nettohonorare aus der vermittelten Kundenbeziehung. Für das erste Vertragsjahr beträgt die Provision 20 Prozent, für das zweite Vertragsjahr 10 Prozent . Voraussetzung ist, dass der Kontakt vor der Einführung nicht bereits als aktiver Lead, Kunde oder konkrete Verkaufschance bekannt war und dass die Zuordnung der Einführung nachvollziehbar dokumentiert ist. Die Provision wird anteilig nach Zahlungseingang abgerechnet; die erste Tranche entsteht in der Regel bereits mit der vertraglich vereinbarten Anzahlung. Die konkrete Ausgestaltung der Provisionsregel kann vertraglich frei vereinbart werden und sollte schriftlich klar definiert sein. Nicht Teil der Zusammenarbeit sind Spam, automatisierte Massenansprache, gekaufte oder gescrapte Listen, unzulässige Kaltakquise, die Weitergabe personenbezogener Daten ohne entsprechende Grundlage oder ein Auftreten im Namen von JUSTGROW. Gesucht werden keine Lead-Lieferanten, sondern seriöse, unternehmerisch denkende Personen mit Zugang zu passenden Netzwerken und einem guten Gespür für relevante Situationen. Bitte sende uns: - Den Link zu deinem LinkedIn-Profil - Ggf. den Link zu deiner Website - Eine kurze Beschreibung der Netzwerke bzw. Entscheidergruppen, zu denen du Zugang hast - Zwei bis fünf Sätze dazu, in welchen Situationen du eine Empfehlung passend hältst und wie du üblicherweise eine persönliche Einführung herstellst. Wenn es grundsätzlich passt, lernen wir uns unkompliziert in einem kurzen Teams-Gespräch kennen und klären die Optionen einer Zusammenarbeit.", "first_seen": "2026-09-06T11:56:45.187722+00:00", "id": "ba52173ccfed7102", "matched_keywords": ["netz"], "published": "2026-09-06T12:12:12+02:00", "source": "freelancermap.de", "title": "Empfehlungs- und Netzwerkpartner für CEO- und Growth-Mandate gesucht", "url": "https://www.freelancermap.de/projekt/empfehlungs-und-netzwerkpartner-fuer-ceo-und-growth-mandate-gesucht"}, {"description": "Externer IT-Sicherheitsbeauftragter (ISB) mit Plattform für Schwachstellen- und Risikomanagement, NIS2/KRITIS, Energieversorger Für einen kommunalen Energieversorger (KRITIS, NIS2-pflichtig, ISMS-zertifiziert) suchen wir einen Dienstleister, der die Rolle des externen IT-Sicherheitsbeauftragten übernimmt und das Schwachstellenmanagement über eine eigene Plattform oder angebundene Tools weitgehend automatisiert. Gesucht ist ausdrücklich ein Dienstleistungsunternehmen mit Software und Beraterteam, kein Einzelfreiberufler. Rahmendaten Start: 01.01.2027 (Ramp-up vorab möglich) Laufzeit: 12 Monate, Verlängerung vorgesehen Auslastung: maximal 2 bis 3 Tage pro Woche, laufende Betreuung plus Plattformbetrieb, Onboarding-Phase zu Beginn Einsatzort: ca. 90 % remote, Reisebereitschaft für Vor-Ort-Termine erforderlich Vertragsart: Dienstvertrag Sprache: Deutsch Aufgaben - Übernahme der Funkti unches, Verkaufsaktionen und Online-Kampagnen * Entwicklung und Optimierung von Funnels und Customer Journeys * Planung und Weiterentwicklung von Newsletter- und E-Mail-Marketing-Strategien * Analyse und Optimierung von Kampagnen, Verkaufsprozessen und Funnels * Abstimmung mit Partner:innen, Expert:innen und Projektbeteiligten * Einsatz von AI-Tools für Recherche, Content-Vorbereitung, Automatisierung und Prozessoptimierung ## Das bringst du fachlich mit Du hast mehrjährige Erfahrung im Projektmanagement und bereits digitale Projekte eigenständig geplant, gesteuert und umgesetzt. Erfahrung mit Online-Akademien, digitalen Weiterbildungsangeboten, Kursen, Kongressen oder Coachings ist von Vorteil. Wichtig sind außerdem: * sehr gute Kenntnisse im Projektmanagement und Online-Marketing * Erfahrung mit digitalen Produkten, Launches, Funnels und Online-Verkaufsprozessen * Kenntnisse in Newsletter- und E-Mail-Marketing-Strategien * Verständnis für Customer Journeys, Community-Aufbau und digitale Geschäftsmodelle * Erfahrung in der Analyse und Optimierung von Kampagnen und Prozessen * sehr gute Deutschkenntnisse und gute Englischkenntnisse * sicherer Umgang mit digitaler Kommunikation ## Deine Toolkenntnisse Du hast Grundkenntnisse oder praktische Erfahrung mit: * WordPress * ActiveCampaign * Digistore24 * ChatGPT, Claude oder vergleichbaren AI-Tools * Projektmanagement-Tools wie Asana * Google Workspace * Zoom und Webinar-Tools * Kursplattformen und Mitgliederbereichen * Analyse- und Tracking-Tools Du musst technische Aufgaben nicht vollständig selbst umsetzen können. Wichtig ist, dass du Zusammenhänge verstehst, kleinere Anpassungen vornehmen und Dienstleister:innen kompetent koordinieren kannst. ## Persönlich passt du zu uns, wenn du * eigenverantwortlich, strukturiert und lösungsorientiert arbeitest * mehrere Projekte und Prioritäten gleichzeitig steuern kannst * verbindlich, empathisch und klar kommunizierst * Aufgaben konsequent nachhältst * Verantwortung übernimmst u
