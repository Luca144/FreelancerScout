s und des Release Train Engineer. Die Leistungserbringung erfolgt 60% Remote und 40% Onsite (Frankfurt (Main)).", "first_seen": "2026-11-26T19:58:50.705948+00:00", "id": "defdfac2564ad385", "matched_keywords": ["scrum master", "product owner", "agil", "scrum"], "published": "2026-11-26T18:33:20+01:00", "source": "freelancermap.de", "title": "Scrum Master (m/w/d) (ID: 2198)", "url": "https://www.freelancermap.de/projekt/scrum-master-m-w-d-id-2198"}, {"description": "Deine Aufgaben Du unterstützt den Product Owner bei der Anforderungsklärung mit Fachbereichen und Architekten. Du führst Interviews mit Stakeholdern zur Bedarfserhebung und -bewertung durch. Du moderierst Veranstaltungen wie Anwenderworkshops und fachliche Reviews und hältst Präsentationen. Du dokumentierst funktionale und nicht-funktionale Anforderungen und erstellst Artefakte zur Planung und Umsetzung nach agilem Vorgehen, insbesondere Epics, Features und Stories. Du beschreibst und führst abnahmerelevante Testfälle durch und definierst Akzeptanzkriterien. Du erstellst und pflegst Systemdokumentationen und Benutzerhandbücher. Du stimmst dich funktional mit Schnittstellenpartnern sowie inhaltlich und planerisch mit Umsetzungsteam, Architekten und weiteren beteiligten Teams ab. Du förderst den Wissensaustausch und die Standardisierung im crossfunktionalen Team. Du berätst den Product Owner im Risikomanagement durch Bewertung und Dokumentation fachlicher Risiken sowie durch die Ableitung von Handlungsoptionen zu deren Minimierung. Du analysierst bestehende Implementierungen mit Verständnis für Python oder C++ und leitest daraus Schnittstellen-Spezifikationen ab. Du bringst deine fachliche und IT-Expertise in die Entwicklung von Webapplikationen zur Transport- und Fahrplanplanung sowie in die Integration hochperformanter Services in die AWS Cloud und die IT-Basislandschaft eines Infrastruktur- und Logistikunternehmens ein. Das solltest du mitbringen Erforderlich: Know-how im funktionalen Architektur- und Anforderungsmanagement. Know-how in Geschäftsprozessanalyse und -gestaltung. Systemisches Denken und die Fähigkeit, Abhängigkeiten abzuleiten. Mindestens 6 Monate praktische Erfahrung in der Anforderungsaufnahme und -dokumentation in agilen Softwareprojekten oder in einem vergleichbaren Kontext. Mindestens 6 Monate Erfahrung in der Beschreibung von Features und User Stories gemäß SAFe oder einem vergleichbaren agilen Rahmenwerk. Mindestens 1 Jahr Erfahrung in der Beschreibung fachlicher Testfälle. Mindestens 1 Jahr Erfahrung in der Datenanalyse, zum Beispiel in der strukturierten Auswertung großer Datensätze mit Excel, SQL, Python oder BI-Tools. Verständnis von Python oder C++ zur Analyse bestehender Implementierungen und zur Ableitung von Schnittstellen-Spezifikationen. Ausgeprägte Kommunikationsstärke, Teamfähigkeit, Eigeninitiative und eine Hands-on-Mentalität. Freude am eigenständigen Arbeiten sowie am strukturierten Aufbau neuer Themen, Tools und Prozesse auf strategischer und operativer Ebene. Freude an der Vorbereitung und Durchführung von Workshops und Präsentationen. Ein agiles Mindset sowie eine analytische Denkweise und Durchsetzungsvermögen. Gewünscht: Erfahrung in der Moderation von Veranstaltungen wie fachlichen Reviews, Anwenderworkshops und bereichsübergreifenden Formaten mit mindestens 15 Teilnehmenden. Erfahrung in der Abstimmung mit Ansprechpartnern innerhalb und außerhalb der Plattform. Praktische Erfahrung in Problemlösung und Arbeitsorganisation. Mindestens 2 Jahre Erfahrung in der Anwenderpräsentation auf operativer und taktischer Ebene. Erfahrung im frühzeitigen Erkennen von Risiken und in deren Adressierung an Risikoverantwortliche. Mindestens 6 Monate Praxiserfahrung mit SAFe auf Ebene eines Agile Teams. Erfahrung im Backlog-Management mit Tools wie Jira, Azure DevOps oder vergleichbaren Lösungen. Erfahrung mit Prozesserhebung und Prozessmodellierung, zum Beispiel mit BPMN oder UML. Kenntnisse über Testmanagementmethoden und unterstützende Tools. Ein abgeschlossenes Studium in einem MINT-Fach. Erfahrung im Logistik- und Transportumfeld, in vergleichbaren Infrastruktursektoren oder durch ein Verkehrsingenieurstudium erworbene Kenntnisse. Stressresistenz. Sehr gute Deutschkenntnisse in Wort und Schrift. Das bieten wir dir Ein spannendes Umfeld in der Entwicklung von Webapplikationen für die automatisierte Transport- und Fahrplanplanung sowie Kapazitätsbelegung. Die Möglichkeit, in einem eigenständig agierenden Team innerhalb eines skalierten agilen Umfelds zu arbeiten. Ein technologisch anspruchsvolles Projekt mit Fokus auf hochperformante Services und Cloud-Integration in AWS. Engen Austausch mit Fachbereichen, Architekten, Schnittstellenpartnern und crossfunktionalen Teams. Viel Gestaltungsspielraum in der Anforderungsanalyse, Testfallgestaltung und Prozessoptimierung. Ein agiles Arbeitsumfeld mit viel Gestaltungsspielraum und Raum für Eigeninitiative. Ein erfahrenes und motiviertes Team. Persönliche und fachliche Weiterentwicklungsmöglichkeiten. Die Leistungserbringung erfolgt 60% Remote und 40% Onsite (Frankfurt (Main))", "first_seen": "2026-11-26T19:58:50.705948+00:00", "id": "1dbf79f39865c413", "matched_keywords": ["product owner", "agil", "tso"], "published": "2026-11-26T18:33:15+01:00", "source": "freelancermap.de", "title": "Business Engineer (m/w/d) (ID: 2199)", "url": "https://www.freelancermap.de/projekt/business-engineer-m-w-d-id-2199"}, {"description": "Deine Aufgaben Du übernimmst die Scrum Master Rolle in einer Large Solution für ein bestehendes Scrum Team mit 10 Mitarbeitenden. Du coachst das Team hinsichtlich agiler Prinzipien und Methoden und stellst die Einhaltung der Scrum-Regeln sicher. Du nimmst Impediments auf Teamebene auf, beseitigst diese und treibst die Lösung von Hindernissen voran, die das DevTeam oder der Product Owner nicht selbst lösen können. Du unterstützt den Product Owner aktiv und koordinierst Abstimmungen mit weiteren bestehenden Projektteams sowie der übergreifenden Projektleitung. Du machst persönlichen und fachlichen Entwicklungsbedarf transparent und begleitest die Weiterentwicklung des Teams. Du förderst den teaminternen und übergreifenden Kommunikationsfluss und agierst bei Bedarf als Vermittler und Facilitator. Du koordinierst und moderierst Meetings wie Dailys und Retrospektiven. Du sorgst für einen kontinuierlichen Verbesserungsprozess durch regelmäßige Retrospektiven und geeignete Maßnahmen zur Prozessverbesserung. Du unterstützt das Scrum-Team bei der Erreichung der Iterationsziele und stellst die Nachverfolgung der Definition of Done sicher. Du stellst die regelmäßige Überprüfung der Arbeitsweise und Arbeitsergebnisse sowie die fortlaufende Anpassung an gewonnene Erkenntnisse sicher. Du sicherst Teamkapazität und Velocity für Sprint- und PI-Planung und förderst die teamübergreifende Zusammenarbeit im Projektverbund und darüber hinaus. Das solltest du mitbringen Erforderlich: In den letzten 5 Jahren hast du ausschließlich als Scrum Master in SAFe-Softwareentwicklungsprojekten gearbeitet, ohne gemischte Tätigkeiten. Davon hast du mindestens 2 Jahre lang ein Team als Scrum Master begleitet. Du verfügst über eine Zertifizierung als Scrum Master. Du bringst Kenntnisse in der Skalierung von Scrum mit. Du kannst 4 Projektreferenzen als Scrum Master in Projekten mit mehreren parallel arbeitenden Scrum-Teams vorweisen, davon mindestens 2 Referenzen mit angewandter agiler Skalierung. Du besitzt ausgeprägte Methodenkompetenz sowie Know-how in Modellierung und Vorgehensmodellen. Du bringst Problemlösungs- und Arbeitsorganisations-Know-how mit. Du verfügst über Moderations-Know-how, gutes Zeitmanagement und eine strukturierte sowie organisierte Arbeitsweise. Du überzeugst mit guter Kommunikationsfähigkeit, Einsicht in zwischenmenschliche Beziehungen sowie Pragmatismus an der Schnittstelle zwischen Team und Organisation. Du hast Know-how zur Identifikation von Chancen und Risiken sowie zu Führungs- und Teamverhalten. Du bringst Know-how in Kunden- und Serviceorientierung, Geschäftsprozessanalyse und -gestaltung sowie Projektmanagement mit. Du zeichnest dich durch Kommunikationsstärke, Teamfähigkeit, Durchsetzungsvermögen und eine analytische Denkweise aus. Gewünscht: Eine SAFe Zertifizierung ist von Vorteil. Erfahrung im Logistikumfeld, idealerweise in den Bereichen Vertrieb, Fernverkehr oder Infrastruktur eines Logistikunternehmens, ist wünschenswert. Du verfügst idealerweise über Präsentations-Know-how, Branchen- und Integrationswissen sowie Know-how in Verhandlungsführung. Sehr gute Deutschkenntnisse in Wort und Schrift. Das bieten wir dir Eine verantwortungsvolle Rolle in einem anspruchsvollen SAFe-Umfeld mit hoher Relevanz für die Zusammenarbeit in einer Large Solution. Ein spannendes Arbeitsumfeld, in dem du ein Team in einer herausfordernden Entwicklungsphase aktiv begleiten und prägen kannst. Enge Zusammenarbeit mit erfahrenen Stakeholdern wie Product Owner, weiteren bestehenden Projektteams und der übergreifenden Projektleitung. Ein agiles Arbeitsumfeld mit viel Gestaltungsspielraum und Raum für Eigeninitiative. Die Leistungserbringung erfolgt 60% Remote und 40% Onsite (Frankfurt (Main)).", "first_seen": "2026-11-26T19:58:50.705948+00:00", "id": "a5c5f9e459e83d0a", "matched_keywords": ["scrum master", "product owner", "agil", "scrum", "tso"], "published": "2026-11-26T18:33:11+01:00", "source": "freelancermap.de", "title": "Scrum Master (m/w/d) (ID: 2200)", "url": "https://www.freelancermap.de/projekt/scrum-master-m-w-d-id-2200"}, {"description": "Deine Aufgaben Du übernimmst die fachliche Betriebsführung des Infrastrukturmanagers im Bereich Fahrplan. Du baust die fachliche Betriebsführung für ein neues Fachprodukt in einem bestehenden Projektumfeld mit auf. Du arbeitest eng mit dem Anforderungsmanagement zusammen, um fachliche und technische Anforderungen abzustimmen. Du sicherst und analysierst die Datenqualität der Bestandsdaten mithilfe bestehender Dashboards und stößt Korrektur e Deutschkenntnisse und gute Englischkenntnisse in Wort und Schrift. Das bieten wir dir Eine zentrale Rolle in einem strategisch wichtigen Umfeld rund um den Infrastrukturmanager und das neue Fachprodukt. Ein agiles Arbeitsumfeld in einem bestehenden Projektumfeld mit enger Zusammenarbeit über Teams und Systeme hinweg. Ein vielseitiges Aufgabenspektrum aus Betriebsführung, Testmanagement, Datenqualität, Anwendersupport und Prozessgestaltung. Die Möglichkeit, neue Strukturen und Prozesse aktiv mitzugestalten, insbesondere beim Aufbau der fachlichen Betriebsführung für das neue Fachprodukt und bei der Einführung des neuen ITSM-Tools. Ein erfahrenes und motiviertes Team. Persönliche und fachliche Weiterentwicklungsmöglichkeiten. Die Leistungserbringung erfolgt 60% Remote und 40% Onsite (Frankfurt (Main))", "first_seen": "2026-11-26T19:58:50.705948+00:00", "id": "a45cdc0924e67ab8", "matched_keywords": ["agil", "scrum"], "published": "2026-11-26T18:33:06+01:00", "source": "freelancermap.de", "title": "Application Specialist (m/w/d) (ID: 2201)", "url": "https://www.freelancermap.de/projekt/application-specialist-m-w-d-id-2201"}, {"description": "Freelance AI Adoption & Governance Consultant / Senior Software Engineer (Shopware) For a client in the renewable energy sector, we are looking for an experienced freelance consultant who combines a strong software development background with hands-on AI adoption, governance and stakeholder management experience. This is not a pure AI engineering or software development project. The consultant will work across business and technology teams to help the organization use AI effectively, safely and sustainably. The ideal consultant combines strong technical capabilities — particularly PHP, Symfony and Shopware 6 — with the ability to work directly with nontechnical business users, understand their challenges and translate business requirements into practical AI solutions. Project Responsibilities Work directly with business users to u hanismen zur Sperrung kompromittierter Zertifikate, insbesondere in Umgebungen mit eingeschränkter oder unterbrochener Netzwerkkonnektivität. Implementierung und Erweiterung von Zero-Trust-Sicherheitsmechanismen im Linkerd-Proxy unter Berücksichtigung von Policy Enforcement Points (PEP) und Policy Decision Points (PDP). Durchführung von Performance- und Funktionstests sowie Optimierung des Proxys für Netzwerkumgebungen mit geringer Bandbreite und hoher Latenz. Analyse und Optimierung des Wiederherstellungsverhaltens nach längeren Netzwerkunterbrechungen. Technische Unterstützung bei Sicherheitsbewertungen und Zulassungsprozessen, insbesondere in den Bereichen Kryptografie und Threat Modeling. Einbringung der entwickelten Erweiterungen in das Open-Source-Projekt Linkerd einschließlich Begleitung der entsprechenden Review-Prozesse. Qualifikations- und Erfahrungsanforderungen Mindestens 2 Jahre praktische Erfahrung mit Linkerd sowie fundierte Kenntnisse der technischen Architektur und Implementierung Mindestens 2 Jahre Erfahrung in der Softwareentwicklung mit Rust und Go Mindestens 2 Jahre Erfahrung im Umgang mit Kubernetes sowie im Bereich Platform Engineering Haben wir Ihr Interesse geweckt? Dann senden Sie uns Ihren CV im Wordformat sowie Ihre aktuelle Verfügbarkeit inklusive Stundensatz an: stefan.zalewski AT deedcon.de", "first_seen": "2026-11-26T01:32:37.593583+00:00", "id": "9fc30ce4f0f86f47", "matched_keywords": ["netz"], "published": "2026-11-25T20:53:50+01:00", "source": "freelancermap.de", "title": "Platform Engineer – Service Mesh Security & Development (m/w/d)", "url": "https://www.freelancermap.de/projekt/platform-engineer-service-mesh-security-und-development-m-w-d"}, {"description": "Einsatzort: Deutschland / 100 % Remote Start: ab Dezember 2026 Ende: bis Juni 2027 Erfahrungsstufe: ab Junior Sprachen: Deutsch ab B2 Staatsangehörigkeit: deutsch (Voraussetzung, Wohnsitz beliebig) Tagessatz: bis 600 €/Tag Projektüberblick Wir suchen einen Cloud Developer für die Entwicklung und den Betrieb von Kubernetes-basierten Infrastrukturen mit Fokus auf sichere Artefakt-Verwaltung. Das Ziel ist die Implementierung von Prozessen für den Transfer in Air-Gapped Systems. Die Schwerpunkte liegen in der Programmierung von Kubernetes-Operatoren sowie der Verwaltung einer multi-tenant Artefact Registry. Die Arbeit umfasst die Absicherung der Software-Supply-Chain und die Automatisierung mittels GitOps. Aufgaben - Entwickeln von Kubernetes-Operatoren in Go für den Artefaktbezug und die Bündelung via OCI und OCM - Implementieren von Integritätsprüfungen mittels Cosign und SHA - Betreiben einer multi-tenant Artefact Registry auf Kubernetes-Basis - Sicherstellen der Sicherheit durch Virenscans und die Integration von Falco - Automatisieren von Deployment-Prozessen durch CI/CD und GitOps unter Verwendung von Helm - Vorbereiten und Umsetzen von Air-Gap-Transfer-Verfahren - Verwalten von Speichersystemen mit Ceph Profil Erforderlich: - Berufserfahrung in der Rolle als Cloud Developer - Fundierte Kenntnisse in der Entwicklung mit Go und Python - Sicherer Umgang mit Kubernetes, Helm, GitOps und CI/CD - Erfahrung in der Arbeit mit Ceph, OCI sowie dem Open Component Model (OCM) - Anwendung von Falco zur Absicherung der Umgebung - Kenntnisse im Bereich Air-Gapped Systems - Deutschkenntnisse auf Niveau B2 Erfahrung: - Berufserfahrung auf Junior-Niveau Von Vorteil: - DevSecOps - Infrastructure as Code - Speichersystem - SBOM & Supply-Chain-Security - Public Cloud - Software Engineering - Cosign - Oracle Cloud Infrastructure (OCI) - SHA", "first_seen": "2026-11-26T01:32:37.593583+00:00", "id": "d49289ef63e6550e", "matched_keywords": ["ems"], "published": "2026-11-25T20:29:29+01:00", "source": "freelancermap.de", "title": "Cloud Developer (Air-Gapped Systems, Ceph, CI/CD) | Remote", "url": "https://www.freelancermap.de/projekt/cloud-developer-air-gapped-systems-ceph-ci-cd-remote"}, {"description": "Location: Fully Remote Start: 15 January 2027 (lates orting, Gremiensteuerung und Maßnahmentracking Beratung zur Weiterentwicklung und Standardisierung von PMO-Prozessen, Steuerungsinstrumenten und Reporting-Standards - Methodische Unterstützung bei weiteren Themen des operativen Projekt- und Programmmanagements Interessiert? Interessiert? Wir freuen uns auf Ihren aussagekräftigen Lebenslauf/CV in elektronischer Form. Ihr Ansprechpartner: Patrick Hoening ***** ***** *****", "first_seen": "2026-11-20T09:39:23.561607+00:00", "id": "0373ef581bbe1cbe", "matched_keywords": ["pmo"], "published": "2026-11-20T09:50:35+01:00", "source": "freelancermap.de", "title": "PMO DWX (m/w/d)", "url": "https://www.freelancermap.de/projekt/pmo-dwx-m-w-d"}, {"description": "Westhouse ist eines der führenden Recruitment-Unternehmen für die Vermittlung hochqualifizierter Fachexperten aus dem gesamten IT-Lifecycle- und Engineering-Bereich. Für unseren Kunden suchen wir aktuell eine/n Product Owner mit einer gültigen SAFe Zertifizierung (MUSS) (m/w/d) Rahmeninformationen Referenz:181092 Einsatzort:Remote & Frankfurt am Main Starttermin:02.12.2026 Arbeitszeit:Vollzeit 10 Tage (davon 2 Onsite) Dauer:31.12.2026 mit Option einer Verlängerung in 2027 Sprachen:Deutsch (C2) Ihre Qualifikationen - Bitte NUR bewerben, wenn ALLE KRITERIEN erfüllt sind: - MUSS-Kriterien: - 5 Jahre Erfahrung als Product Owner oder Technical Product Owner in agilen IT-Entwicklungsteams mit Verantwortung für ein Team Product Backlog auf User-Story-Ebene. - Erfahrung als Product Owner oder Technical Product Owner in einem Agile Release Train nach SAFe (PI Planning, Feature Refinement, Team-Backlog im ART) sowie gültige SAFe-Zertifizierung, Nachweis durch Zertifikat: SAFe Product Owner/Product Manager (POPM), SAFe Architect (ARCH) oder SAFe DevOps - 5 Jahre Erfahrung mit Konzeption, Weiterentwicklung oder Steuerung von Datenverarbeitungspipelines für Ingestion, Transformation, Validierung oder Bereitstellung von Daten. - 5 Jahre Erfahrung mit der technischen Bewertung und Abnahme von Anforderungen bzw. User Stories in IT-Entwicklungsprojekten. - 5 Jahre Erfahrung mit Continuous Delivery (Release, Deployment, Patching) in agilen IT-Entwicklungsprojekten. - SOLL-Kriterien: - 5 Jahre Erfahrung Erfahrung mit Datenverarbeitungsarchitekturen im Umfeld von ETL/ELT, Data Lake bzw. Data Lakehouse oder eventgetriebener Datenverarbeitung. - Erfahrung aus mind. 3 Projekten mit geodaten-, BIM- oder sensorbezogenen Datenformaten bzw. Datenflüssen (z. B. Punktwolken, Bild- und Vermessungsdaten; LAS/LAZ, IFC, GeoTIFF, CityGML). - 5 Jahre Erfahrung mit Cloud-basierter Pipeline-Orchestrierung und deren Betrieb (z. B. AWS Step Functions, Apache Airflow, Prefect oder vergleichbar). - 5 Jahre Erfahrung mit technischen Architektur- und Technologieentscheidungen für datenverarbeitende IT-Lösungen (Technologieauswahl, Datenhaltung, Speicherformate, Skalierung). - Erfahrung aus mind. 3 Projekten mit der Synchronisation von Backlogs und technischen Abhängigkeiten über mehrere Teams eines Agile Release Train. Ihre Aufgaben - Analyse fachlicher Anforderungen und Produktziele sowie Erarbeitung von Vorschlägen für deren Überführung in technisch umsetzbare Anforderungen und User Stories; Beratung zur Überführung der vom Product Management übergebenen Features in die technische Umsetzungsplanung. - Analyse und Bewertung des Team Product Backlogs auf User-Story- und Task-Ebene; fortlaufende fachlich-technische Validierung der Anforderungen als Beratungsleistung; Erarbeitung von Empfehlungen zur Strukturierung und Priorisierung sowie Bewertung von Backlog-Änderungen hinsichtlich ihrer technischen Auswirkungen. - Ausarbeitung technischer User Stories einschließlich Akzeptanzkriterien als Entscheidungsgrundlage für das Team; Erarbeitung von Verbesserungsvorschlägen zu Definition of Ready und Definition of Done. - Technische Bewertung von Anforderungen hinsichtlich Machbarkeit, Aufwand, technischer Abhängigkeiten und Auswirkungen auf bestehende Lösungen. - Fachlich-technische Beratung im Rahmen von Feature- und User-Story-Refinements einschließlich Aufbereitung der Beratungsgrundlagen. - Beratung zur Planung technischer Liefergegenstände im Hinblick auf Sprint- und PI-Ziele; Erarbeitung technischer Planungsempfehlungen als Input für das PI Planning. - Analyse von Abhängigkeiten zwischen Team-Backlog, angrenzenden Backlogs und Programmzielen sowie Erarbeitung von Handlungsempfehlungen; technische Beratung von Epic Ownern und Product Management bei der Ausarbeitung von Epics und Features. - Erarbeitung und Fortschreibung eines Vorschlags für eine Pipeline-Roadmap auf Basis der Gesamtarchitektur der Plattform. - Konzeption und Bewertung von Lösungsansätzen für Datenverarbeitung und Datenpipelines (Ingestion, Transformation, Validierung, Bereitstellung), einschließlich Cloud-Speicher- und Transferkonzepten, z. B. S3, SFTP und Cloud-to-Cloud-Synchronisation. - Analyse von Anforderungskonflikten im Pipeline-Kontext (z. B. Batch- oder Streaming-Verarbeitung, Datenstandards, Datenformate) und Erarbeitung von Lösungsoptionen mit Empfehlung. - Erarbeitung und Bewertung von Lösungs- und Architekturoptionen im Pipeline-Kontext (Orchestrierung, Datenhaltung, Speicherformate, Schnittstellen, Skalierung) einschließlich Entscheidungsempfehlungen. - Analyse und Bewertung technischer Schulden sowie Empfehlungen zur Priorisierung von Refactoring gegenüber Feature-Entwicklung. - Technische Prüfung und Bewertung umgesetzter User Stories anhand der Akzeptanzkriterien und der Definition of Done; Erarbeitung einer Empfehlung zur Freigabe von Deployments auf die Abnahmeumgebung. - Fachliche Beratung zur Beschreibung von Testfällen und zu Entwicklungstestmaßnahmen. - Beratung zur Definition und Umsetzung nicht-funktionaler Anforderungen (Performance, Wartbarkeit, Verfügbarkeit, IT-Security); Analyse von Bedrohungen und Schwachstellen und Erarbeitung von Maßnahmenempfehlungen für Architektur und technische Betriebsführung. - Fachliche Beratung zum Continuous-Delivery-Prozess (Release, Deployment, Hotfixing, Patching) einschließlich Analyse und Optimierungsempfehlungen. - Erarbeitung von Konzepten und Empfehlungen zu Run-Books sowie zu Test-, Betriebs- und Dokumentationskonzepten. - Analyse technischer Wartungsbedarfe und Empfehlungen zu deren Priorisierung; Ursachenanalyse technischer Störungen im 3rd-Level-Support einschließlich Lösungsempfehlungen. - Analyse technischer Anforderungen und Abhängigkeiten gegenüber angrenzenden Teams (Plattformbetrieb, Datenmanagement, Datenkonsumenten) und Einbringen der technischen Pipeline-Expertise in übergreifende Architekturrunden in beratender Funktion. - Fachlich-technische Analyse von Schnittstellenanforderungen und Datenlieferungen externer Dienstleister und Datenlieferanten sowie Erarbeitung von Empfehlungen. - Strukturierte Dokumentation der Analyseergebnisse, Empfehlungen und Abhängigkeiten in den agilen Werkzeugen des ART. Interessiert? Interessiert? Wir freuen uns auf Ihren aussagekräftigen Lebenslauf/CV in elektronischer Form. Ihr Ansprechpartner: Elvin Cagi ***** ***** *****", "first_seen": "2026-11-19T18:50:54.393521+00:00", "id": "e331e7828558f3c3", "matched_keywords": ["product owner", "agil"], "published": "2026-11-19T19:28:32+01:00", "source": "freelancermap.de", "title": "Product Owner mit einer gültigen SAFe Zertifizierung (MUSS) (m/w/d)", "url": "https://www.freelancermap.de/projekt/product-owner-mit-einer-gueltigen-safe-zertifizierung-muss-m-w-d"}, {"description": "Guten Tag, für einen unserer Kunden im öffentlichen Umfeld suchen wir einen erfahrenen Administrator für den operativen Betrieb von Linux-, Firewall-, Proxy- und VPN-Umgebungen. Projektdetails Start: ASAP Standort: Mainz (Hybrid) Auslastung: Vollzeit Laufzeit: 3–4 Jahre Anforderungen Sehr gute Linux-Kenntnisse Erfahrung in der Firewall-Administration, idealerweise mit Fortinet, Check Point oder Juniper Proxy-Kenntnisse, beispielsweise Blue Coat/ProxySG oder FortiProxy Erfahrung mit VPN Gutes Netzwerkve ment issues, and test data or test environment limitations. You will identify dependencies involving other teams, vendors, and OSS/BSS systems and recommend suitable approaches for managing them. You will provide expert input on delivery optimization, risk management, and continuous improvement opportunities. You will create visibility around progress, blockers, dependencies, and delivery risks. You will facilitate constructive collaboration in an intercultural and complex enterprise environment. You will support teams in becoming more self-organized, structured, transparent, and delivery-focused. Projekt-Nr.: 1085601 Projekttitel: 1085601 SCRUM Master (m/w/d) Stellentyp: freiberuflich Einsatzort: Remote + Düsseldorf Starttermin: 04.01.2027 Dauer: 3-6M Anforderungen: Job Requirements To succeed as a Scrum Master Consultant, you should combine practical Scrum Master experience with strong consulting, facilitation, and stakeholder management capabilities. You will be working in an environment where software delivery involves complex Java applications, multiple interfaces, technical dependencies, and a range of internal and external stakeholders. Therefore, you should be comfortable looking beyond ceremonies and recognizing the broader organizational and technical factors that influence delivery performance. We are looking for someone who can independently assess situations, communicate issues clearly, and turn observations into actionable recommendations. You should be confident working with intercultural development teams and navigating complex enterprise or telecommunications environments. A proactive, solution-oriented, and organized mindset is essential, as is the ability to maintain a clear focus on delivery while supporting continuous improvement. The role is suited to a professional with approximately three to five years of relevant experience in Scrum Master or agile consulting assignments. You will bring approximately three to five years of relevant experience as a Scrum Master, Agile Coach, or agile consultant. You will demonstrate experience in Scrum Master consulting engagements within enterprise software development environments. You will have experience working with intercultural development teams and diverse stakeholder groups. You will bring experience from telecommunications, complex enterprise, or similarly demanding technology environments. You will have strong practical knowledge of Agile and Scrum methodologies and their application in real delivery situations. You will be able to assess technical and organizational impediments and recommend appropriate mitigation measures. You will demonstrate excellent communication, stakeholder engagement, facilitation, and conflict-resolution skills. You will be familiar with Jira and Confluence and understand how to use them to support transparency and collaboration. You will be proactive, solution-oriented, self-organized, and comfortable working independently. You will work in a structured, delivery-focused manner and remain effective in complex environments. You will ideally hold a Scrum Master certification such as PSM, CSM, or an equivalent qualification. You will ideally have experience with ServiceNow platforms. You will ideally have German-language skills; however, the required language level has not been specified. Zusätzliche Informationen: SOLCOM zählt zu den führenden Technologiedienstleistern in den Bereichen Softwareentwicklung, IT und Engineering. Seit mehr als 20 Jahren arbeiten wir als Partner global agierender Spitzenunternehmen aller Branchen und sind weltweit im Einsatz, wo Innovation entscheidet.", "first_seen": "2026-11-19T09:52:12.692225+00:00", "id": "ffcab4f6544e4956", "matched_keywords": ["scrum master", "agil", "scrum", "ems"], "published": "2026-11-19T10:39:04+01:00", "source": "freelancermap.de", "title": "1085601 SCRUM  Master (m/w/d)", "url": "https://www.freelancermap.de/projekt/1085601-scrum-master-m-w-d"}, {"description": "Tätigkeiten:  discovery • Bosch logistics, manufacturing or comparable global-enterprise experience; German language skills are an advantage Support the Copilot for Logistics initiative by identifying and shaping high-value AI use cases for logistics, translating logistics and SAP process needs into implementable functional concepts, and guiding the project from discovery through prioritization, validation and implementation preparation. Main task/activity Support the Copilot for Logistics initiative by identifying and shaping high-value AI use cases for logistics, translating logistics and SAP process needs into implementable functional concepts, and guiding the project from discovery through prioritization, validation and implementation preparation. Other tasks and activities • Analyze administrative and decision-support activities in warehouse, production and transportation processes and identify relevant inefficiencies, user needs and automation potential • Plan and facilitate interviews and workshops with logistics process owners, key users, SAP experts, product teams and IT architects • Document as-is processes, pain points, business requirements, user journeys and target outcomes in a structured and traceable form • Develop and refine AI use cases, including user value, functional scope, required data and knowledge, SAP integration points, risks, dependencies and measurable success criteria • Assess solution options across Microsoft Copilot technologies, SAP capabilities, AI agents and other enterprise AI applications, and recommend fit-for-purpose approaches • Prioritize use cases according to business value, feasibility, data readiness, scalability, implementation effort and compliance constraints • Create functional concepts, epics or user stories, acceptance criteria, prototype/PoC scopes and a phased implementation roadmap • Support alignment with AI platform, architecture, security, identity, data and governance stakeholders and prepare decision material for managem re need someone who is not only able to further develop an existing architecture, but who has proven experience building data structures and target architectures from the ground up . Main Responsibilities Analyze the existing scientific and operational data landscape across different teams, systems and applications. Map and assess data sources, data flows, APIs, interfaces, repositories and existing data silos . Identify inconsistencies, integration gaps and opportunities for harmonization. Define and establish a scalable target data architecture connecting heterogeneous data sources and domains. Design harmonized and context-rich data models across operational, scientific and analytical data. Structure core scientific entities such as Experiment, Sample, Instrument and Instrument Raw Data into reusable Data Products. Establish relationships and dependencies between different data domains and entities. Define semantic layers, metadata structures, controlled vocabularies and common taxonomies . Establish concepts for Data Governance, Data Ownership, Metadata Management, Data Quality and Data Lineage . Support the integration, migration and standardization of legacy and vendor-specific data sources. Enable reliable data consumption for Data Science, Advanced Analytics and AI use cases . Own architectural deliverables from initial discovery and target architecture through data modeling and implementation guidance. Key Requirements 8+ years of experience in Data Architecture, Data Modeling, Enterprise Data Management or comparable senior data roles. Proven experience designing and establishing complex data architectures from scratch . Strong track record integrating and harmonizing multiple heterogeneous data sources and legacy systems . Ideally previous experience within Life Sciences, Pharma, Biotech, Diagnostics, MedTech or advanced R&D environments . Strong hands-on expertise in Data Modeling and modern data architectures. Strong knowledge of Snowflake and AWS . Experience with Data Products and Data Mesh concepts. Knowledge of modeling methodologies such as Dimensional Modeling / Kimball and Data Vault 2.0 . Strong understanding of Data Governance, Metadata Management and Data Lineage . Ability to translate complex business and scientific requirements into scalable technical data structures. Strong stakeholder management skills and confidence working across Business, R&D, Data Science, Engineering and IT . Ability to take technical/architectural ownership rather than purely executing predefined specifications. Highly Relevant / Strong Advantage Experience with the following would be particularly valuable: FAIR Data Principles Semantic Data Modeling Ontologies and Taxonomies Knowledge Graphs Scientific / Laboratory Data LIMS / ELN environments Instrument-generated data Laboratory instruments such as LC/MS, HPLC or Plate Readers Scientific Data Standards Allotrope Framework , particularly AFO, ASM, ADM and ADF What is particularly important This is not a classic Data Engineer or purely Cloud Architect position . We are particularly interested in candidates who can demonstrate situations where they entered a fragmented or historically grown data environment and: understood and mapped the existing landscape, identified data and integration gaps, defined the target architecture, established harmonized data models and governance, connected different data sources and domains, and created a scalable foundation for Analytics and AI. German language skills are preferable , while strong English communication skills are essential.", "first_seen": "2026-11-17T01:34:03.721834+00:00", "id": "1091741fb338e9cd", "matched_keywords": ["ems"], "published": "2026-11-16T19:59:59+01:00", "source": "freelancermap.de", "title": "Senior Data Architect & Data Modeler | Life Sciences - Fully Remote", "url": "https://www.freelancermap.de/projekt/senior-data-architect-und-data-modeler-life-sciences-fully-remote"}, {"description": "Guten Tag, für unseren K sell einsetzbaren Multi-Agent-Architektur, mit der sich auch andere komplexe Unternehmensaufgaben automatisieren lassen. Du entwickelst Systeme, in denen KI-Agenten eigenständig planen, Werkzeuge nutzen, Informationen austauschen, Ergebnisse überprüfen und gemeinsam Aufgaben lösen. Dein Profil Fundierte Erfahrung in der Entwicklung agentischer KI-Systeme. Sehr gute Python-Kenntnisse. Erfahrung mit LLMs, Tool Calling und Multi-Agent-Orchestrierung. Kenntnisse von Frameworks wie LangGraph, CrewAI, AutoGen oder vergleichbaren Technologien. Erfahrung mit APIs, Datenbanken und Softwarearchitekturen. Verständnis für zuverlässige, skalierbare und sichere KI-Systeme. Fähigkeit, komplexe Anforderungen eigenständig in funktionierende Software umzusetzen. Kenntnisse in Financial Modeling, Controlling oder Business Intelligence sind von Vorteil, aber keine Voraussetzung. Was wir bieten Ein innovatives Projekt an der Schnittstelle zwischen KI und Unternehmenssoftware. Große technische Gestaltungsfreiheit und eigenverantwortliches Arbeiten. Direkte Zusammenarbeit mit der Unternehmensführung. Ein internationales Entwicklungsumfeld. Die Möglichkeit, eine universelle Infrastruktur für autonome KI-Agenten mitzugestalten. Deine Bewerbung Uns interessiert vor allem, was du bereits entwickelt hast. Zeige uns konkrete Beispiele agentischer Systeme, ihre Architektur und welche Aufgaben sie eigenständig lösen. Ein GitHub-Repository, eine technische Dokumentation oder eine kurze Demonstration sind uns wichtiger als ein langer Lebenslauf. Entwickle mit uns KI-Systeme, die nicht nur denken, sondern handeln.", "first_seen": "2026-11-15T20:48:34.244308+00:00", "id": "b0f28b61dcece21f", "matched_keywords": ["ems"], "published": "2026-11-15T18:32:19+01:00", "source": "freelancermap.de", "title": "Senior Agentic AI Engineer (m/w/d)", "url": "https://www.freelancermap.de/projekt/senior-agentic-ai-engineer-m-w-d"}, {"description": "Junior AI & Automation Developer (m/w/d) – Gemeinsam eine KI-Infrastruktur aufbauen Über uns AIRUAS ist ein junges, wachsendes Unternehmen im Bereich Drohnendetektion, Drohnenabwehr und Sicherheitstechnologie. Wir entwickeln innovative Lösungen für Unternehmen, kritische Infrastrukturen und öffentliche Auftraggeber. Wir möchten unsere Unternehmensprozesse von Anfang an konsequent digital und KI-gestützt aufbauen. Dafür suchen wir einen motivierten Junior-Entwickler, Informatikstudenten oder technisch begeisterten Freelancer, der uns langfristig begleitet und gemeinsam mit uns wächst. Was wir vorhaben Wir möchten schrittweise eine zentrale KI- und Automatisierungsinfrastruktur aufbauen. Dazu gehören unter anderem: - Unternehmens-KI: Aufbau einer zentralen Wissensplattform, über die Mitarbeiter auf interne Dokumente, Produktwissen und technische Informationen zugreifen können. - KI-Agenten: Entwicklung intelligenter Assistenten für Vertrieb, Projektmanagement, technische Dokumentation und interne Prozesse. - Automatisierung: Aufbau von Workflows mit n8n, Power Automate oder vergleichbaren Tools. - CRM: Auswahl, Einführung und Automatisierung eines CRM-Systems inklusive Outlook- und Microsoft-365-Integration. - Projektmanagement: Automatische Erstellung und Verwaltung von Projekten, Aufgaben und Dokumentationen. - Dokumentenautomatisierung: Beispielsweise automatische Erstellung von Berichten aus Site Surveys, inklusive Prüfung, Freigabe und Ablage. - Systemintegration: Verbindung verschiedener Plattformen über APIs. Wir nutzen bereits Microsoft 365 und möchten darauf aufbauend eine möglichst effiziente und skalierbare Infrastruktur entwickeln. Wen wir suchen Du musst ausdrücklich kein Senior-Entwickler sein! Wir suchen jemanden, der: - Sich für künstliche Intelligenz, Automatisierung und neue Technologien begeistert. - Bereits erste Erfahrungen mit n8n, Make, Python, APIs oder KI-Agenten gesammelt hat. - Spaß daran hat, sich eigenständig in neue Tools einzuarbeiten. - Ideen einbringt und auch eigene Lösungsansätze entwickelt. - Zuverlässig arbeitet und langfristig Teil unserer Entwicklung werden möchte. Erfahrungen mit Microsoft 365, Langdock, SharePoint, CRM-Systemen oder lokalen KI-Modellen sind von Vorteil, aber keine Voraussetzung. Was wir bieten - Langfristige Zusammenarbeit statt eines kurzfristigen Einzelprojekts. - Flexible Arbeitszeiten und überwiegend Remote-Arbeit. - Spannende Projekte an der Schnittstelle zwischen KI, Automatisierung und Sicherheitstechnologie. - Viel Gestaltungsfreiheit und die Möglichkeit, eigene Ideen umzusetzen. - Gelegenheit, gemeinsam mit dem Unternehmen zu wachsen und perspektivisch technische Verantwortung zu übernehmen. - Faire, erfahrungsabhängige Vergütung und die Möglichkeit, den Umfang der Zusammenarbeit schrittweise auszubauen. Rahmenbedingungen - Start: Möglichst zeitnah - Umfang: Anfangs ca. 5–10 Stunden pro Woche, später gegebenenfalls mehr - Standort: Remote, Rhein-Main-Gebiet von Vorteil - Zusammenarbeit: Auf freiberuflicher Projektbasis - Vergütung: Nach Vereinbarung, bevorzugt Nachwuchstalente mit fairen Einstiegskonditionen Interesse? Dann freuen wir uns über eine kurze Vorstellung. Besonders interessieren uns deine bisherigen eigenen Projekte – egal ob kleine n8n-Automatisierungen, KI-Agenten oder selbst entwickelte Anwendungen. Bitte teile uns außerdem deinen gewünschten Stundensatz, deine zeitliche Verfügbarkeit und deine Vorstellungen für eine längerfristige Zusammenarbeit mit. Uns ist Motivation, Eigeninitiative und Lernbereitschaft wichtiger als ein perfekter Lebenslauf.", "first_seen": "2026-11-15T20:48:34.244308+00:00", "id": "4440b2936fc1c425", "matched_keywords": ["ems"], "published": "2026-11-15T18:16:16+01:00", "source": "freelancermap.de", "title": "Junior AI & Automation Developer – KI, n8n, Microsoft 365 | Langfristige Zusammenarbeit", "url": "https://www.freelancermap.de/projekt/junior-ai-und-automation-developer-ki-n8n-microsoft-365-langfristige-zusammenarbeit"}, {"description": "Projektrahmendaten Projektstart: Dezember 2026 od
