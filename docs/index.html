ription": "Für unseren Kunden suchen wir einen erfahrenen Power Platform & Power BI Consultant zur Unterstützung der digitalen Transformation im Finance-Umfeld. Im Fokus stehen die Weiterentwicklung datengetriebener Reporting- und Steuerungslösungen sowie die Digitalisierung und Automatisierung von Finance-Prozessen mit der Microsoft Power Platform. Rahmendaten o Start: Juli o Laufzeit: 6 Monate o Auslastung: Vollzeit o Einsatzort: Remote o Kundentyp: Endkunde Was gibt’s zu tun? o Konzeption, Entwicklung und Weiterentwicklung von Reporting- und Dashboard-Lösungen mit Microsoft Power BI für Finance und Controlling o Entwicklung datengetriebener KPI-, Analyse- und Performance-Management-Lösungen o Integration, Modellierung und Harmonisierung von Daten aus unterschiedlichen Quellsystemen, insbesondere SAP o Sicherstellung von Datenqualität, Konsistenz und Transparenz über verschiedene Datenquellen hinweg o Optimierung, Standardisierung und Konsolidierung bestehender Reporting-Landschaften o Entwicklung von Business-Anwendungen mit der Microsoft Power Platform, insbesondere Power Apps und Power Automate o Analyse und Übersetzung fachlicher Anforderungen aus Finance und Controlling in technische Lösungen o Weiterentwicklung von Planungs-, Reporting- und Steuerungsinstrumenten im Finance-Umfeld o Unterstützung bei Tests, Qualitätssicherung sowie Dokumentation der entwickelten Lösungen o Durchführung von Wissenstransfer und Beratung zu Power BI und Power Platform innerhalb der Fachbereiche o Zusammenarbeit mit Fachbereichen, IT-Teams und weiteren Stakeholdern in einem agilen Projektumfeld Was bringst du mit? (Knowledge & Skills) o Mehrjährige Erfahrung in Data Analytics-, Reporting- oder Digitalisierungsprojekten im Finance- oder Controlling-Umfeld o Fundierte Kenntnisse in Finance- und Controlling-Prozessen (Planung, Forecasting, Reporting, KPI-Steuerung) o Sehr gute Kenntnisse in Microsoft Power BI, insbesondere Datenmodellierung, DAX und Reporting Design o Erfahrung mit der Microsoft Power Platform (Power Apps, Power Automate) o Erfahrung in der Integration und Aufbereitung von Daten aus SAP-Systemen o Kenntnisse moderner Datenmodelle, SQL und Reporting-Architekturen o Idealerweise Erfahrung mit Microsoft Fabric, SAP Analytics Cloud oder vergleichbaren Analytics-Lösungen o Optional Kenntnisse in Python oder Cloud-Technologien o Fähigkeit, fachliche Anforderungen mit technischen Lösungen zu verbinden o Strukturierte, analytische und lösungsorientierte Arbeitsweise o Erfahrung in agilen Projektumfeldern, idealerweise nach SAFe o Sehr gute Deutschkenntnisse (mindestens C1) sowie gute Englischkenntnisse Bitte senden Sie Ihren CV an: anais@dynamix-project.com", "published": "2026-06-02T14:21:12+02:00", "matched_keywords": ["agil"], "source": "freelancermap.de", "first_seen": "2026-06-02T12:40:11.522566+00:00"}, {"id": "8f3616cfb35adad3", "title": "Projektleiter Ablösung SAP CRM / Einführung BSI CRM (m/w/d)", "url": "https://www.freelancermap.de/projekt/projektleiter-abloesung-sap-crm-einfuehrung-bsi-crm-m-w-d", "description": "Aufgaben: Aktuell suchen wir für unseren Kunden einen Projektleiter Ablösung SAP CRM / Einführung BSI CRM. Zu Ihren Aufgaben gehören: + Unterstützung unserer internen Projektleitung bei der Einführung unseres neuen CRM-Systems und gleichzeitigen Ablösung des alten SAP CRM Systems + Strukturierung der Aufgaben + Überblick über alle offenen ToDos und Meilensteine + Vorantreiben des Projektes + Gemeinsame Projektumsetzung mit unserem Projektteam + Einfordern der Einhaltung klarer Kommunikationswege, der Dokumentation aller Standards und Arbeitspakete + Abstimmungen mit dem internen Projektteam und den Dienstleistern + Durchführung von Workshop zur Erarbeitung der Themen + Herbeiführung von Entscheidungen + Führung des Projektteams mit unterschiedlichen Charakteren (Fördern, Fordern, Einbremsen, Motivieren) + Dokumentation von Terminen und Ergebnissen Projekt-Nr.: 106263 Projekttitel: Projektleiter Ablösung SAP CRM / Einführung BSI CRM (m/w/d) Stellentyp: freiberuflich Einsatzort: D3 Starttermin: Juli 2026 Dauer: 12 Monate, Auslastung 70-100% Anforderungen: + Erfahrung als Projektleiter 5 Jahre + + Erfahrung CRM Nice-to-Have: + Erfahrung im Energieumfeld Zusätzliche Informationen: Konnten wir Ihr Interesse wecken? Dann freuen wir uns auf die Zusendung Ihres aussagekräftigen Expertenprofils unter Angabe Ihrer Stundensatzvorstellung. SOLCOM zählt zu den führenden Technologiedienstleistern in den Bereichen Softwareentwicklung, IT und Engineering. Seit mehr als 20 Jahren arbeiten wir als Partner global agierender Spitzenunternehmen aller Branchen und sind weltweit im Einsatz, wo Innovation entscheidet.", "published": "2026-06-02T14:21:06+02:00", "matched_keywords": ["energie", "ems"], "source": "freelancermap.de", "first_seen": "2026-06-02T12:40:11.522566+00:00"}, {"id": "2a0419cd0eb4664e", "title": "Lead Analyst Requirements Engineering / Concept – Data Quality & Duplicate Prevention (BA)", "url": "https://www.freelancermap.de/projekt/lead-analyst-requirements-engineering-concept-data-quality-und-duplicate-prevention-ba", "description": "The Bundesagentur für Arbeit (BA) is looking for a Lead Analyst (Requirements Analysis / Concept) to lead the analysis and optimization of its core master data system STEP and online portal KUSOS – 100% remote. Background: Around 9% of all records in the STEP master data system are identified as duplicates, with approx. 30,000 new duplicates created monthly via the online channel. This results in 4,000+ hours of manual effort per month and risks incorrect payments. The project leverages the upcoming IDA data integration to systematically improve data quality and eliminate duplicates at the source. Tasks include: - Analysis of the existing STEP model and business processes (online and STEP) regarding their IT implementation - Quality management of requirements analysis (processes, methods and tools) - Supporting software architecture, development and project management - Ensuring accessibility compliance (Barrierefreiheit) - Leading the working group of analysts in close coordination with the internal PO - Developing the concept proposal for further implementation based on IST analysis - Working in agile frameworks (Scrum / Kanban) Tools & Methods: Innovator, ARIS, Confluence, JIRA, UML, BPMN Requirements: BA (Bundesagentur für Arbeit) experience mandatory. PDP experience mandatory. Security clearance Ü2 required or willingness to obtain. Workplace: 100% Remote", "published": "2026-06-02T14:18:06+02:00", "matched_keywords": ["requirements engineer", "agil", "scrum"], "source": "freelancermap.de", "first_seen": "2026-06-02T12:40:11.522566+00:00"}, {"id": "614cbdb15bbc1354", "title": "IS-U Experte (m/w/d) Schwerpunkt Tarifierung", "url": "https://www.freelancermap.de/projekt/is-u-experte-m-w-d-schwerpunkt-tarifierung", "description": "Für unseren Kunden suchen wir einen IS-U Experten (m/w/d) mit Schwerpunkt Tarifierung. Start: nach Absprache Laufzeit: 6 Monate ++ Einsatzort: Remote, punktuell vor Ort in Düsseldorf Auslastung: gerne 100%, 60%++ auch möglich Für ein Transformations- und Optimierungsprojekt im energiewirtschaftlichen Umfeld wird ein erfahrener SAP IS-U Berater mit Schwerpunkt Tarifierung gesucht. Im Fokus steht die Konzeption, Pflege und Weiterentwicklung von Tarifmodellen innerhalb der SAP IS-U Systemlandschaft. Ziel ist die Sicherstellung einer korrekten Abbildung energiewirtschaftlicher Produkte und Preisstrukturen unter Berücksichtigung regulatorischer sowie fachlicher Anforderungen. Der Berater unterstützt bei der Analyse bestehender Tarifmodelle, der Erstellung und Anpassung von Tarifen sowie der Pflege von Preisbestandteilen. Dabei arbeitet er eng mit den Fachbereichen Vertrieb, Abrechnung und Energiewirtschaft zusammen und stellt die korrekte Umsetzung tariflicher Anforderungen im System sicher. Aufgaben Erstellung, Pflege und Anpassung von Tarifen und Tariftypen in SAP IS-U Konzeption und Weiterentwicklung von Tarifmodellen und Preisstrukturen Pflege von Preisbestandteilen und tarifrelevanten Stammdaten Analyse und Umsetzung fachlicher Anforderungen aus den Bereichen Energiewirtschaft und Abrechnung Unterstützung bei Tests, Fehleranalysen und Qualitätssicherungsmaßnahmen Beratung der Fachbereiche hinsichtlich tariflicher und systemtechnischer Möglichkeiten Dokumentation von Tarifstrukturen und Customizing-Einstellungen Unterstützung bei regulatorischen Anpassungen und Marktanforderungen Anforderungen Mehrjährige Projekterfahrung im SAP IS-U Umfeld Tiefgehende Kenntnisse in Tariftyperstellung, Tarifbau und Preispflege Fundiertes Verständnis energiewirtschaftlicher Prozesse und Tarifstrukturen Erfahrung in der Pflege, Anpassung und Optimierung von Tarifmodellen Gute Kenntnisse der SAP IS-U Abrechnungs- und Stammdatenprozesse Analytische und strukturierte Arbeitsweise Kommunikationsstärke im Austausch mit Fachbereichen und Projektteams Sehr gute Deutschkenntnisse Hast du freie Kapazitäten und kannst unseren Kunden hier unterstützen? Dann freuen wir uns auf deine Rückmeldung mit folgenden Informationen an e.civelekATalpha-contractingPUNKTorg: - Deine Selbsteinschätzung zu den Kundenanforderungen - Verfügbarkeit und mögliche Auslastung - Stundensatz - aktuelles Profil inkl. relevanter Projekte und Erfahrungen Viele Grüße Elvan Civelek", "published": "2026-06-02T14:16:21+02:00", "matched_keywords": ["energie"], "source": "freelancermap.de", "first_seen": "2026-06-02T12:40:11.522566+00:00"}, {"id": "7e02a0ee8ef3d207", "title": "Senior Agile Coach für Produktteams (m/w/d)", "url": "https://www.freelancermap.de/projekt/senior-agile-coach-fuer-produktteams-m-w-d", "description": "Für ein anspruchsvolles Projekt bei unserem Kunden suchen wir einen erfahrenen Senior Agile Coach, der ein Produktteam sowie die zugehörigen Product Owner begleitet und die Zusammenarbeit, das agile Mindset sowie die Produktentwicklung nachhaltig weiterentwickelt. Der Fokus liegt dab d compliance standards Tasks: • Implementing monitoring and logging strategies to support audit and compliance requirements. • Performing routine security scans and remediating identified vulnerabilities. Runbooks and documentation Objective: Ensure documentation in accurate and up to date Tasks: • Providing feedback to owners of runbooks • Consulting on future improvements to runbooks Management of Small teams / Program Obligations Objective: Ensure team is running well Tasks: • Participate in Program initiatives and bringing back into the Product Line • Drive program changes in Product Line • Manage small team but still be handson Must-have experience • At least of 5 years of operational experience with self-managed Kubernetes clusters, self-managed services providing Kubernetes clusters and productive applications or systems in on premise environments • Deep understanding of networking concepts, including protocols, load balancing, and security. • Profound knowledge and implementation experience with CI/CD processes, tooling (e.g. GitLab, Jenkins, Tekton, Argo Workflows, and Argo CD), concepts and associated quality and security assurance for software delivery • Fundamental understanding of core operations processes (incident management, change management, problem management, IT Service Management) as well as SRE concepts • Experience in gathering operational insights from monitoring or observability including SLI/SLA/SLO management and tracking. • Hand-on experience in documenting procedures properly and enforcing clear runbooks or playbooks. • Hands-on experience with monitoring and logging tools (e.g., Prometheus, Grafana, Datadog). Must-have language skills: • Proficiency in both speech and writing in English (at least C1). Preferred experience • Project experience in software engineering (in Go Lang, C/C++ or Python) with significant experience in building RESTful services in distributed environments. Ort: Remote + Frankfurt (ca. 1-3 Tage pro Monat am Stück)
